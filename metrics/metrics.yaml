# =====================================================================
# OSS911 BI/DW  指标定义  metrics.yaml
#
# 本文件是指标口径的唯一权威（LD-03 第 5 章）。库内的 meta.metric_registry
# 是部署时同步的只读副本；M-04 指标字典界面只读。
#
# 三条规则，违反其一不得合并：
#   1. grain 必填。含糊的「平均到场时长」不允许存在——按出警单、按派警单、
#      按接警单是三个不同的定义，各占一个编码。
#   2. aggregation 必填。指标是可上报的数，不是事实表上的度量列。
#   3. 口径变更（分母、过滤、时间边界、粒度）必须递增 version。历史报表不自动
#      重算：旧版本的数保持原样，新版本自生效日起用。
#
# entity_date 决定归日：
#   date_key        发生类——当日派单量、当日出动量，封账即完整
#   closed_date_key 结案类——当日结案数、处置时长，按 CAD 上手动关闭的日期归属
# =====================================================================
version: 1
generated_from: HD-05 指标注册表（初稿），按 LD-03 修正粒度与聚合
