# dbt project of OSS911 BI (LD-02 · LD-03). Deployed from the release directory to /opt/oss911/dbt by 50-dags.yml
# and run by Airflow through BashOperator, like the ingestion program (DD-84).
#
# Rules this project lives by (CLAUDE.md section 6 · LD-02 chapter 13 · DD-91):
#   - the profile sets role: oss911_transform; staging, mart and ai belong to it, core does not
#   - core is written incrementally into the existing tables only; dbt is not core's owner, and --full-refresh of a
#     core model is refused (full_refresh: false below) -- a rebuild goes through reprocessing the batches instead
#   - write only rows whose content really changed (DD-78), staging consumes raw by batch (DD-89)
#   - no dbt packages: offline network, licences, eight years of maintenance (DD-91, development side's item 1)
name: oss911
version: "1.0.0"
config-version: 2
profile: oss911

# Offline network: dbt must not try to send usage statistics anywhere (it would wait on a connection that never comes)
flags:
  send_anonymous_usage_stats: false

model-paths: ["models"]
macro-paths: ["macros"]
test-paths: ["tests"]
clean-targets: []

on-run-start:
  - "{{ create_safe_casts() }}"            # target and logs live outside the read-only project directory (--target-path, --log-path)

# Every model and test result into meta.check_result (DD-100, change 0017; macros/check_results.sql)
on-run-end:
  - "{{ record_check_results(results) }}"

vars:
  site_code: MKK             # DD-91 item 2; dim_site's row is written by structural change 0006
  report_timezone: Asia/Riyadh   # date_key is the day in this zone; day cut 00:00 AST (LD-02 chapter 6, AS-12)
  service_level_seconds: 20  # M-C05's X (metrics.yaml params x_seconds); another X is a new metric version and column
  repeat_min_failed: 2       # M-C15: failed calls a day that make a repeat caller (metrics.yaml params min_failed)
  # agent_day_totals_decrease checks days from this one on: the development machine's day totals before it came from
  # a fake ICP whose idle time could go down (fixed 2026-11-22, running there from 2026-11-23 17:02 on, so that day
  # mixes the two); production has no earlier day totals
  agent_day_totals_checked_from: 20261124
  # mart_closing_not_behind: a mart table whose latest closed day is more than this many days back fails the nightly
  # test. The monitoring channel's alert OSS911ClosingBehind uses closing_lag_days of contracts/monitoring.yml: the two
  # must be equal, and 55-monitor refuses a release where they are not (infra/files/monitoring_install.py)
  closing_lag_days: 3
  check_result_keep_days: 90  # meta.check_result retention (DD-100 item 7); the function refuses fewer than 90
  # agent_day_reconciles_with_legs (DD-100 item five, review note item two): a day differs when its inbound calls and
  # the agent's answered legs differ by more than max(min_calls, ratio x legs); over the closed days of the last N days
  agent_reconcile: {min_calls: 2, ratio: 0.02, days: 7}

models:
  oss911:
    staging:
      +schema: staging
    core:
      +schema: core
      +full_refresh: false   # core belongs to oss911_owner; dbt may not drop or recreate it (DD-74)
    meta:
      +schema: meta
      +full_refresh: false   # meta.reference_value is created by the structural changes, like core (DD-94 item eleven)
    mart:
      +schema: mart
      # Closed versions are history the reports were served from (DD-81): dbt may never drop or rebuild a mart table
      +full_refresh: false
      calc:
        +schema: staging       # the inputs of the mart tables, views over core; not readable by the service layer
        +materialized: view
