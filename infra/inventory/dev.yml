# 开发环境 inventory
#
# 版本号与规格集中在这里，剧本里不写死。
# 八年合同期内必然跨一次 OS 大版本与一次 PG 大版本，参数化是为了让那次跨版本廉价。
all:
  hosts:
    dev01:
      ansible_host: 10.55.223.118
      ansible_user: usr
      # 控制节点就是这台机器本身（见 runbook/02）。在机器上自运行时加：
      #   -e ansible_connection=local
      # 保留 ansible_host 与 ansible_user 是为了将来从别处驱动时不用改 inventory。
  vars:
    # ---- 版本基线（与 compliance/components.csv 保持一致）----
    os_distribution: Ubuntu
    os_release: noble                   # Ubuntu 24.04 LTS
    postgres_version: 16
    python_version: "3.12"

    # ---- 本地化：与生产一致，不取开发机默认值 ----
    system_timezone: Asia/Riyadh
    system_locale: en_US.UTF-8

    # ---- 基线包集 ----
    # 分组即理由。改这个列表要同时更新 artifacts/MANIFEST.md 的 OS 行。
    base_packages:
      # 基础操作（acl 是 Ansible 切换用户时要用的，缺了报的错很难看懂）
      - locales
      - ca-certificates
      - curl
      - gnupg
      - git
      - rsync
      - unzip
      - jq
      - acl
      # 编辑器：两个都装，交接后接手的人习惯不同
      - nano
      - vim
      # 卷管理
      - lvm2
      # 排障工具：出问题那一刻才想起来装，而那时可能正好没网
      - htop
      - sysstat
      - iotop
      - lsof
      - strace
      - tcpdump
      # Ansible 目标机运行时
      - python3-venv
      - python3-pip

    # ---- 数据库 ----
    # 监听地址与放行网段：开发机上一切都在同一台机器上，回环就够；
    # 生产上 pgBouncer 与 HAProxy 在 LB 虚机、PostgreSQL 在库虚机，
    # 库必须监听内网地址并放行 LB 节点所在网段。两边的差别收在这两个值里，
    # 剧本与模板不动。
    #   生产取值示例：
    #     pg_listen_addresses: "localhost,<库虚机的应用流量网段地址>"
    #     pg_hba_allow:
    #       - { cidr: "<LB 节点网段>/24", method: "scram-sha-256", comment: "LB 节点的 HAProxy" }
    #   另见 LD-08 NW-01：复制、应用、管理三类流量走独立网段，
    #   此处监听的是应用流量段，复制流量另有其地址。
    pg_listen_addresses: "localhost"
    pg_hba_allow: []

    pg_cluster_name: main
    pg_port: 5432
    pg_database: oss911
    pg_waldir: /var/lib/postgresql/wal
    database_packages:
      - "postgresql-{{ postgres_version }}"
      - "postgresql-{{ postgres_version }}-postgis-3"
      - "postgresql-client-{{ postgres_version }}"
      - postgresql-common
    pg_extensions:
      - postgis
      - pgcrypto        # core.sk 的 UUID v5 需要 digest()

    # ---- 连接层 ----
    # 两个池模式，因为两类客户端对连接的要求不同（DD-67）：
    #   事务级省连接，但 SET、临时表、advisory lock、预处理语句不保证落在同一后端；
    #   会话级保行为，但连接在客户端断开前不归还。
    # 会话池大小即 dbt 的并发上限——这两个数绑在一起，调一个必须同时调另一个。
    connection_packages:
      - pgbouncer
      - haproxy
    # ★ pgBouncer 一个实例只有一个 listen_port。两个「池」不是两个端口，
    #   而是 [databases] 段里的两条库名，都在同一端口上，
    #   由客户端连哪个库名决定用哪种池模式。要两个端口得起两个实例。
    pgb_listen_port: 6432
    pgb_pool_size_txn: 30
    pgb_pool_size_session: 10          # = dbt threads 的上限
    pgb_pool_size_keycloak: 10         # Keycloak 的 JDBC 池，同样走会话级
    pgb_reserve_pool: 5
    pgb_max_client_conn: 400           # 客户端侧可以多，后端才是稀缺的
    pgb_max_db_connections: 60         # 全局硬闸：30 + 10 + 10 + 5，防止池数一多悄悄超限
    haproxy_listen_port: 5000          # pgBouncer 的后端指向它，而不是直接指向库
    haproxy_stats_port: 7000
    # 开发机没有 Patroni，健康检查只能退化为 pgsql-check；生产用 Patroni 的
    # REST /primary，这一段在开发机上不等于生产（runbook/05）。
    haproxy_health_check: pgsql-check
    haproxy_check_user: postgres
    # 开发机只有一台库，后端就一个。生产是三台库 + Patroni REST 健康检查，
    # 届时改的是本列表与 haproxy_health_check，剧本与模板不动。
    haproxy_backends:
      - {name: pg_local, addr: "127.0.0.1:{{ pg_port }}"}

    # ---- 容器运行时包 ----
    # netavark 与 aardvark-dns 必须显式列出：它们在 Ubuntu 是 Recommends 而非
    # Depends，缺了之后容器之间无法按名字互相解析，而报错是「连接被拒绝」，
    # 看不出是 DNS 的问题。
    container_packages:
      - podman
      - netavark
      - aardvark-dns
      # iptables 必须显式装：netavark 配置网桥时要调用它，而 minimal 装机不含。
      # 缺了之后报的是「netavark: No such file or directory」——听起来像 netavark
      # 自己不在，实际是 netavark 找不到 iptables。这条错误信息极具误导性。
      - iptables
      - catatonit        # 容器内的 init，避免僵尸进程
      - uidmap           # 将来若改 rootless 要用
      - slirp4netns

    # ---- LVM 卷：最小尺寸断言 ----
    # 剧本只校验不创建。卷在装机时手工建好，剧本负责发现漂移。
    required_mounts:
      - { path: /,                       min_gb: 90  }
      - { path: /var/lib/containers,     min_gb: 75  }
      - { path: /var/lib/postgresql,     min_gb: 330 }
      - { path: /var/lib/postgresql/wal, min_gb: 35  }
      - { path: /var/lib/seaweedfs,      min_gb: 55  }
      - { path: /var/cache/build,        min_gb: 55  }
      - { path: /var/backups/pg,         min_gb: 45  }
    vg_name: ubuntu-vg
    vg_free_min_gb: 200                  # 预留给在线扩容，低于此值告警

    # ---- 容器化组件（第 6 步）----
    # 镜像一律按 digest 钉死，不按 tag。tag 会被重新发布，digest 不会——
    # 离网重建时 digest 是「这是同一个镜像」的唯一依据。
    # 首次拉取时 digest 留空，剧本会把解析出的 digest 打出来，当场填回本文件与
    # artifacts/MANIFEST.md；此后每次运行都按 digest 拉并校验。
    container_images:
      keycloak:
        ref: "quay.io/keycloak/keycloak:26.0"
        digest: ""
      seaweedfs:
        ref: "docker.io/chrislusf/seaweedfs:3.80"
        digest: ""
      prometheus:
        ref: "docker.io/prom/prometheus:v2.55.1"
        digest: ""

    # 容器连库不直连 PostgreSQL，走宿主机 pgBouncer 的会话池（DD-67 的拓扑，
    # Keycloak 也是应用，不该有例外）。地址用 internal 网段的网关——
    # 容器里的 127.0.0.1 是容器自己。
    #
    # ★ 为什么不让 PostgreSQL 直接监听这个网关地址：podman 的网桥只在有容器
    #   挂着时才存在，而 systemd 启动 postgresql 一定早于容器。PG 对绑不上的
    #   地址是跳过并继续，于是它「正常启动」却少绑了一个地址——每次开机重现。
    #   pgBouncer 监听 0.0.0.0，没有这个顺序依赖。
    podman_internal_gateway: "10.89.10.1"

    keycloak_db: keycloak
    keycloak_http_port: 8080            # 仅绑 127.0.0.1，开发机不对外
    keycloak_mgmt_port: 9000            # KC 25 起健康检查与指标走独立管理端口
    seaweedfs_dir: /var/lib/seaweedfs
    seaweedfs_s3_port: 8333
    seaweedfs_filer_port: 8888
    seaweedfs_master_port: 9333
    prometheus_port: 9090
    prometheus_retention: 15d           # 开发机留 15 天即可；生产按 LD-08 的留存要求另定

    # ---- 容器网络：单机上模拟生产的两个网段 ----
    podman_networks:
      - { name: internal, subnet: "10.89.10.0/24" }   # 库、服务层、编排、身份
      - { name: dmz,      subnet: "10.89.20.0/24" }   # 仅反向代理
