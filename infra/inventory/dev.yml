# Development environment inventory
#
# Version numbers and capacities live here; nothing is hard-coded in the playbooks.
# Over an eight-year contract there will certainly be one OS major upgrade and one PG major upgrade;
# parameterising makes that upgrade cheap.
all:
  hosts:
    dev01:
      ansible_host: 10.55.223.118
      ansible_user: usr
      # The control node is this machine itself (see runbook/02). When running on the machine add:
      #   -e ansible_connection=local
      # ansible_host and ansible_user are kept so that driving it from elsewhere later needs no inventory change.
  vars:
    # ---- Version baseline (keep in line with compliance/components.csv) ----
    os_distribution: Ubuntu
    os_release: noble                   # Ubuntu 24.04 LTS
    postgres_version: 16
    python_version: "3.12"

    # ---- Localisation: same as production, not the development machine's defaults ----
    system_timezone: Asia/Riyadh
    system_locale: en_US.UTF-8

    # ---- Baseline packages ----
    # The grouping is the reason. Changing this list means updating the OS row of artifacts/MANIFEST.md too.
    base_packages:
      # Basic operations (acl is needed when Ansible switches users; without it the error is hard to understand)
      - locales
      - ca-certificates
      - curl
      - gnupg
      - git
      - rsync
      - unzip
      - jq
      - acl
      # Editors: both, since whoever takes over after handover may prefer either
      - nano
      - vim
      # Volume management
      - lvm2
      # Troubleshooting tools: you only think of installing them when something breaks, and right then there may be no network
      - htop
      - sysstat
      - iotop
      - lsof
      - strace
      - tcpdump
      # Ansible target runtime
      - python3-venv
      - python3-pip

    # ---- Database ----
    # Listen addresses and allowed networks: on the development machine everything is on one host and loopback
    # is enough; in production pgBouncer and HAProxy are on the LB VMs and PostgreSQL on the database VMs, so the
    # database must listen on the internal address and allow the LB nodes' network. The difference between the two
    # is confined to these two values; playbooks and templates do not change.
    #   Production example:
    #     pg_listen_addresses: "localhost,<address of the database VM on the application traffic network>"
    #     pg_hba_allow:
    #       - { cidr: "<LB node network>/24", method: "scram-sha-256", comment: "HAProxy on the LB nodes" }
    #   See also LD-08 NW-01: replication, application and management traffic use separate networks;
    #   this is the application traffic network, replication has its own address.
    pg_listen_addresses: "localhost"
    pg_hba_allow: []

    pg_cluster_name: main
    pg_port: 5432
    pg_database: oss911
    pg_waldir: /var/lib/postgresql/wal
    database_packages:
      - "postgresql-{{ postgres_version }}"
      - "postgresql-{{ postgres_version }}-postgis-3"
      - "postgresql-client-{{ postgres_version }}"
      - postgresql-common
    pg_extensions:
      - postgis
      - pgcrypto        # no current DDL depends on it: core.sk uses uuid-ossp (created by change 0001); whether to keep it is open (NOTES.md)

    # ---- Connection layer ----
    # Two pool modes, because two kinds of client need different things from a connection (DD-67):
    #   transaction mode saves connections, but SET, temporary tables, advisory locks and prepared statements
    #   are not guaranteed to land on the same backend;
    #   session mode preserves behaviour, but a connection is not returned until the client disconnects.
    # The session pool size is dbt's concurrency limit -- the two numbers are tied; change one, change the other.
    connection_packages:
      - pgbouncer
      - haproxy
    # * A pgBouncer instance has exactly one listen_port. The two "pools" are not two ports but two database
    #   names in the [databases] section, on the same port; the database name a client connects to decides the
    #   pool mode. Two ports would need two instances.
    pgb_listen_port: 6432
    pgb_pool_size_txn: 30
    pgb_pool_size_session: 10          # = upper limit of dbt threads
    pgb_pool_size_keycloak: 10         # Keycloak's JDBC pool, also session mode
    pgb_reserve_pool: 5
    pgb_max_client_conn: 400           # the client side can be large; the backend is the scarce side
    pgb_pool_size_cad_mirror: 5        # DS's sync program writing the CAD mirror, session mode (DD-90, LD-08 chapter 8)
    pgb_max_db_connections: 75         # global hard cap: 30 + 10 + 10 + 10 + 5 + 5, so many pools cannot silently exceed the limit
    haproxy_listen_port: 5000          # pgBouncer's backends point here, not directly at the database
    haproxy_stats_port: 7000
    # The development machine has no Patroni, so the health check falls back to pgsql-check; production uses
    # Patroni's REST /primary. This part is not production on the development machine (runbook/05).
    haproxy_health_check: pgsql-check
    haproxy_check_user: postgres
    # One database on the development machine, so one backend. Production has three databases plus the Patroni
    # REST health check; then this list and haproxy_health_check change, not the playbooks or templates.
    haproxy_backends:
      - {name: pg_local, addr: "127.0.0.1:{{ pg_port }}"}

    # ---- Container runtime packages ----
    # netavark and aardvark-dns must be listed explicitly: on Ubuntu they are Recommends, not Depends; without
    # them containers cannot resolve each other by name, and the error is "connection refused", which does not
    # look like DNS at all.
    container_packages:
      - podman
      - netavark
      - aardvark-dns
      # iptables must be installed explicitly: netavark calls it to configure bridges, and a minimal install lacks it.
      # Without it the error is "netavark: No such file or directory" -- it sounds as if netavark itself is missing,
      # but netavark cannot find iptables. A thoroughly misleading message.
      - iptables
      - catatonit        # init inside containers, prevents zombie processes
      - uidmap           # needed if we ever go rootless
      - slirp4netns

    # ---- LVM volumes: minimum size assertions ----
    # The playbooks only verify, never create. Volumes are created by hand at install time; the playbooks detect drift.
    required_mounts:
      - { path: /,                       min_gb: 90  }
      - { path: /var/lib/containers,     min_gb: 75  }
      - { path: /var/lib/postgresql,     min_gb: 330 }
      - { path: /var/lib/postgresql/wal, min_gb: 35  }
      - { path: /var/lib/seaweedfs,      min_gb: 55  }
      - { path: /var/cache/build,        min_gb: 55  }
      - { path: /var/backups/pg,         min_gb: 45  }
    vg_name: ubuntu-vg
    vg_free_min_gb: 200                  # reserved for online extension; warn below this

    # ---- Python side (step 7) ----
    # Separate venvs, not one. Airflow's and dbt's dependencies have conflicted for a long time (jinja2, protobuf, ...);
    # put together they either fail to install or one side is silently downgraded. Airflow calls the dbt executable
    # with BashOperator; the two share only the project directory, not the interpreter environment.
    python_bin: /usr/bin/python3            # Ubuntu 24.04 ships 3.12; Airflow 3.2+ supports 3.10-3.14
    venv_root: /opt/oss911
    airflow_home: /var/lib/airflow
    wheelhouse: /var/cache/build/wheelhouse  # dedicated volume (asserted in 00-base)
    # Fetching is off by default. It needs the network, while this playbook is written for offline use --
    # if every run went to PyPI to resolve dependencies, the playbook could not run on a really offline machine.
    # To refresh the wheelhouse, switch it on explicitly: -e wheelhouse_refresh=true
    # When a wheelhouse subdirectory is empty it runs once automatically; afterwards back the wheelhouse up onto the media.
    wheelhouse_refresh: false

    airflow_version: "3.3.2"
    airflow_extras: "postgres"
    # The official constraints are a hard requirement for Airflow to install into a working environment, not a suggestion.
    # The URL depends on the version and the Python minor version; if either changes, fetch again.
    airflow_constraints_url: "https://raw.githubusercontent.com/apache/airflow/constraints-{{ airflow_version }}/constraints-3.12.txt"
    # SHA-256 of the constraints file -- the same value as in artifacts/MANIFEST.md (DD-83).
    # 30-python asserts the file matches before installing and fails otherwise -- pinning a value needs a step
    # that fails when it does not match, or it is pinned on paper only. When upgrading Airflow: after the fetch the
    # playbook reports the new file's actual value; verify it against upstream and change both this and MANIFEST.
    airflow_constraints_sha256: "821effd0f491975682f2774fca3427d7bc2f59ca6de68dcb413ad2c8f890e58c"
    airflow_api_port: 8081                  # 8080 is taken by Keycloak

    # dbt has no official constraints. We resolve once, freeze the result into a lock file in the repository,
    # and always install by that lock -- a self-maintained lock does the same job as official constraints;
    # the only difference is who maintains it (DD-69).
    dbt_requirements:
      - "dbt-core"
      - "dbt-postgres"
    # Re-resolve dbt dependencies (network needed). Off by default: the lock is in the repository
    # (infra/dbt-requirements.lock) and is the single authority (DD-83). To upgrade dbt: -e dbt_relock=true -- the
    # result is written straight back to the repository path and reviewed as a diff before committing; the resolved
    # result is a candidate, committing makes it effective.
    dbt_relock: false

    # The ingestion program (DD-84 · LD-01 2.5): its own venv-ingest, dependencies frozen in the repository's
    # infra/ingest-requirements.lock, same approach as dbt (DD-83). Driver psycopg 3 (DD-86).
    # setuptools is listed because building our own package offline needs it (--no-build-isolation).
    # A new dependency needs its licence confirmed first (LD-09 4.2), plus updates to MANIFEST and compliance/components.csv.
    ingest_requirements:
      - "psycopg[binary]"
      - "PyYAML"
      - "setuptools"
    ingest_relock: false
    # Runtime configuration of the ingestion program (LD-01 2.5), written by 30-python.yml into /etc/oss911.
    # The database is reached through pgBouncer's session pool (DD-85: the advisory lock lives in the session).
    ingest_db_host: 127.0.0.1
    ingest_db_name: "{{ pg_database }}"          # the session pool, named like the database (DD-93)
    # icp.env: ICP gateway address and service account. Variable names follow the released contracts
    # (host_ref icp_cms_gateway, credential_ref icp_cms_service_account in if03a).
    #   generate: true only on the development machine, where the account belongs to the fake ICP interface (AS-32).
    #   Production sets false: operations write the file with the account issued by ICP operations, and the
    #   playbook only checks that it is complete.
    icp_env:
      generate: true
      host_var: OSS911_HOST_ICP_CMS_GATEWAY
      host_value: "http://127.0.0.1:18080"      # the fake interface; listens on 127.0.0.1 only
      cred_prefix: OSS911_CRED_ICP_CMS_SERVICE_ACCOUNT
      dev_user: bi_ingest_dev

    # Airflow's global pools (DD-85 · LD-08 3.3). A pool is a row in the metadata database, shared by the whole
    # cluster, not one per machine. Created by the playbook, not by hand in the UI -- hand-made pools are not under
    # version control and are lost when the environment is rebuilt.
    airflow_pools:
      - name: icp_cms
        slots: 1
        description: "ICP CDR download: the interface does not support concurrent downloads (LD-01 4.2)"
      - name: dbt_build
        slots: 1
        description: "dbt builds: two nodes at once would exceed the pgBouncer session pool in total threads (DD-67, DD-85)"

    airflow_db: airflow
    pgb_pool_size_airflow: 10

    # ---- Secrets kept on the control node (outside the repository) ----
    # The authoritative copy of secrets that every node must share (Airflow's jwt_secret and fernet_key, DD-85 note),
    # distributed by the playbooks. On the development machine the control node is this machine. In production: on
    # the control node chosen in LD-08's deployment inventory, root 0700, backed up with it.
    control_secrets_dir: /etc/oss911/control

    # ---- CAD mirror database (DD-90 · LD-08 chapter 8), 41-cad-mirror.yml ----
    # A separate database that DS's sync program writes the CAD views into; we read it with oss911_ingest.
    cad_mirror_db: cad_mirror
    # false until the formal software release: the DDL may still change after DS's countersignature, and the
    # development database is then rebuilt (-e cad_mirror_rebuild=true). Set true at the release: from then on an
    # executed change is never modified (DD-73), as for oss911.
    cad_mirror_ddl_frozen: false
    # Role-level limits on DS's transactions (CAD mirror specification section 4)
    cad_mirror_writer_statement_timeout: 120s
    cad_mirror_writer_idle_timeout: 60s

    # ---- Database structure (step 8) ----
    # Structural change files are copied here from the repository and executed from here: postgres cannot read the
    # repository under /home (troubleshooting entry 23); in production this is where the release artifact is unpacked.
    ddl_dir: /opt/oss911/ddl
    # Database login users. All of their privileges come from the privilege roles they are members of
    # (DD-74 · LD-02 chapter 13); the users themselves hold no grants -- changing people or rotating passwords never touches grants.
    # Only the two with an existing consumer are created now: ingestion and dbt are both started by Airflow (owner airflow).
    # The service layer's query_svc / admin_svc users are created together with the service layer -- created now,
    # no program would use them, and they would only be two more passwords nobody rotates.
    #   env_prefix decides the variable names in the env file: DBT_USER / DBT_PASSWORD are the names the dbt profile reads
    db_logins:
      - { name: ingest, role: oss911_ingest,    env_file: ingest.env, env_prefix: INGEST_DB, file_owner: airflow }
      - { name: dbt,    role: oss911_transform, env_file: dbt.env,    env_prefix: DBT,       file_owner: airflow }
    # Initial partition window, monthly (DD-77): previous month, this month, three months ahead. From then on
    # orchestration calls meta.ensure_monthly_partitions to create future months in advance -- until orchestration is
    # in place the window runs out after partition_months_ahead months; then rerun the playbook to move it forward.
    # Earlier months (e.g. ICP historical backfill) are not handled by raising this; the backfill job creates its partitions first.
    partition_months_back: 1
    partition_months_ahead: 3

    # ---- Containerised components (step 6) ----
    # Images are always pinned by digest, not by tag. Tags get re-published, digests do not --
    # in an offline rebuild the digest is the only proof that "this is the same image".
    # On the first pull the digest is left empty; the playbook prints the resolved digests, to be filled back into this
    # file and artifacts/MANIFEST.md on the spot; from then on every run pulls and verifies by digest.
    # After changing a digest here, rerun 22-containers and expect a change (troubleshooting entry 28).
    container_images:
      keycloak:
        ref: "quay.io/keycloak/keycloak:26.0"
        digest: "sha256:09a381c715ab0b111835b70f2905955274843a219c6f27efb348e4d9f4086858"
      seaweedfs:
        ref: "docker.io/chrislusf/seaweedfs:3.80"
        digest: "sha256:1055999e08eed1789b0ae45d235126e4495e23d3fb9d6396293fd42539b1ae6a"
      prometheus:
        ref: "docker.io/prom/prometheus:v2.55.1"
        digest: "sha256:2659f4c2ebb718e7695cb9b25ffa7d6be64db013daba13e05c875451cf51b0d3"

    # Containers do not connect to PostgreSQL directly; they use the host pgBouncer's session pool (the DD-67 topology --
    # Keycloak is an application too and gets no exception). The address is the internal network's gateway --
    # 127.0.0.1 inside a container is the container itself.
    #
    # * Why PostgreSQL does not listen on this gateway address directly: the podman bridge exists only while a container
    #   is attached, and systemd always starts postgresql before the containers. PG skips addresses it cannot bind and
    #   carries on, so it "starts normally" with one address missing -- on every boot.
    #   pgBouncer listens on 0.0.0.0 and has no such ordering dependency.
    podman_internal_gateway: "10.89.10.1"

    keycloak_db: keycloak
    keycloak_http_port: 8080            # bound to 127.0.0.1 only; not exposed on the development machine
    keycloak_mgmt_port: 9000            # since KC 25 health checks and metrics use a separate management port
    seaweedfs_dir: /var/lib/seaweedfs
    seaweedfs_s3_port: 8333
    seaweedfs_filer_port: 8888
    seaweedfs_master_port: 9333
    prometheus_port: 9090
    prometheus_retention: 15d           # 15 days is enough on the development machine; production follows LD-08's retention requirements

    # ---- Container networks: the two production segments simulated on one host ----
    podman_networks:
      - { name: internal, subnet: "10.89.10.0/24" }   # database, service layer, orchestration, identity
      - { name: dmz,      subnet: "10.89.20.0/24" }   # reverse proxy only
