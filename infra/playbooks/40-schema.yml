# 40-schema -- database structure: structural changes, database login users, initial partitions
#
# Basis: DD-73 (structural change mechanism, LD-08 7.5) · DD-74 (database roles, LD-02 chapter 13)
# Prerequisites: 20-database (the database) · 21-connection (pgBouncer; the final login check goes through it) ·
#                30-python (the airflow account, owner of the env files)
#
# * Terminology: "structural change", not "migration" -- in this project "migration" means only the
#   migration of archive data (DD-73).
#
# * Idempotence comes from "has this change been executed", not from "does this object exist".
#   The executor reads ddl/changes.yml and compares it entry by entry with the rows in meta.ddl_change:
#     registered, checksum unchanged -> skip
#     registered, checksum changed   -> fail. An executed change must not be modified; changes go into a new change
#     not registered                 -> execute in id order, each change together with its registry row in one transaction
#   CREATE TABLE IF NOT EXISTS is wrong here: when the table exists but its definition changed, it skips
#   silently, the second run shows changed=0, and the database still has the old structure.
#
# * The executor is this playbook plus psql -- no separate tool, nothing like Flyway: every extra tool is one
#   more dependency to carry into the offline network and maintain for eight years (DD-70 · LD-08 7.5).

- name: Database structure
  hosts: all
  # This playbook uses no facts (checked one by one on 2026-10-13: no ansible_* references in the
  # playbook, tasks/ or templates, and no fact-dependent package / service modules). Gathering facts
  # as root scans LVM and every block device, which on this machine sometimes takes minutes -- so we
  # do not gather what we do not need. To use a fact, delete this line and say here which fact is used.
  gather_facts: false
  become: true

  vars:
    oss911_etc: /etc/oss911
    repo_ddl: "{{ playbook_dir }}/../../ddl"
    repo_test: "{{ playbook_dir }}/../../test"
    # The manifest is read on the control node (on the development machine the control node is this machine)
    ddl_changes: "{{ lookup('ansible.builtin.file', repo_ddl ~ '/changes.yml') | from_yaml }}"

  tasks:

    # ================= 1. Preconditions =================

    - name: Query whether the business database exists
      ansible.builtin.command:
        cmd: psql -X -tA -c "SELECT count(*) FROM pg_database WHERE datname = '{{ pg_database }}'"
      become_user: postgres
      register: _db
      changed_when: false
      check_mode: false

    - name: Assert the business database exists
      ansible.builtin.assert:
        that:
          - _db.stdout | trim == '1'
        fail_msg: "Database {{ pg_database }} does not exist. Run 20-database.yml first"
        success_msg: "Database {{ pg_database }} exists"

    # The manifest's own rules are guarded by an assert, not by eyeballing during review
    - name: Assert the change manifest ids are consecutive and run_as is valid
      ansible.builtin.assert:
        that:
          - (ddl_changes | map(attribute='id') | list) == (ddl_changes | map(attribute='id') | sort | unique | list)
          - (ddl_changes | map(attribute='id') | map('int') | list) == range(ddl_changes | length) | list
          - ddl_changes | selectattr('id', '>=', '0003') | rejectattr('run_as', 'equalto', 'owner') | list | length == 0
          - ddl_changes | rejectattr('run_as', 'in', ['superuser', 'owner']) | list | length == 0
        fail_msg: >-
          ddl/changes.yml is invalid. Required: ids consecutive from 0000, in order, no duplicates;
          run_as is superuser or owner only, and owner from 0003 on (new objects must belong to the owner role, DD-74).
          Current ids: {{ ddl_changes | map(attribute='id') | join(' ') }}
        success_msg: "Change manifest valid: {{ ddl_changes | length }} changes, {{ ddl_changes | map(attribute='id') | first }} to {{ ddl_changes | map(attribute='id') | last }}"

    # ================= 2. Load the DDL files =================
    # Copied from the repository to ddl_dir, where postgres reads them.
    # Files deleted from the repository do not disappear from here (incremental directories accumulate history,
    # CLAUDE.md section 5, item four). That is harmless here: the executor only runs files listed in changes.yml,
    # and by rule the files of executed changes are never deleted or modified. But do not infer from it that
    # "whatever is in ddl_dir is in use".

    - name: Create the DDL directory
      ansible.builtin.file:
        path: "{{ ddl_dir }}"
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Copy the DDL files
      ansible.builtin.copy:
        src: "{{ repo_ddl }}/"
        dest: "{{ ddl_dir }}/"
        owner: root
        group: root
        mode: "0644"
        directory_mode: "0755"

    # ================= 3. Structural changes =================

    # The checksum follows the definition in the header of changes.yml: SHA-256 of the files' bytes concatenated
    # in the order of "files". It is computed on the target, over the copy that will be executed, not in the repository.
    - name: Compute the file checksum of every change
      ansible.builtin.shell:
        cmd: cat {{ item.files | join(' ') }} | sha256sum | cut -d' ' -f1
        chdir: "{{ ddl_dir }}"
      loop: "{{ ddl_changes }}"
      loop_control:
        label: "{{ item.id }}"
      register: _sha
      changed_when: false
      check_mode: false

    # No registry table = empty database, nothing executed yet
    - name: Query the changes registered in the database
      ansible.builtin.command:
        cmd: >-
          psql -X -tA -d {{ pg_database }} -c
          "SELECT change_id || ' ' || content_sha256 FROM meta.ddl_change ORDER BY change_id"
      become_user: postgres
      register: _applied_q
      changed_when: false
      failed_when:
        - _applied_q.rc != 0
        - "'relation \"meta.ddl_change\" does not exist' not in _applied_q.stderr"
      check_mode: false

    - name: Prepare the data for comparison
      ansible.builtin.set_fact:
        _repo_sha: "{{ dict(_sha.results | map(attribute='item.id') | zip(_sha.results | map(attribute='stdout'))) }}"
        _applied: "{{ dict(_applied_q.stdout_lines | map('split', ' ')) if _applied_q.rc == 0 else {} }}"

    - name: Assert every executed change is still in the manifest
      ansible.builtin.assert:
        that:
          - _applied.keys() | difference(_repo_sha.keys()) | length == 0
        fail_msg: >-
          The database has changes registered that are not in the manifest: {{ _applied.keys() | difference(_repo_sha.keys()) | join(' ') }}.
          Executed changes must not be removed from ddl/changes.yml -- roll back with a new reverse change (LD-08 7.5).
        success_msg: "{{ _applied | length }} changes registered in the database, all present in the manifest"

    # * The crux of the mechanism: if the files of an executed change were modified, stop here
    - name: Assert the files of executed changes are unmodified
      ansible.builtin.assert:
        that:
          - _repo_sha[item.key] == item.value
        fail_msg: |-
          Change {{ item.key }} has been executed in the database, but its files were modified:
            checksum registered in the database: {{ item.value }}
            checksum of the files now:           {{ _repo_sha[item.key] }}
          An executed change must not be modified. Restore the files (git log -p ddl/ shows which commit changed them)
          and put the intended modification into a new change appended to the end of ddl/changes.yml.
        success_msg: "Change {{ item.key }}: executed, files unmodified"
      loop: "{{ _applied | dict2items }}"
      loop_control:
        label: "{{ item.key }}"

    - name: Find the pending changes
      ansible.builtin.set_fact:
        _pending: "{{ ddl_changes | rejectattr('id', 'in', _applied.keys() | list) | list }}"

    # Append only: if the database has executed up to 0005 and an unexecuted 0004 shows up in the manifest,
    # executing in id order would run 0004 after 0005 -- a different order from every other environment
    - name: Assert every pending change comes after the executed ones
      ansible.builtin.assert:
        that:
          - _applied | length == 0 or _pending | length == 0 or
            (_pending | map(attribute='id') | min) > (_applied.keys() | max)
        fail_msg: >-
          Among the pending changes {{ _pending | map(attribute='id') | join(' ') }} there are ids lower than the executed
          {{ _applied.keys() | max if _applied else '' }}. New changes may only be appended to the end of the manifest.
        success_msg: "Pending: {{ _pending | map(attribute='id') | join(' ') if _pending else 'none' }}"

    # Execute one by one and stop at the first failure (set -e) -- a loop will not do: after one item fails,
    # Ansible still runs the remaining items, so 0004 would run even though 0003 failed.
    # Each change: [SET LOCAL ROLE] + its files + the registry row, put into one transaction via psql -1;
    # an error part way rolls everything back, leaving neither half a structure nor a registry row.
    # PGOPTIONS stops the server from sending NOTICEs (the "already exists, skipping" of IF NOT EXISTS in 01),
    # keeping warnings and errors -- no client-side grep filtering: a filter at the end of the pipe would swallow psql's failure too.
    - name: Execute the pending structural changes
      ansible.builtin.shell:
        cmd: |
          set -euo pipefail
          export PGOPTIONS='-c client_min_messages=warning'
          {% for c in _pending %}
          echo "==> structural change {{ c.id }} (run_as={{ c.run_as }}): {{ c.summary }}"
          {
          {% if c.run_as == 'owner' %}
            echo "SET LOCAL ROLE oss911_owner;"
          {% endif %}
            cat {{ c.files | join(' ') }}
            echo
            echo "INSERT INTO meta.ddl_change (change_id, files, content_sha256, summary) VALUES ('{{ c.id }}', '{{ '{' ~ (c.files | join(',')) ~ '}' }}', '{{ _repo_sha[c.id] }}', \$chg\${{ c.summary }}\$chg\$);"
          } | psql -X -q -1 -v ON_ERROR_STOP=1 -d {{ pg_database }} -f -
          echo "    done"
          {% endfor %}
        chdir: "{{ ddl_dir }}"
      args:
        executable: /bin/bash
      become_user: postgres
      register: _exec
      when: _pending | length > 0

    - name: Show the execution output
      ansible.builtin.debug:
        msg: "{{ _exec.stdout_lines }}"
      when: _exec is not skipped

    - name: Re-check that the registry matches the manifest exactly
      ansible.builtin.command:
        cmd: >-
          psql -X -tA -d {{ pg_database }} -c
          "SELECT change_id || ' ' || content_sha256 FROM meta.ddl_change ORDER BY change_id"
      become_user: postgres
      register: _after
      changed_when: false
      check_mode: false

    - name: Assert every change has been executed with matching checksums
      ansible.builtin.assert:
        that:
          - dict(_after.stdout_lines | map('split', ' ')) == _repo_sha
        fail_msg: |-
          After execution the registry does not match the manifest.
            registry: {{ _after.stdout_lines | join(' / ') }}
            manifest: {{ _repo_sha | dict2items | map(attribute='key') | join(' ') }}
        success_msg: "Structural changes {{ _repo_sha.keys() | first }} to {{ _repo_sha.keys() | last }} executed, checksums match"

    # ================= 4. Database login users =================

    - name: Create the database login users
      ansible.builtin.include_tasks: "{{ playbook_dir }}/tasks/db_login.yml"
      loop: "{{ db_logins }}"
      loop_control:
        loop_var: login
        label: "{{ login.name }} -> {{ login.role }}"

    # ================= 5. Initial partitions (monthly, DD-77) =================
    # Call the partition function as the orchestration's real identity (the dbt user, through pgBouncer),
    # which also verifies that 0002's SECURITY DEFINER really works for that identity.
    - name: Create the initial partition window
      ansible.builtin.shell:
        cmd: |
          set -a; . {{ oss911_etc }}/dbt.env; set +a
          PGPASSWORD="$DBT_PASSWORD" psql -X -tA -v ON_ERROR_STOP=1 \
            -h 127.0.0.1 -p {{ pgb_listen_port }} -U "$DBT_USER" -d {{ pg_database }}_etl -c "
            SELECT coalesce(sum(meta.ensure_monthly_partitions(
                       n.nspname || '.' || c.relname,
                       (current_date - interval '{{ partition_months_back }} months')::date,
                       (current_date + interval '{{ partition_months_ahead }} months')::date)), 0)
            FROM pg_partitioned_table pt
            JOIN pg_class c     ON c.oid = pt.partrelid
            JOIN pg_namespace n ON n.oid = c.relnamespace
            WHERE n.nspname IN ('core', 'audit')"
      args:
        executable: /bin/bash
      become_user: airflow
      register: _parts
      changed_when: _parts.stdout | trim | int > 0

    - name: Show the number of partitions created
      ansible.builtin.debug:
        msg: >-
          Partitions created in this run: {{ _parts.stdout | trim }}
          (monthly, DD-77; window: this month -{{ partition_months_back }} to +{{ partition_months_ahead }} months).
          Until orchestration is in place the window runs out after {{ partition_months_ahead }} months; then rerun this playbook to move it forward.

    # ================= 6. Privilege verification =================
    # Check by check (the number grows with the script and is not hard-coded here), all in one transaction that is
    # rolled back at the end, leaving no trace. The script creates temporary login users and verifies the five
    # privilege roles as those users. The script is fed to psql on stdin -- postgres cannot read the repository
    # under /home (troubleshooting entry 23).
    - name: Run the database role and grant verification (test/db_roles_check.sql)
      ansible.builtin.command:
        cmd: psql -X -v ON_ERROR_STOP=1 -d {{ pg_database }}
        stdin: "{{ lookup('ansible.builtin.file', repo_test ~ '/db_roles_check.sql', rstrip=False) }}"
      become_user: postgres
      register: _rolecheck
      changed_when: false
      failed_when: false
      check_mode: false

    - name: Assert the database role and grant verification passes
      ansible.builtin.assert:
        that:
          - _rolecheck.rc == 0
        fail_msg: |-
          Verification failed (exit code {{ _rolecheck.rc }}). Relevant lines:
          {{ (_rolecheck.stdout_lines + _rolecheck.stderr_lines) | select('search', 'FAIL|ERROR') | list | join('\n') }}

          Each FAIL line states the identity, the statement, and whether it was expected to be allowed or denied.
          Full output: sudo -u postgres psql -d {{ pg_database }} < ~/src/nexora_bi/test/db_roles_check.sql
        success_msg: "Database role and grant verification: all {{ _rolecheck.stderr_lines | select('search', 'PASS') | list | length }} checks passed (rolled back)"
