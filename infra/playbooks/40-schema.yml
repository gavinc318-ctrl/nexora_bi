# 40-schema -- database structure: structural changes, database login users, initial partitions
#
# Basis: DD-73 (structural change mechanism, LD-08 7.5) · DD-74 (database roles, LD-02 chapter 13)
# Prerequisites: 20-database (the database) · 21-connection (pgBouncer; the final login check goes through it) ·
#                30-python (the airflow account, owner of the env files)
#
# * Terminology: "structural change", not "migration" -- in this project "migration" means only the
#   migration of archive data (DD-73).
#
# * Idempotence comes from "has this change been executed", not from "does this object exist".
#   The executor reads ddl/changes.yml and compares it entry by entry with the rows in meta.ddl_change:
#     registered, checksum unchanged -> skip
#     registered, checksum changed   -> fail. An executed change must not be modified; changes go into a new change
#     not registered                 -> execute in id order, each change together with its registry row in one transaction
#   CREATE TABLE IF NOT EXISTS is wrong here: when the table exists but its definition changed, it skips
#   silently, the second run shows changed=0, and the database still has the old structure.
#
# * The executor is this playbook plus psql -- no separate tool, nothing like Flyway: every extra tool is one
#   more dependency to carry into the offline network and maintain for eight years (DD-70 · LD-08 7.5).

- name: Database structure
  hosts: all
  # This playbook uses no facts (checked one by one on 2026-10-13: no ansible_* references in the
  # playbook, tasks/ or templates, and no fact-dependent package / service modules). Gathering facts
  # as root scans LVM and every block device, which on this machine sometimes takes minutes -- so we
  # do not gather what we do not need. To use a fact, delete this line and say here which fact is used.
  gather_facts: false
  become: true

  vars:
    oss911_etc: /etc/oss911
    repo_ddl: "{{ playbook_dir }}/../../ddl"
    repo_test: "{{ playbook_dir }}/../../test"
    # The manifest is read on the control node (on the development machine the control node is this machine)
    ddl_changes: "{{ lookup('ansible.builtin.file', repo_ddl ~ '/changes.yml') | from_yaml }}"

  tasks:

    # ================= 1. Preconditions =================

    - name: Query whether the business database exists
      ansible.builtin.command:
        cmd: psql -X -tA -c "SELECT count(*) FROM pg_database WHERE datname = '{{ pg_database }}'"
      become_user: postgres
      register: _db
      changed_when: false
      check_mode: false

    - name: Assert the business database exists
      ansible.builtin.assert:
        that:
          - _db.stdout | trim == '1'
        fail_msg: "Database {{ pg_database }} does not exist. Run 20-database.yml first"
        success_msg: "Database {{ pg_database }} exists"

    # The manifest's own rules are guarded by an assert, not by eyeballing during review
    - name: Assert the change manifest ids are consecutive and run_as is valid
      ansible.builtin.assert:
        that:
          - (ddl_changes | map(attribute='id') | list) == (ddl_changes | map(attribute='id') | sort | unique | list)
          - (ddl_changes | map(attribute='id') | map('int') | list) == range(ddl_changes | length) | list
          - ddl_changes | selectattr('id', '>=', '0003') | rejectattr('run_as', 'equalto', 'owner') | list | length == 0
          - ddl_changes | rejectattr('run_as', 'in', ['superuser', 'owner']) | list | length == 0
        fail_msg: >-
          ddl/changes.yml is invalid. Required: ids consecutive from 0000, in order, no duplicates;
          run_as is superuser or owner only, and owner from 0003 on (new objects must belong to the owner role, DD-74).
          Current ids: {{ ddl_changes | map(attribute='id') | join(' ') }}
        success_msg: "Change manifest valid: {{ ddl_changes | length }} changes, {{ ddl_changes | map(attribute='id') | first }} to {{ ddl_changes | map(attribute='id') | last }}"

    # ================= 2-3. Load the DDL files and execute the structural changes =================
    # The executor is shared with 41-cad-mirror.yml (tasks/ddl_changes.yml); its rules are described there and in
    # the header of this file.
    - name: Execute the structural changes of the database {{ pg_database }}
      ansible.builtin.include_tasks: "{{ playbook_dir }}/tasks/ddl_changes.yml"
      vars:
        dc_repo_dir: "{{ repo_ddl }}"
        dc_changes: "{{ ddl_changes }}"
        dc_manifest_name: ddl/changes.yml
        dc_target_dir: "{{ ddl_dir }}"
        dc_database: "{{ pg_database }}"
        dc_registry: meta.ddl_change
        dc_owner_role: oss911_owner

    # ================= 4. Database login users =================

    - name: Create the database login users
      ansible.builtin.include_tasks: "{{ playbook_dir }}/tasks/db_login.yml"
      loop: "{{ db_logins }}"
      loop_control:
        loop_var: login
        label: "{{ login.name }} -> {{ login.role }}"

    # CONNECT for the four privilege roles (their login users inherit it) and pgBouncer's auth_user, whose auth_query
    # runs in this database (auth_dbname). Not for every login of the cluster: the DS writer of cad_mirror must have
    # no access to oss911 at all (LD-07 2.1). 21-connection grants its probe user explicitly. tasks/db_connect.yml
    - name: Restrict CONNECT on {{ pg_database }}
      ansible.builtin.include_tasks: "{{ playbook_dir }}/tasks/db_connect.yml"
      vars:
        dbc_database: "{{ pg_database }}"
        dbc_grantees: [oss911_ingest, oss911_transform, oss911_query_svc, oss911_admin_svc, pgbouncer]

    # ================= 5. Initial partitions (monthly, DD-77) =================
    # Call the partition function as the orchestration's real identity (the dbt user, through pgBouncer),
    # which also verifies that 0002's SECURITY DEFINER really works for that identity.
    - name: Create the initial partition window
      ansible.builtin.shell:
        cmd: |
          set -a; . {{ oss911_etc }}/dbt.env; set +a
          PGPASSWORD="$DBT_PASSWORD" psql -X -tA -v ON_ERROR_STOP=1 \
            -h 127.0.0.1 -p {{ pgb_listen_port }} -U "$DBT_USER" -d {{ pg_database }} -c "
            SELECT coalesce(sum(meta.ensure_monthly_partitions(
                       n.nspname || '.' || c.relname,
                       (current_date - interval '{{ partition_months_back }} months')::date,
                       (current_date + interval '{{ partition_months_ahead }} months')::date)), 0)
            FROM pg_partitioned_table pt
            JOIN pg_class c     ON c.oid = pt.partrelid
            JOIN pg_namespace n ON n.oid = c.relnamespace
            WHERE n.nspname IN ('core', 'audit', 'raw')"
      args:
        executable: /bin/bash
      become_user: airflow
      register: _parts
      changed_when: _parts.stdout | trim | int > 0

    - name: Show the number of partitions created
      ansible.builtin.debug:
        msg: >-
          Partitions created in this run: {{ _parts.stdout | trim }}
          (monthly, DD-77; window: this month -{{ partition_months_back }} to +{{ partition_months_ahead }} months).
          Until orchestration is in place the window runs out after {{ partition_months_ahead }} months; then rerun this playbook to move it forward.

    # ================= 6. Privilege verification =================
    # Check by check (the number grows with the script and is not hard-coded here), all in one transaction that is
    # rolled back at the end, leaving no trace. The script creates temporary login users and verifies the five
    # privilege roles as those users. The script is fed to psql on stdin -- postgres cannot read the repository
    # under /home (troubleshooting entry 23).
    - name: Run the database role and grant verification (test/db_roles_check.sql)
      ansible.builtin.command:
        cmd: psql -X -v ON_ERROR_STOP=1 -d {{ pg_database }}
        stdin: "{{ lookup('ansible.builtin.file', repo_test ~ '/db_roles_check.sql', rstrip=False) }}"
      become_user: postgres
      register: _rolecheck
      changed_when: false
      failed_when: false
      check_mode: false

    - name: Assert the database role and grant verification passes
      ansible.builtin.assert:
        that:
          - _rolecheck.rc == 0
        fail_msg: |-
          Verification failed (exit code {{ _rolecheck.rc }}). Relevant lines:
          {{ (_rolecheck.stdout_lines + _rolecheck.stderr_lines) | select('search', 'FAIL|ERROR') | list | join('\n') }}

          Each FAIL line states the identity, the statement, and whether it was expected to be allowed or denied.
          Full output: sudo -u postgres psql -d {{ pg_database }} < ~/src/nexora_bi/test/db_roles_check.sql
        success_msg: "Database role and grant verification: all {{ _rolecheck.stderr_lines | select('search', 'PASS') | list | length }} checks passed (rolled back)"
