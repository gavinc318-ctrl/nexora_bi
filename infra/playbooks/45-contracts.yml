# 45-contracts -- sync the released source contracts into meta.source_contract, then write the DAG manifest
#
# Basis: DD-88 (contract sync is a deployment step, forward only; one set of contract rules; serialized) ·
#        LD-01 2.1 / 2.5
# Prerequisites: 30-python (venv-ingest with oss911-ingest, ingest.conf) · 40-schema (meta.source_contract,
#                the owner role, the ingest login user and ingest.env, the raw tables the contracts point at)
#
# * contracts/ in the repository is the authority; meta.source_contract is a read-only copy (LD-01 2.1).
#   Only the files listed in contracts/release.yml are synced, and every one of them must have its raw table.
# * Order, all on the target, over one copy of the files:
#     1. the release directory /opt/oss911/releases/<content hash>/ (tasks/release_dir.yml): contracts, pools.yml,
#        resweep.yml and the DAG files, immutable and verified by hash. Every later step reads this one copy
#     2. check each with `oss911-ingest validate-contract --with-overrides` -- the single set of contract rules,
#        run as the airflow account with the ingest database user, the identity the ingestion program really has.
#        It also checks the hot-tuned values now in the database against the new contract
#     3. rehearse the scheduling: a candidate DAG manifest (the database with the released contracts laid over it,
#        i.e. the state after the sync) and Airflow's own parser over src/dags with it. Whether Airflow accepts a
#        schedule is decided here, by Airflow (LD-01 2.1)
#     4. convert to JSON (infra/files/contracts_to_json.py, venv-ingest's Python)
#     5. sync in one transaction as the owner role, under an advisory lock (infra/files/contract_sync.sql). It
#        fails if the hot-tuned values differ from what step 2 saw -- someone changed one in M-01 in between
#     6. write the DAG manifest /opt/oss911/release/dags.json from the database (`oss911-ingest dag-manifest`),
#        under the same lock, atomically, only if changed. ALWAYS, even when every contract is unchanged: the sync
#        commit and the manifest are two operations, and a failure between them leaves the release unfinished --
#        the rerun must regenerate the manifest. In production this step runs on every ETL node, and the release is
#        finished only when every node's manifest is written and verified (LD-01 2.1 · LD-08 7.2)
# * Never touched here: meta.source_contract.enabled after the first insert, and meta.source_runtime_param.
#   Deployment must not quietly change the runtime configuration (DD-88).

- name: Source contracts
  hosts: all
  gather_facts: false   # no facts used (same reasoning as 40-schema.yml)
  become: true

  vars:
    repo_root: "{{ playbook_dir }}/../.."
    ingest_venv: "{{ venv_root }}/venv-ingest"
    af_venv: "{{ venv_root }}/venv-airflow"
    oss911_etc: /etc/oss911
    release_dir: "{{ venv_root }}/release"              # the DAG manifest dags.json, rewritten by airflow (rename)
    rehearsal_dir: "{{ venv_root }}/release/rehearsal"  # step 3's candidate manifest, rewritten every deployment
    keep_releases: 10                                   # release directories kept (the current one always)
    # release.yml holds file names only, so reading it on the control node is safe; the contracts themselves are
    # never read by Ansible's YAML parser (it would template their literal "{{ window_from }}" placeholders)
    contracts_release: "{{ (lookup('ansible.builtin.file', repo_root ~ '/contracts/release.yml') | from_yaml).release }}"

  tasks:

    # ---------- 1. The release directory ----------
    - name: Create and verify the release directory
      ansible.builtin.include_tasks: "{{ playbook_dir }}/tasks/release_dir.yml"
      vars:
        rel_create: true

    - name: Create the manifest and rehearsal directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: airflow
        group: airflow
        mode: "0755"
      loop:
        - "{{ release_dir }}"
        - "{{ rehearsal_dir }}"

    # The previous way of deploying left copies that could be mistaken for the release (CLAUDE.md section 5, item
    # four): the contracts copy that every deployment overwrote, and the rehearsal folder that held DAG files
    - name: Remove the copies the previous deployment method left behind
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - "{{ venv_root }}/contracts"
        - "{{ release_dir }}/candidate"

    # ---------- 2. Validate ----------
    - name: Validate the contracts and the hot-tuned values in the database
      ansible.builtin.command:
        argv:
          - "{{ ingest_venv }}/bin/oss911-ingest"
          - validate-contract
          - "{{ rel_dir }}/contracts/{{ item }}"
          - --with-overrides
      become_user: airflow
      register: _valid
      changed_when: false
      failed_when: false
      check_mode: false
      loop: "{{ contracts_release }}"

    # Asserted separately so that every contract's problems are shown, not only the first one's
    - name: Assert every contract is valid
      ansible.builtin.assert:
        that:
          - item.rc == 0
        fail_msg: |-
          {{ item.item }} (exit code {{ item.rc }}{{ ': configuration error' if item.rc == 2 else '' }}):
          {{ item.stderr }}
        success_msg: "{{ item.item }}: valid, hot-tuned values {{ (item.stdout | from_json).overrides }}"
      loop: "{{ _valid.results }}"
      loop_control:
        label: "{{ item.item }}"

    # ---------- 3. Rehearse the scheduling before anything is synced ----------
    - name: Write the candidate DAG manifest (database + released contracts, i.e. after the sync)
      ansible.builtin.command:
        argv:
          - "{{ ingest_venv }}/bin/oss911-ingest"
          - dag-manifest
          - --candidate
          - "{{ rel_dir }}/contracts"
          - --pools
          - "{{ rel_dir }}/contracts/pools.yml"
          - --resweep
          - "{{ rel_dir }}/contracts/resweep.yml"
          - --out
          - "{{ rehearsal_dir }}/dags.json"
      become_user: airflow
      register: _cand
      changed_when: false
      failed_when: false
      check_mode: false

    - name: Assert the candidate manifest could be built
      ansible.builtin.assert:
        that:
          - _cand.rc == 0
        fail_msg: |-
          The DAG manifest cannot be built for this release (exit code {{ _cand.rc }}); nothing has been synced:
          {{ _cand.stderr }}
        success_msg: "Candidate manifest: {{ (_cand.stdout_lines | last | from_json).sources | join(', ') }}"

    # Airflow's own parser decides whether the DAGs (and their schedules) are acceptable. Only the parse: the
    # rehearsal folder is not the scheduler's, nothing is written to the metadata database. Each file of this release
    # is parsed by name, so a file left in the rehearsal folder by an earlier release cannot sway the verdict
    - name: Parse the DAGs with the candidate manifest
      ansible.builtin.shell:
        cmd: |
          set -a; . {{ oss911_etc }}/airflow.env; set +a
          OSS911_DAG_MANIFEST={{ rehearsal_dir }}/dags.json {{ af_venv }}/bin/python -c '
          import json, sys
          from airflow.dag_processing.dagbag import DagBag
          errors, dags = {}, []
          for path in sys.argv[1:]:
              bag = DagBag(dag_folder=path)
              errors.update({k: v.strip().splitlines()[-1] for k, v in bag.import_errors.items()})
              dags += bag.dag_ids
          print(json.dumps({"errors": errors, "dags": sorted(dags)}))
          ' {% for n in rel_names | select('match', '^dags/') %}{{ rel_dir }}/{{ n }} {% endfor %}
      args:
        executable: /bin/bash
      become_user: airflow
      register: _rehearse
      changed_when: false
      check_mode: false

    - name: Assert the DAGs parse and every source has its DAG
      ansible.builtin.assert:
        that:
          - _rehearse_result.errors | length == 0
          - (_cand.stdout_lines | last | from_json).sources
            | map('regex_replace', '^', 'ingest_') | difference(_rehearse_result.dags) | length == 0
        fail_msg: |-
          The DAGs do not parse with this release's manifest; nothing has been synced.
          {{ _rehearse_result }}
        success_msg: "DAGs parse with the candidate manifest: {{ _rehearse_result.dags | join(', ') }}"
      vars:
        _rehearse_result: >-
          {{ (_rehearse.stdout_lines | last | default('{"errors": {"parser": "printed nothing (rc ' ~ _rehearse.rc ~ ')"}, "dags": []}'))
             | from_json }}

    # ---------- 4-5. Convert and sync ----------
    - name: Convert the released contracts to JSON
      ansible.builtin.command:
        argv:
          - "{{ ingest_venv }}/bin/python"
          - -c
          - "{{ lookup('ansible.builtin.file', playbook_dir ~ '/../files/contracts_to_json.py') }}"
          - "{{ rel_dir }}/contracts"
      register: _contracts
      changed_when: false
      check_mode: false

    - name: Sync the contracts into the database
      ansible.builtin.command:
        argv:
          - psql
          - -X
          - -q
          - -1
          - -v
          - ON_ERROR_STOP=1
          - -v
          - "contracts={{ _contracts.stdout }}"
          - -v
          - "overrides={{ dict(_valid.results | map(attribute='stdout') | map('from_json')
                               | map(attribute='source_id')
                               | zip(_valid.results | map(attribute='stdout') | map('from_json')
                                     | map(attribute='overrides'))) | to_json }}"
          - -d
          - "{{ pg_database }}"
          - -f
          - "-"
        stdin: "{{ lookup('ansible.builtin.file', playbook_dir ~ '/../files/contract_sync.sql') }}"
      become_user: postgres
      register: _sync
      changed_when: _sync.stdout_lines | select('search', '[|](inserted|updated)[|]') | list | length > 0

    - name: Show the result per contract
      ansible.builtin.debug:
        msg: "{{ _sync.stdout_lines }}"
      when: _sync is not skipped

    # ---------- 6. The DAG manifest, from the database, every time ----------
    - name: Write the DAG manifest from the database
      ansible.builtin.command:
        argv:
          - "{{ ingest_venv }}/bin/oss911-ingest"
          - dag-manifest
          - --pools
          - "{{ rel_dir }}/contracts/pools.yml"
          - --resweep
          - "{{ rel_dir }}/contracts/resweep.yml"
          - --out
          - "{{ release_dir }}/dags.json"
      become_user: airflow
      register: _manifest
      changed_when: _manifest.rc == 0 and (_manifest.stdout_lines | last | from_json).changed
      failed_when: false

    - name: Assert the DAG manifest was written (otherwise the release is unfinished)
      ansible.builtin.assert:
        that:
          - _manifest.rc == 0
        fail_msg: |-
          RELEASE UNFINISHED: the contracts are synced, but the DAG manifest could not be written (exit code {{ _manifest.rc }}):
          {{ _manifest.stderr }}
          The scheduler still follows the previous manifest. Fix the cause and run this playbook again: the sync
          will report "unchanged" and the manifest will be regenerated (LD-01 2.1).
        success_msg: >-
          DAG manifest {{ release_dir }}/dags.json {{ 'written' if (_manifest.stdout_lines | last | from_json).changed else 'unchanged' }}:
          {{ (_manifest.stdout_lines | last | from_json).sources | join(', ') }}

    - name: Warn about contracts in the database that this release does not list
      ansible.builtin.debug:
        msg: >-
          Not in contracts/release.yml but present in meta.source_contract (left as they are; to stop a source
          use start / stop in M-01): {{ _sync.stdout_lines | select('search', '[|]not_in_release[|]') | list | join(', ') }}
      when:
        - _sync is not skipped
        - _sync.stdout_lines | select('search', '[|]not_in_release[|]') | list | length > 0

    # ---------- Keep the last release directories ----------
    - name: List the release directories
      ansible.builtin.find:
        paths: "{{ venv_root }}/releases"
        file_type: directory
      register: _releases

    - name: Remove release directories beyond the last {{ keep_releases }} (never the current one)
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop: >-
        {{ (_releases.files | sort(attribute='mtime', reverse=true) | map(attribute='path') | list)[keep_releases:]
           | reject('equalto', rel_dir) | list }}
