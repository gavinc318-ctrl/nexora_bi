---
# 99-verify -- read-only health check
#
# The overlap with 00-base's assertions is deliberate: 00-base guards at build time,
# this playbook guards at any time. After the machine has run for three months, whether
# someone changed something by hand, whether a volume is full, whether a service is down --
# this is how it gets found.
#
# This playbook changes nothing and can be run at any time.

- name: Development environment health check
  hosts: all
  become: true
  gather_facts: true

  tasks:
    - name: OS and capacity
      ansible.builtin.assert:
        that:
          - ansible_facts['distribution'] == os_distribution
          - ansible_facts['distribution_release'] == os_release
          - ansible_facts['memtotal_mb'] | int >= 60000
          - ansible_facts['processor_vcpus'] | int >= 16
        success_msg: >-
          {{ ansible_facts['distribution'] }} {{ ansible_facts['distribution_version'] }},
          {{ ansible_facts['processor_vcpus'] }} vCPU,
          {{ (ansible_facts['memtotal_mb'] | int / 1024) | round(1) }} GB

    - name: Timezone must be {{ system_timezone }}
      ansible.builtin.command:
        cmd: timedatectl show -p Timezone --value
      register: _tz
      changed_when: false
      check_mode: false
      failed_when: _tz.stdout | trim != system_timezone

    - name: Volume usage
      ansible.builtin.set_fact:
        _disk_report: >-
          {{ ansible_facts['mounts']
             | selectattr('mount', 'in', required_mounts | map(attribute='path') | list)
             | map(attribute='mount') | list }}

    - name: Report usage per volume; above 80% counts as a warning
      ansible.builtin.assert:
        that:
          - (item.size_available | int) * 100 / (item.size_total | int) > 20
        fail_msg: >-
          {{ item.mount }} has {{ ((item.size_available | int) * 100 / (item.size_total | int)) | round(1) }}% free,
          below 20%. Extend from the reserve: lvextend -L +NNG -r /dev/{{ vg_name }}/<lv>
        success_msg: >-
          {{ item.mount }} has {{ ((item.size_available | int) * 100 / (item.size_total | int)) | round(1) }}% free
      loop: "{{ ansible_facts['mounts'] | selectattr('mount', 'in', required_mounts | map(attribute='path') | list) | list }}"
      loop_control:
        label: "{{ item.mount }}"

    - name: Kernel parameters in effect
      ansible.builtin.command:
        cmd: sysctl -n {{ item.key }}
      register: _sysctl
      changed_when: false
      check_mode: false
      failed_when: _sysctl.stdout | trim != item.value
      loop:
        - { key: vm.swappiness,        value: "10" }
        - { key: vm.overcommit_memory, value: "0" }
        - { key: fs.file-max,          value: "2097152" }
      loop_control:
        label: "{{ item.key }} = {{ item.value }}"

    - name: SSH password login is disabled
      ansible.builtin.command:
        cmd: sshd -T
      register: _sshd
      changed_when: false
      check_mode: false

    - name: Assert the SSH hardening settings
      ansible.builtin.assert:
        that:
          - "'passwordauthentication no' in _sshd.stdout_lines"
          - "'permitrootlogin no' in _sshd.stdout_lines"
        fail_msg: >-
          SSH hardening is not in effect. Note that on 24.04 the actual settings live in /etc/ssh/sshd_config.d/,
          so grepping the main config file does not show them -- the output of sshd -T is what counts.

    - name: Automatic upgrades are disabled
      ansible.builtin.command:
        cmd: systemctl is-enabled {{ item }}
      register: _timer
      changed_when: false
      check_mode: false
      failed_when: "'disabled' not in _timer.stdout and 'masked' not in _timer.stdout"
      loop:
        - apt-daily-upgrade.timer
      loop_control:
        label: "{{ item }}"

    - name: sysstat is collecting
      ansible.builtin.command:
        cmd: systemctl is-active sysstat
      register: _sysstat
      changed_when: false
      check_mode: false
      failed_when: _sysstat.stdout | trim != "active"

    # ---------- Container runtime (meaningful only after 10-runtime) ----------
    - name: podman is available
      ansible.builtin.command:
        cmd: podman --version
      register: _podman
      changed_when: false
      check_mode: false
      failed_when: false

    - name: Image storage is on the dedicated volume
      ansible.builtin.command:
        cmd: podman info --format '{{ '{{' }} .Store.GraphRoot {{ '}}' }}'
      register: _graphroot
      changed_when: false
      check_mode: false
      failed_when: false
      when: _podman.rc == 0

    - name: Assert the image storage path
      ansible.builtin.assert:
        that:
          - _graphroot.stdout | trim is match('^/var/lib/containers')
        fail_msg: "Image storage is at {{ _graphroot.stdout | trim }}, not on the dedicated volume"
        success_msg: "Image storage: {{ _graphroot.stdout | trim }}"
      when: _podman.rc == 0

    - name: Both network segments exist
      ansible.builtin.command:
        cmd: podman network ls --format '{{ '{{' }} .Name {{ '}}' }}'
      register: _nets
      changed_when: false
      check_mode: false
      failed_when: false
      when: _podman.rc == 0

    - name: Assert the network segments
      ansible.builtin.assert:
        that:
          - item.name in _nets.stdout_lines
        fail_msg: "Network segment {{ item.name }} is missing. Rerun playbooks/10-runtime.yml"
      loop: "{{ podman_networks }}"
      loop_control:
        label: "{{ item.name }}"
      when: _podman.rc == 0

    - name: The container DNS resolver is installed
      ansible.builtin.command:
        cmd: dpkg-query -W -f=${Status} aardvark-dns
      register: _aardvark
      changed_when: false
      check_mode: false
      failed_when: "'install ok installed' not in _aardvark.stdout"
      when: _podman.rc == 0
