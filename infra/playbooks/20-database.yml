---
# 20-database -- PostgreSQL 16 + PostGIS
#
# This step covers the database itself. pgBouncer and HAProxy are in 21-connection.yml.
# Why separate: creating the cluster is ONE-WAY -- the locale is fixed at initdb, and changing it
# later means rebuilding the whole cluster. Get it right first, then stack the connection layer on top.
#
# * The order must not be reversed: createcluster.conf must be in place BEFORE apt install.
#   Ubuntu's postgresql package creates a "main" cluster in its postinst using the system locale
#   (en_US.UTF-8), while DD-63 requires the cluster default LC_COLLATE=C to decouple from glibc.
#
# * About --check: check mode can only verify this playbook up to "before the packages".
#   Tasks after the install depend on things the packages create -- the postgres system user,
#   /etc/postgresql/<ver>/<cluster>/, the postgresql@ service unit -- and in check mode apt has
#   not really installed anything, so none of them exist. Forcing them to run under check only
#   produces a row of false failures, and false failures teach people to ignore --check, which is
#   worse than having no check. So everything after the install is skipped in check mode as a block.
#   What check can tell you: whether the config file content is right and what the package list
#   will install. It cannot tell you whether the cluster will be created successfully.

- name: PostgreSQL and PostGIS
  hosts: all
  # This playbook uses no facts (checked one by one on 2026-10-13: no ansible_* references in the
  # playbook, tasks/ or templates, and no fact-dependent package / service modules). Gathering facts
  # as root scans LVM and every block device, which on this machine sometimes takes minutes -- so we
  # do not gather what we do not need. To use a fact, delete this line and say here which fact is used.
  gather_facts: false
  become: true

  vars:
    # Cluster config directory: fixed Debian/Ubuntu layout decided by pg_createcluster, not in inventory
    pg_confdir: "/etc/postgresql/{{ postgres_version }}/{{ pg_cluster_name }}"

  tasks:

    # ================= Before the install: verifiable in check mode =================

    - name: Create the postgresql-common config directory
      ansible.builtin.file:
        path: /etc/postgresql-common
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Prevent automatic cluster creation on install
      ansible.builtin.copy:
        dest: /etc/postgresql-common/createcluster.conf
        owner: root
        group: root
        mode: "0644"
        content: |
          # Managed by infra/playbooks/20-database.yml, do not edit by hand
          #
          # Must be in place before postgresql is installed. Ubuntu's postgresql package creates a
          # "main" cluster in its postinst using the system locale (en_US.UTF-8), while DD-63 requires
          # the cluster default LC_COLLATE=C to decouple from glibc. Letting it be created and then
          # dropping and recreating it wastes time and easily leaves residue behind.
          create_main_cluster = false

          # * This file REPLACES the distribution's file of the same name entirely. The distribution
          #   default contains add_include_dir = 'conf.d'; writing this file wipes that out as well,
          #   so the postgresql.conf generated by pg_createcluster has no include_dir and conf.d/*.conf
          #   is never loaded. This project hit exactly that.
          #   Whenever a distribution config file is replaced, write back every default still needed.
          add_include_dir = 'conf.d'

    - name: Install PostgreSQL and PostGIS
      ansible.builtin.apt:
        name: "{{ database_packages }}"
        state: present
        update_cache: true
        cache_valid_time: 3600

    # ================= After the install: users, directories and services created by the packages =================
    # Skipped in check mode as a block; see the file header for why.

    - name: Cluster creation and configuration
      when: not ansible_check_mode
      block:

        # ---------- WAL directory ----------
        # WAL lives on its own volume (asserted in 00-base). initdb requires the waldir to be empty and
        # owned by postgres. The postgres system user is created by postgresql-common's postinst, hence after the install.
        - name: Create the WAL directory
          ansible.builtin.file:
            path: "{{ pg_waldir }}"
            state: directory
            owner: postgres
            group: postgres
            mode: "0700"

        # ---------- Create the cluster explicitly ----------
        - name: Query existing clusters
          ansible.builtin.command:
            cmd: pg_lsclusters --no-header
          register: _clusters
          changed_when: false
          check_mode: false
          failed_when: false

        - name: Create the cluster (locale=C, DD-63)
          ansible.builtin.command:
            cmd: >-
              pg_createcluster {{ postgres_version }} {{ pg_cluster_name }}
              --port {{ pg_port }}
              --
              --locale=C
              --encoding=UTF8
              --waldir={{ pg_waldir }}/{{ postgres_version }}-{{ pg_cluster_name }}
          when: >-
            (postgres_version | string + ' ' + pg_cluster_name)
            not in (_clusters.stdout | default(''))

        - name: Start the cluster and enable it at boot
          ansible.builtin.systemd_service:
            name: "postgresql@{{ postgres_version }}-{{ pg_cluster_name }}"
            enabled: true
            state: started

        # ---------- Verify the locale really is C ----------
        # The core assertion of this playbook. If the cluster is created wrong, all later work sits on
        # a wrong foundation, and the symptoms only show on the day of an OS major upgrade.
        - name: Query the cluster locale and encoding
          ansible.builtin.command:
            cmd: >-
              psql -tAc "SELECT datcollate || '|' || datctype || '|' ||
              pg_encoding_to_char(encoding) FROM pg_database WHERE datname='postgres'"
          become_user: postgres
          register: _dblocale
          changed_when: false
          failed_when: false

        - name: Assert the cluster locale is C and the encoding UTF8
          ansible.builtin.assert:
            that:
              - _dblocale.stdout | trim == 'C|C|UTF8'
            fail_msg: >-
              The cluster locale is "{{ _dblocale.stdout | trim }}", it should be C|C|UTF8 (DD-63).
              The locale is fixed at initdb and cannot be changed online -- drop and recreate the cluster:
                sudo pg_dropcluster {{ postgres_version }} {{ pg_cluster_name }} --stop
                then rerun this playbook
              If the cluster already holds data, back it up first.
            success_msg: "Cluster locale: {{ _dblocale.stdout | trim }} (meets DD-63)"

        # ---------- Parameters ----------
        # The conf.d directory and the include_dir line in postgresql.conf should have been generated by
        # pg_createcluster from add_include_dir in createcluster.conf. This project had neither, because
        # the "no automatic cluster" file above replaced the distribution defaults wholesale and wiped out
        # add_include_dir with them. The default has been written back, but that does not help an existing
        # cluster, so the directory and include_dir are added here, and after deploying the parameters we
        # test that they really take effect.
        - name: Create the conf.d directory
          ansible.builtin.file:
            path: "{{ pg_confdir }}/conf.d"
            state: directory
            owner: postgres
            group: postgres
            mode: "0755"

        # For an existing cluster postgresql.conf has already been generated and changing
        # createcluster.conf cannot fix it, so add include_dir here directly (idempotent).
        - name: Make sure postgresql.conf includes conf.d
          ansible.builtin.lineinfile:
            path: "{{ pg_confdir }}/postgresql.conf"
            line: "include_dir = 'conf.d'"
            regexp: "^[#[:space:]]*include_dir[[:space:]]*=[[:space:]]*'conf\\.d'"
            owner: postgres
            group: postgres
            mode: "0644"
          notify: restart postgresql

        - name: Deploy the PostgreSQL parameters
          ansible.builtin.template:
            src: ../files/postgresql-oss911.conf.j2
            dest: "{{ pg_confdir }}/conf.d/10-oss911.conf"
            owner: postgres
            group: postgres
            mode: "0644"
          notify: restart postgresql

        # Allowed networks come from inventory; empty on the development machine. In production this is
        # the network of the LB nodes -- pg_hba belongs to the database itself, so it lives in this step
        # and not in the step that needs it.
        - name: Allow database connections from the listed networks
          ansible.builtin.lineinfile:
            path: "{{ pg_confdir }}/pg_hba.conf"
            line: "host    all             all             {{ item.cidr }}        {{ item.method }}    # {{ item.comment | default('') }}"
            regexp: "^host\\s+all\\s+all\\s+{{ item.cidr | replace('.','\\.') | replace('/','/') }}\\s"
            insertafter: EOF
            owner: postgres
            group: postgres
            mode: "0640"
          loop: "{{ pg_hba_allow }}"
          notify: restart postgresql

        # What the configuration says and whether the address is really bound are two different things --
        # PG skips listen addresses it cannot bind and carries on (see runbook/troubleshooting).
        - name: Query the addresses actually listened on
          ansible.builtin.command:
            cmd: ss -lntH "sport = :{{ pg_port }}"
          register: _pglisten
          changed_when: false
          check_mode: false

        - name: Assert every configured listen address is really bound
          ansible.builtin.assert:
            that:
              - "_pglisten.stdout is search(item)"
            fail_msg: >-
              The configuration requires listening on "{{ item }}", but port {{ pg_port }} has no such address.
              Actually listening: {{ _pglisten.stdout | default('(none)') }}.
              PostgreSQL skips addresses it cannot bind and carries on, so the service is running as usual
              and pg_settings shows the configured value -- configuration "loaded" does not mean address "bound".
              The log should contain a line "could not create listen socket for".
              The most common cause is that the interface owning that address does not exist at the moment.
            success_msg: "Listen address {{ item }} is bound"
          loop: >-
            {{ pg_listen_addresses.split(',')
               | map('trim') | reject('equalto','localhost') | list }}
          when: pg_listen_addresses != 'localhost'

        # Parameters must really be loaded before the database is created, or the checks in this run read old values
        - name: Apply parameter changes now
          ansible.builtin.meta: flush_handlers

        - name: Query the actual value of a key parameter
          ansible.builtin.command:
            cmd: psql -tAc "SHOW shared_buffers"
          become_user: postgres
          register: _shb
          changed_when: false
          failed_when: false

        - name: Assert the parameter file really takes effect
          ansible.builtin.assert:
            that:
              - _shb.stdout | trim == '8GB'
            fail_msg: >-
              shared_buffers is actually "{{ _shb.stdout | trim }}", expected 8GB.
              conf.d/10-oss911.conf is not being loaded. Find the file actually in effect with
                sudo -u postgres psql -tAc "SELECT sourcefile FROM pg_settings WHERE name='shared_buffers'"
            success_msg: "Parameter file in effect (shared_buffers = {{ _shb.stdout | trim }})"

        # ---------- Business database and extensions ----------
        - name: Create the business database
          ansible.builtin.command:
            cmd: createdb --template=template0 --locale=C --encoding=UTF8 {{ pg_database }}
          become_user: postgres
          register: _createdb
          changed_when: _createdb.rc == 0
          failed_when: _createdb.rc != 0 and 'already exists' not in _createdb.stderr

        # CREATE EXTENSION IF NOT EXISTS returns the command tag "CREATE EXTENSION" even when it did
        # nothing, so stdout cannot tell whether anything changed -- query first, then create.
        - name: Query enabled extensions
          ansible.builtin.command:
            cmd: psql -d {{ pg_database }} -tAc "SELECT extname FROM pg_extension"
          become_user: postgres
          register: _ext_have
          changed_when: false

        - name: Enable extensions
          ansible.builtin.command:
            cmd: psql -d {{ pg_database }} -c "CREATE EXTENSION {{ item }}"
          become_user: postgres
          loop: "{{ pg_extensions }}"
          when: item not in (_ext_have.stdout_lines | map('trim') | list)

        # ---------- ICU availability: the column-level collations of DD-63 depend on it ----------
        - name: Query ICU collations
          ansible.builtin.command:
            cmd: >-
              psql -d {{ pg_database }} -tAc
              "SELECT count(*) FROM pg_collation WHERE collname IN ('ar-x-icu','en-x-icu')"
          become_user: postgres
          register: _icu
          changed_when: false
          failed_when: false

        - name: Assert the ICU collations are available
          ansible.builtin.assert:
            that:
              - _icu.stdout | trim == '2'
            fail_msg: >-
              ICU collations ar-x-icu / en-x-icu are not available (found {{ _icu.stdout | trim }}).
              The column-level collations of DD-63 depend on them; without them ddl/02_core_dimensions.sql cannot run.
            success_msg: "ICU collations available: ar-x-icu, en-x-icu"

        # ---------- Does ICU really take effect ----------
        # "Available" is not "in effect". Same nature as the network segments: every assert can pass while
        # the function is empty. So compare once with Arabic data that really diverges -- ICU ar groups the
        # hamza variants together, byte order splits two spellings of the same name to both ends of the list.
        - name: Test that ICU ordering really differs from byte order
          ansible.builtin.command:
            cmd: >-
              psql -d {{ pg_database }} -tAc
              "WITH t(v) AS (VALUES ('أحمد'),('احمد'),('إبراهيم'),('ابراهيم'))
               SELECT CASE WHEN
                 (SELECT array_agg(v ORDER BY v COLLATE \"ar-x-icu\") FROM t)
                 <> (SELECT array_agg(v ORDER BY v COLLATE \"C\") FROM t)
               THEN 'differs' ELSE 'same' END"
          become_user: postgres
          register: _collcheck
          changed_when: false
          failed_when: false

        - name: Assert ICU ordering really changes the result
          ansible.builtin.assert:
            that:
              - _collcheck.stdout | trim == 'differs'
            fail_msg: >-
              ICU Arabic ordering gives the same result as byte order ("{{ _collcheck.stdout | trim }}"),
              so the column-level collation does not really take effect. Same nature as network isolation:
              asserting existence is easy, verifying effect is the point. There is no point going further;
              check PostgreSQL's ICU build support first.
            success_msg: "ICU Arabic ordering in effect (differs from byte order)"

  handlers:
    - name: restart postgresql
      ansible.builtin.systemd_service:
        name: "postgresql@{{ postgres_version }}-{{ pg_cluster_name }}"
        state: restarted
