---
# 20-database —— PostgreSQL 16 + PostGIS
#
# 本步只做数据库本体。pgBouncer 与 HAProxy 在 21-connection.yml。
# 分开的理由：集群创建是【一次性不可逆】的——locale 在 initdb 时确定，
# 事后更改要重建整个集群。先把它验对，再往上叠连接层。
#
# ★ 顺序不可颠倒：必须在 apt install 之前写好 createcluster.conf。
#   Ubuntu 的 postgresql 包会在 postinst 里自动建一个 main 集群并沿用系统 locale
#   （en_US.UTF-8），而 DD-63 要求集群默认 LC_COLLATE=C 以与 glibc 解耦。
#
# ★ 关于 --check：本剧本的 check 模式只能验到「装包之前」。
#   装包之后的任务依赖包自身创建的东西——postgres 系统用户、
#   /etc/postgresql/<ver>/<cluster>/ 目录、postgresql@ 服务单元——而 check 模式下
#   apt 并未真装，这些都不存在。硬让它们在 check 下跑只会得到一串假失败，
#   而假失败会教人忽略 --check，那比没有 check 更糟。
#   故装包之后的任务整块跳过 check 模式。check 能告诉你的是：
#   配置文件内容对不对、包清单会装什么；不能告诉你集群会不会建成功。

- name: PostgreSQL 与 PostGIS
  hosts: all
  become: true

  vars:
    # 集群配置目录：Debian/Ubuntu 的固定布局，由 pg_createcluster 决定，不放 inventory
    pg_confdir: "/etc/postgresql/{{ postgres_version }}/{{ pg_cluster_name }}"

  tasks:

    # ================= 装包前：check 模式下可验 =================

    - name: 建立 postgresql-common 配置目录
      ansible.builtin.file:
        path: /etc/postgresql-common
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: 禁止安装时自动创建集群
      ansible.builtin.copy:
        dest: /etc/postgresql-common/createcluster.conf
        owner: root
        group: root
        mode: "0644"
        content: |
          # 由 infra/playbooks/20-database.yml 管理，勿手改
          #
          # 必须在安装 postgresql 之前就位。Ubuntu 的 postgresql 包会在 postinst 里
          # 自动建一个 main 集群并沿用系统 locale（en_US.UTF-8），而 DD-63 要求
          # 集群默认 LC_COLLATE=C 以与 glibc 解耦。让它自动建出来再删重建，
          # 既浪费时间又容易留下残留。
          create_main_cluster = false

          # ★ 本文件是【全量覆盖】发行版自带的同名文件。发行版默认值里带
          #   add_include_dir = 'conf.d'，写了这个文件就等于把它一起抹掉，
          #   于是 pg_createcluster 生成的 postgresql.conf 里没有 include_dir，
          #   conf.d/*.conf 写了也不加载。本项目实测踩过。
          #   凡「覆盖发行版配置文件」，必须把原默认值里仍然需要的项一并写回。
          add_include_dir = 'conf.d'

    - name: 安装 PostgreSQL 与 PostGIS
      ansible.builtin.apt:
        name: "{{ database_packages }}"
        state: present
        update_cache: true
        cache_valid_time: 3600

    # ================= 装包后：依赖包创建的用户、目录与服务 =================
    # 整块跳过 check 模式，理由见文件头。

    - name: 集群创建与配置
      when: not ansible_check_mode
      block:

        # ---------- WAL 目录 ----------
        # WAL 在独立卷上（00-base 已断言）。initdb 要求 waldir 为空且属主为 postgres。
        # postgres 系统用户由 postgresql-common 的 postinst 创建，故必须在装包之后。
        - name: 建立 WAL 目录
          ansible.builtin.file:
            path: "{{ pg_waldir }}"
            state: directory
            owner: postgres
            group: postgres
            mode: "0700"

        # ---------- 显式创建集群 ----------
        - name: 查询已有集群
          ansible.builtin.command:
            cmd: pg_lsclusters --no-header
          register: _clusters
          changed_when: false
          check_mode: false
          failed_when: false

        - name: 创建集群（locale=C，DD-63）
          ansible.builtin.command:
            cmd: >-
              pg_createcluster {{ postgres_version }} {{ pg_cluster_name }}
              --port {{ pg_port }}
              --
              --locale=C
              --encoding=UTF8
              --waldir={{ pg_waldir }}/{{ postgres_version }}-{{ pg_cluster_name }}
          when: >-
            (postgres_version | string + ' ' + pg_cluster_name)
            not in (_clusters.stdout | default(''))

        - name: 启动并自启集群
          ansible.builtin.systemd_service:
            name: "postgresql@{{ postgres_version }}-{{ pg_cluster_name }}"
            enabled: true
            state: started

        # ---------- 验证 locale 真的是 C ----------
        # 本剧本的核心断言。集群一旦建错，后面所有工作都建在错误的地基上，
        # 而症状要到 OS 大版本升级那天才显形。
        - name: 查询集群 locale 与编码
          ansible.builtin.command:
            cmd: >-
              psql -tAc "SELECT datcollate || '|' || datctype || '|' ||
              pg_encoding_to_char(encoding) FROM pg_database WHERE datname='postgres'"
          become_user: postgres
          register: _dblocale
          changed_when: false
          failed_when: false

        - name: 断言集群 locale 为 C、编码为 UTF8
          ansible.builtin.assert:
            that:
              - _dblocale.stdout | trim == 'C|C|UTF8'
            fail_msg: >-
              集群 locale 为「{{ _dblocale.stdout | trim }}」，应为 C|C|UTF8（DD-63）。
              locale 在 initdb 时确定，无法在线更改——必须删除集群重建：
                sudo pg_dropcluster {{ postgres_version }} {{ pg_cluster_name }} --stop
                重跑本剧本
              若集群中已有数据，先备份。
            success_msg: "集群 locale：{{ _dblocale.stdout | trim }}（符合 DD-63）"

        # ---------- 参数 ----------
        # conf.d 目录与 postgresql.conf 里的 include_dir，本该由 pg_createcluster
        # 依据 createcluster.conf 的 add_include_dir 一起生成。本项目两样都没有，
        # 根因是上面那个「禁止自动建集群」的文件整份覆盖了发行版默认值，
        # 把 add_include_dir 一起抹掉了。默认值已补回，但对已建好的集群无效，
        # 故这里补目录、补 include_dir，并在下发参数后实测它是否真的生效。
        - name: 建立 conf.d 目录
          ansible.builtin.file:
            path: "{{ pg_confdir }}/conf.d"
            state: directory
            owner: postgres
            group: postgres
            mode: "0755"

        # 已经建好的集群，postgresql.conf 已经生成，改 createcluster.conf 救不回来，
        # 所以这里直接把 include_dir 补进去（幂等）。
        - name: 确保 postgresql.conf 引入 conf.d
          ansible.builtin.lineinfile:
            path: "{{ pg_confdir }}/postgresql.conf"
            line: "include_dir = 'conf.d'"
            regexp: "^[#[:space:]]*include_dir[[:space:]]*=[[:space:]]*'conf\\.d'"
            owner: postgres
            group: postgres
            mode: "0644"
          notify: restart postgresql

        - name: 下发 PostgreSQL 参数
          ansible.builtin.template:
            src: ../files/postgresql-oss911.conf.j2
            dest: "{{ pg_confdir }}/conf.d/10-oss911.conf"
            owner: postgres
            group: postgres
            mode: "0644"
          notify: restart postgresql

        # 参数要在建库之前真正加载，否则本次运行里的验证读到的是旧值
        - name: 立即应用参数变更
          ansible.builtin.meta: flush_handlers

        - name: 查询关键参数实际值
          ansible.builtin.command:
            cmd: psql -tAc "SHOW shared_buffers"
          become_user: postgres
          register: _shb
          changed_when: false
          failed_when: false

        - name: 断言参数文件确实生效
          ansible.builtin.assert:
            that:
              - _shb.stdout | trim == '8GB'
            fail_msg: >-
              shared_buffers 实际为「{{ _shb.stdout | trim }}」，期望 8GB。
              说明 conf.d/10-oss911.conf 没有被加载。用
                sudo -u postgres psql -tAc "SELECT sourcefile FROM pg_settings WHERE name='shared_buffers'"
              查实际生效的文件是哪一个。
            success_msg: "参数文件已生效（shared_buffers = {{ _shb.stdout | trim }}）"

        # ---------- 业务库与扩展 ----------
        - name: 创建业务库
          ansible.builtin.command:
            cmd: createdb --template=template0 --locale=C --encoding=UTF8 {{ pg_database }}
          become_user: postgres
          register: _createdb
          changed_when: _createdb.rc == 0
          failed_when: _createdb.rc != 0 and 'already exists' not in _createdb.stderr

        # CREATE EXTENSION IF NOT EXISTS 即使什么都没做，也照样返回命令标签
        # 「CREATE EXTENSION」，所以不能拿 stdout 判断改没改——要先查再建。
        - name: 查询已启用的扩展
          ansible.builtin.command:
            cmd: psql -d {{ pg_database }} -tAc "SELECT extname FROM pg_extension"
          become_user: postgres
          register: _ext_have
          changed_when: false

        - name: 启用扩展
          ansible.builtin.command:
            cmd: psql -d {{ pg_database }} -c "CREATE EXTENSION {{ item }}"
          become_user: postgres
          loop: "{{ pg_extensions }}"
          when: item not in (_ext_have.stdout_lines | map('trim') | list)

        # ---------- ICU 可用性：DD-63 的列级 collation 依赖它 ----------
        - name: 查询 ICU 排序规则
          ansible.builtin.command:
            cmd: >-
              psql -d {{ pg_database }} -tAc
              "SELECT count(*) FROM pg_collation WHERE collname IN ('ar-x-icu','en-x-icu')"
          become_user: postgres
          register: _icu
          changed_when: false
          failed_when: false

        - name: 断言 ICU 排序规则可用
          ansible.builtin.assert:
            that:
              - _icu.stdout | trim == '2'
            fail_msg: >-
              ICU 排序规则 ar-x-icu / en-x-icu 不可用（找到 {{ _icu.stdout | trim }} 个）。
              DD-63 的列级 collation 依赖它们，缺失则 ddl/02_core_dimensions.sql 无法执行。
            success_msg: "ICU 排序规则可用：ar-x-icu · en-x-icu"

        # ---------- ICU 是否真的在起作用 ----------
        # 「可用」不等于「生效」。与网段那次同一性质：断言全过，功能可以是空的。
        # 故用真实会分叉的阿语数据比一次——ICU ar 把 همزة 变体归到一起，
        # 字节序把同一名字的两种拼法拆到列表两端。
        - name: 实测 ICU 排序与字节序确实不同
          ansible.builtin.command:
            cmd: >-
              psql -d {{ pg_database }} -tAc
              "WITH t(v) AS (VALUES ('أحمد'),('احمد'),('إبراهيم'),('ابراهيم'))
               SELECT CASE WHEN
                 (SELECT array_agg(v ORDER BY v COLLATE \"ar-x-icu\") FROM t)
                 <> (SELECT array_agg(v ORDER BY v COLLATE \"C\") FROM t)
               THEN 'differs' ELSE 'same' END"
          become_user: postgres
          register: _collcheck
          changed_when: false
          failed_when: false

        - name: 断言 ICU 排序确实改变了结果
          ansible.builtin.assert:
            that:
              - _collcheck.stdout | trim == 'differs'
            fail_msg: >-
              ICU 阿语排序与字节序结果相同（「{{ _collcheck.stdout | trim }}」），
              说明列级 collation 未真正生效。与网段隔离那次同一性质：断言存在很容易，
              验证生效才是要点。往下做没有意义，先查 PostgreSQL 的 ICU 编译支持。
            success_msg: "ICU 阿语排序已生效（与字节序结果不同）"

  handlers:
    - name: restart postgresql
      ansible.builtin.systemd_service:
        name: "postgresql@{{ postgres_version }}-{{ pg_cluster_name }}"
        state: restarted
