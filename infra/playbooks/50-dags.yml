# 50-dags -- deploy the Airflow DAGs and the dbt project of the release
#
# Basis: DD-84 · DD-85 · LD-01 2.5 · LD-06 2.4
# Prerequisites: 30-python (Airflow, the pools, venv-ingest) · 45-contracts (the DAG manifest
#                /opt/oss911/release/dags.json, the only thing the DAGs read -- LD-01 2.1)
#
# * The DAG files come from the release directory 45-contracts created and rehearsed them in
#   (/opt/oss911/releases/<content hash>/dags, tasks/release_dir.yml), verified again by hash here -- never straight
#   from the repository, which may have changed since. No release directory for the current content: run 45 first.
# * The DAG folder holds exactly the .py files of the release. A file deleted from the repository is deleted here
#   too: unlike most leftovers (CLAUDE.md section 5, item four), a stale DAG file is not harmless -- the scheduler
#   keeps running it.
# * After copying, the DAGs are parsed and written to the metadata database at once (airflow dags reserialize)
#   instead of waiting for the DAG processor's next scan, and import errors fail the playbook.
# * The dbt project goes to /opt/oss911/dbt (root, read-only for airflow) the same way: exactly the release's files,
#   a file no longer in the release is removed -- a stale model would still be built. dbt writes its target and logs
#   under the airflow home, never into the project (src/dags/oss911_build.py).
# * New DAGs start paused (Airflow's dags_are_paused_at_creation). Unpausing is an operator action
#   (runbook/11); start / stop of a source is meta.source_contract.enabled, the DAG's pause is for operations.

- name: Airflow DAGs
  hosts: all
  gather_facts: false   # no facts used (same reasoning as 40-schema.yml)
  become: true

  vars:
    oss911_etc: /etc/oss911
    repo_root: "{{ playbook_dir }}/../.."
    dags_dir: "{{ airflow_home }}/dags"
    dbt_dir: "{{ venv_root }}/dbt"
    af_venv: "{{ venv_root }}/venv-airflow"

  tasks:

    - name: Find and verify the release directory (created by 45-contracts)
      ansible.builtin.include_tasks: "{{ playbook_dir }}/tasks/release_dir.yml"
      vars:
        rel_create: false

    - name: Take the DAG files of the release
      ansible.builtin.set_fact:
        dag_files: "{{ rel_names | select('match', '^dags/') | map('regex_replace', '^dags/', '') | list }}"

    - name: Assert the release has DAG files
      ansible.builtin.assert:
        that:
          - dag_files | length > 0
        fail_msg: "No DAG files in release {{ rel_id }}"
        success_msg: "DAG files in release {{ rel_id }}: {{ dag_files | join(', ') }}"

    - name: Install the DAG files from the release directory
      ansible.builtin.copy:
        src: "{{ rel_dir }}/dags/{{ item }}"
        remote_src: true
        dest: "{{ dags_dir }}/{{ item }}"
        owner: airflow
        group: airflow
        mode: "0640"
      loop: "{{ dag_files }}"

    # ---------- The dbt project ----------
    - name: Take the dbt files of the release
      ansible.builtin.set_fact:
        dbt_files: "{{ rel_names | select('match', '^dbt/') | map('regex_replace', '^dbt/', '') | list }}"

    - name: Create the dbt project directories
      ansible.builtin.file:
        path: "{{ dbt_dir }}/{{ item }}"
        state: directory
        owner: root
        group: root
        mode: "0755"
      loop: "{{ [''] + (dbt_files | map('dirname') | reject('equalto', '') | unique | sort | list) }}"

    - name: Install the dbt project from the release directory
      ansible.builtin.copy:
        src: "{{ rel_dir }}/dbt/{{ item }}"
        remote_src: true
        dest: "{{ dbt_dir }}/{{ item }}"
        owner: root
        group: root
        mode: "0644"
      loop: "{{ dbt_files }}"

    - name: Find the files in the dbt project directory
      ansible.builtin.find:
        paths: "{{ dbt_dir }}"
        recurse: true
        file_type: file
      register: _dbt_present

    - name: Remove dbt files that are not in this release
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop: "{{ _dbt_present.files | map(attribute='path') | reject('in', dbt_files | map('regex_replace', '^', dbt_dir ~ '/') | list) | list }}"

    # __pycache__ is written by Airflow's own DAG processor on every parse; removing it would make every run
    # "changed" (and it would only come back)
    - name: Find the files in the DAG folder
      ansible.builtin.find:
        paths: "{{ dags_dir }}"
        file_type: any
        hidden: true
        excludes: ["__pycache__"]
      register: _present

    - name: Remove files that are not DAG files of this release
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop: "{{ _present.files | map(attribute='path') | reject('in', dag_files | map('regex_replace', '^', dags_dir ~ '/') | list) | list }}"

    - name: Parse the DAGs into the metadata database now
      ansible.builtin.shell:
        cmd: |
          set -o pipefail      # the sed that masks the connection string must not hide a failure
          set -a; . {{ oss911_etc }}/airflow.env; set +a
          {{ af_venv }}/bin/airflow dags reserialize 2>&1 | sed -E 's#(postgresql\+psycopg2://[^:]+:)[^@]+@#\1***@#g'
      args:
        executable: /bin/bash
      become_user: airflow
      register: _reser
      changed_when: false

    # The Airflow CLI prints warnings to stdout before its JSON (e.g. "Could not import graphviz" -- graphviz only
    # renders DAG images on the command line, not needed here, and not worth a new dependency). The JSON is always
    # the last line, so only the last line is parsed.
    - name: Query import errors
      ansible.builtin.shell:
        cmd: |
          set -a; . {{ oss911_etc }}/airflow.env; set +a
          {{ af_venv }}/bin/airflow dags list-import-errors -o json 2>/dev/null
      args:
        executable: /bin/bash
      become_user: airflow
      register: _imperr
      changed_when: false
      check_mode: false

    - name: Assert there are no import errors
      ansible.builtin.assert:
        that:
          - (_imperr.stdout_lines | last | default('[]') | from_json | length) == 0
        fail_msg: |-
          Airflow reports import errors:
          {{ _imperr.stdout }}
        success_msg: "No DAG import errors"

    - name: Query the DAGs Airflow knows
      ansible.builtin.shell:
        cmd: |
          set -a; . {{ oss911_etc }}/airflow.env; set +a
          {{ af_venv }}/bin/airflow dags list -o json 2>/dev/null
      args:
        executable: /bin/bash
      become_user: airflow
      register: _dags
      changed_when: false
      check_mode: false

    # The manifest says which DAGs must exist: one ingest_<source> per managed source, and resweep_<source> where
    # the source has a time window. JSON, written by `oss911-ingest dag-manifest`; reading it here is safe
    - name: Read the DAG manifest
      ansible.builtin.slurp:
        src: "{{ venv_root }}/release/dags.json"
      register: _manifest

    - name: Assert every DAG of the manifest is present
      ansible.builtin.assert:
        that:
          - item in (_dags.stdout_lines | last | from_json | map(attribute='dag_id') | list)
        fail_msg: "No DAG {{ item }}. Present: {{ _dags.stdout_lines | last | from_json | map(attribute='dag_id') | join(', ') }}"
        success_msg: >-
          DAG {{ item }} present, paused:
          {{ (_dags.stdout_lines | last | from_json | selectattr('dag_id', 'equalto', item) | first).is_paused }}
      loop: >-
        {{ (_manifest.content | b64decode | from_json).sources | map(attribute='source_id') | map('regex_replace', '^', 'ingest_') | list
           + (_manifest.content | b64decode | from_json).sources | selectattr('resweep') | map(attribute='source_id')
             | map('regex_replace', '^', 'resweep_') | list
           + ['maintenance_partitions'] }}
