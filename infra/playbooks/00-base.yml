---
# 00-base -- system baseline
#
# Discipline: use ansible.builtin only, no extra collections.
# Every collection is one more offline supply chain, and every supply chain is one more
# point where supply can break (LD-09 chapter 7).
#
# Idempotence: a second run must not fail and must not change anything. Nobody can debug
# on the spot during an offline rebuild.

- name: System baseline
  hosts: all
  become: true

  tasks:

    # ---------- 1. First make sure this is the machine we think it is ----------
    - name: Assert the OS version matches the baseline
      ansible.builtin.assert:
        that:
          - ansible_facts['distribution'] == os_distribution
          - ansible_facts['distribution_release'] == os_release
        fail_msg: >-
          OS does not match the baseline: expected {{ os_distribution }} {{ os_release }},
          found {{ ansible_facts['distribution'] }} {{ ansible_facts['distribution_release'] }}.
          The playbooks are written for the baseline version; results on any other version are not trustworthy.
        success_msg: "OS baseline OK: {{ os_distribution }} {{ os_release }}"

    - name: Assert memory and CPU are not below the design values
      ansible.builtin.assert:
        that:
          - ansible_facts['memtotal_mb'] | int >= 60000
          - ansible_facts['processor_vcpus'] | int >= 16
        fail_msg: >-
          Insufficient capacity: memory {{ ansible_facts['memtotal_mb'] }} MB,
          vCPU {{ ansible_facts['processor_vcpus'] }}. Design values are 64 GB / 16 cores.

    # ---------- 2. Volume checks: detect drift only, never fix it ----------
    - name: Read mount point information
      ansible.builtin.set_fact:
        _mount_map: >-
          {{ dict(ansible_facts['mounts'] | map(attribute='mount') | list
                  | zip(ansible_facts['mounts'] | map(attribute='size_total') | list)) }}

    - name: Assert every volume is mounted and large enough
      ansible.builtin.assert:
        that:
          - item.path in _mount_map
          - (_mount_map[item.path] | int) >= (item.min_gb | int * 1024 * 1024 * 1024 * 0.95)
        fail_msg: >-
          Volume {{ item.path }} is missing or too small (required >= {{ item.min_gb }} GB).
          To extend: lvextend -L <new size> -r /dev/{{ vg_name }}/<lv name>
      loop: "{{ required_mounts }}"
      loop_control:
        label: "{{ item.path }} >= {{ item.min_gb }}GB"

    - name: Check free space in the volume group
      ansible.builtin.command:
        cmd: vgs --noheadings --units g -o vg_free {{ vg_name }}
      register: _vgfree
      changed_when: false
      check_mode: false          # read-only query; must really run in check mode too, or the assert below gets an empty string

    - name: Warn when the volume group reserve is too low
      ansible.builtin.assert:
        that:
          - (_vgfree.stdout | trim | regex_replace('[<>g]', '') | float) >= (vg_free_min_gb | float)
        fail_msg: >-
          Volume group has {{ _vgfree.stdout | trim }} free, below the reserve of {{ vg_free_min_gb }} GB.
          The reserve is the only thing online LVM extension can draw on -- once it is gone, adding disk means downtime.

    # ---------- 3. Localisation ----------
    # Compare the zone name, not the UTC offset: +03 is shared by Moscow, Baghdad and Nairobi,
    # and comparing offsets would let a machine with the wrong zone pass silently.
    - name: Query the current timezone
      ansible.builtin.command:
        cmd: timedatectl show -p Timezone --value
      register: _tz_now
      changed_when: false
      check_mode: false

    - name: Set the timezone
      ansible.builtin.command:
        cmd: timedatectl set-timezone {{ system_timezone }}
      when: _tz_now.stdout | trim != system_timezone
      changed_when: true

    - name: Install the baseline packages
      ansible.builtin.apt:
        name: "{{ base_packages }}"
        state: present
        update_cache: true
        cache_valid_time: 3600

    # Both steps are needed: the first manages the declaration (/etc/locale.gen decides what
    # gets generated when the system is rebuilt), the second the actual state (locale -a is the
    # only trustworthy fact). With only the first, a locale already listed but never generated
    # is not fixed; with only the second, dpkg-reconfigure or an upgrade may remove it.
    - name: Declare the required locale in /etc/locale.gen
      ansible.builtin.lineinfile:
        path: /etc/locale.gen
        regexp: '^#?\s*{{ system_locale | regex_escape }} UTF-8\s*$'
        line: "{{ system_locale }} UTF-8"

    - name: Query the generated locales
      ansible.builtin.command:
        cmd: locale -a
      register: _locales
      changed_when: false
      check_mode: false

    # locale -a prints e.g. en_US.utf8, spelled differently from en_US.UTF-8,
    # so both sides drop hyphens and are lower-cased before comparing.
    - name: Generate the locale
      ansible.builtin.command:
        cmd: locale-gen {{ system_locale }}
      when: >-
        (system_locale | replace('-', '') | lower)
        not in (_locales.stdout_lines | map('replace', '-', '') | map('lower') | list)
      changed_when: true

    - name: Pin the default locale
      ansible.builtin.copy:
        dest: /etc/default/locale
        content: |
          LANG={{ system_locale }}
        owner: root
        group: root
        mode: "0644"

    # ---------- 4. sysstat: installing is not enough, it must be enabled or sar has no history ----------
    - name: Enable sysstat collection
      ansible.builtin.lineinfile:
        path: /etc/default/sysstat
        regexp: '^ENABLED='
        line: 'ENABLED="true"'
      notify: restart sysstat

    - name: Start sysstat at boot
      ansible.builtin.systemd_service:
        name: sysstat
        enabled: true
        state: started

    # ---------- 5. Kernel parameters ----------
    - name: Deploy kernel parameters
      ansible.builtin.copy:
        dest: /etc/sysctl.d/90-oss911-dev.conf
        owner: root
        group: root
        mode: "0644"
        content: |
          # OSS911 development kernel parameters -- managed by infra/playbooks/00-base.yml, do not edit by hand
          #
          # Note: these are DEVELOPMENT values. The production database VMs use a different set
          # (RS-01: no overcommit, 100% memory reservation, no ballooning, no swap). Do not copy this file there.

          # Swap: keep 8G as a safety net, but never let it become a regular memory tier.
          # Once a database machine starts paging, latency degrades by orders of magnitude.
          vm.swappiness = 10

          # Dirty pages: the default ratios on a 62GB machine allow several GB to pile up before
          # writeback, and one flush then causes a noticeable stall. Fix them in bytes, independent of memory size.
          vm.dirty_background_bytes = 67108864
          vm.dirty_bytes = 536870912

          # Keep overcommit at the default 0.
          # PostgreSQL recommends 2 for dedicated database hosts, but this machine also runs Superset,
          # Airflow and front-end builds, which all request large amounts on demand -- 2 would cause many
          # spurious failures. The dedicated production database VMs follow the official advice.
          vm.overcommit_memory = 0

          # File handles: PG + containers + front-end builds together easily hit the default limits
          fs.file-max = 2097152
          fs.inotify.max_user_watches = 524288
          fs.inotify.max_user_instances = 1024

          # Network: connection counts on the container network and local loopback
          net.core.somaxconn = 4096
          net.ipv4.tcp_max_syn_backlog = 4096
      notify: reload sysctl

    # ---------- 6. Disable automatic upgrades ----------
    # The version baseline must be reproducible; unattended-upgrades changes package versions
    # without anyone knowing and silently drifts the machine away from MANIFEST. Patching is a
    # controlled action instead: follow the runbook and leave a record.
    - name: Disable unattended-upgrades
      ansible.builtin.copy:
        dest: /etc/apt/apt.conf.d/99-oss911-no-auto-upgrade
        owner: root
        group: root
        mode: "0644"
        content: |
          // Managed by infra/playbooks/00-base.yml, do not edit by hand
          // Why automatic upgrades are disabled: see runbook/02-patching.md --
          // the version baseline must be reproducible, and automatic upgrades silently drift the machine away from MANIFEST.
          APT::Periodic::Update-Package-Lists "0";
          APT::Periodic::Unattended-Upgrade "0";

    - name: Disable the automatic upgrade timers
      ansible.builtin.systemd_service:
        name: "{{ item }}"
        enabled: false
        state: stopped
      loop:
        - apt-daily.timer
        - apt-daily-upgrade.timer
      failed_when: false

  handlers:
    - name: reload sysctl
      ansible.builtin.command:
        cmd: sysctl --system
      changed_when: true

    - name: restart sysstat
      ansible.builtin.systemd_service:
        name: sysstat
        state: restarted
