# 30-python —— Python 侧：Airflow 与 dbt
#
# 两个 venv，不是一个。Airflow 与 dbt 的依赖长期相互冲突，合在一起要么装不上，
# 要么装上之后某一方被静默降级——后者更坏，因为它要到运行期才显形。
# Airflow 用 BashOperator 调 dbt 的可执行文件，两边只共享项目目录。
#
# ★ 一律按离网方式安装，即使开发机此刻有网。
#   流程分两段：取料（需要网）与安装（不需要网）。安装一段永远走
#   --no-index --find-links，从本机 wheelhouse 装。
#   这样做的理由是：开发机能上网这件事，会让所有离网问题推迟到最糟的时刻才暴露。
#   多一步取料的代价，换这条链路从第一天起就是真的。
#
# ★ 取料用 pip wheel，不用 pip download。两者的区别只在一处，但那一处是关键：
#   少数包（如 dbt-core-experimental-parser）上游只发源码包。pip download 会把
#   .tar.gz 原样存下，装机时现场编译——那等于把编译器、头文件和一次可能失败的
#   构建搬进了生产网。pip wheel 在**取料这台有网的机器上**就把源码包构建成 .whl，
#   装机侧因此只会遇到轮子。取料之后有一条断言守着这件事。
#
# ★ Airflow 的 constraints 是硬条件不是建议。不带它解出来的依赖组合
#   大概率装不出一个能跑的环境。URL 由 Airflow 版本与 Python 次版本共同决定。
#   dbt 没有官方 constraints，故自己冻结 lock（DD-69）。

- name: Python 侧 Airflow 与 dbt
  hosts: all
  become: true

  vars:
    oss911_etc: /etc/oss911
    af_venv: "{{ venv_root }}/venv-airflow"
    dbt_venv: "{{ venv_root }}/venv-dbt"
    constraints_file: "{{ wheelhouse }}/constraints-airflow-{{ airflow_version }}-py312.txt"
    dbt_lock: "{{ wheelhouse }}/dbt-requirements.lock"

  tasks:

    - name: 断言 dbt 并发不超过会话池
      ansible.builtin.assert:
        that:
          - pgb_pool_size_session >= 1
        fail_msg: "会话池大小即 dbt 的 threads 上限，不能为零"
        success_msg: "dbt threads 上限 = 会话池大小 {{ pgb_pool_size_session }}"

    - name: 安装构建依赖
      ansible.builtin.apt:
        name:
          - python3-venv
          - python3-pip
          # 下面两项只为**取料**服务：pip wheel 要把少数只发源码包的依赖构建成轮子。
          # 安装侧不需要它们（wheelhouse 里只有轮子，见取料后的断言）。
          # 生产机若由平台基线交付且不含编译器，这两项可以不装——届时取料必须
          # 在另一台有网的同版本机器上完成。
          - build-essential
          - libpq-dev
        state: present
        update_cache: true
        cache_valid_time: 3600

    - name: 建立服务账号与目录
      ansible.builtin.user:
        name: airflow
        system: true
        shell: /usr/sbin/nologin
        home: "{{ airflow_home }}"
        create_home: true

    # 权限按「谁要用」给，不按「越紧越好」给。
    #   venv_root  0755：airflow 服务账号要能进去执行里面的二进制。
    #              venv 里没有秘密——口令都在 /etc/oss911 下，0600。
    #              给 0750 root:root 的话 airflow 连目录都进不去，
    #              症状是执行二进制报 Permission denied，看着像程序坏了。
    #   wheelhouse 0750：只有 root 装包，服务账号不需要
    - name: 建立目录
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: directory
        owner: "{{ item.owner }}"
        group: "{{ item.owner }}"
        mode: "{{ item.mode }}"
      loop:
        - { path: "{{ venv_root }}",            owner: root,    mode: "0755" }
        - { path: "{{ wheelhouse }}",           owner: root,    mode: "0750" }
        - { path: "{{ wheelhouse }}/airflow",   owner: root,    mode: "0750" }
        - { path: "{{ wheelhouse }}/dbt",       owner: root,    mode: "0750" }
        - { path: "{{ airflow_home }}",         owner: airflow, mode: "0750" }
        - { path: "{{ airflow_home }}/dags",    owner: airflow, mode: "0750" }
        - { path: "{{ airflow_home }}/logs",    owner: airflow, mode: "0750" }

    - name: 配置与安装
      when: not ansible_check_mode
      block:

        # ========== 取料：唯一需要网络的一段，默认不跑 ==========
        # 为什么要有开关：pip download 即使不重传字节，也仍然要连 PyPI 重新解析依赖。
        # 没有开关的话，这个「为离网写的」剧本在真正离网的机器上第一步就失败。
        # 规则：wheelhouse 已就绪就跳过；空的时候自动取一次；要更新时显式
        # -e wheelhouse_refresh=true。
        - name: 检查 wheelhouse 是否已就绪
          ansible.builtin.find:
            paths:
              - "{{ wheelhouse }}/airflow"
              - "{{ wheelhouse }}/dbt"
            patterns: "*.whl,*.tar.gz"
          register: _wh

        - name: 判定本次是否取料
          ansible.builtin.set_fact:
            _do_fetch: "{{ (wheelhouse_refresh | bool) or (_wh.matched | int) == 0 }}"

        - name: 报告取料决定
          ansible.builtin.debug:
            msg: >-
              wheelhouse 现有 {{ _wh.matched }} 个包；本次{{ '取料（需要网络）' if _do_fetch else '不取料，直接离线安装' }}。
              要更新 wheelhouse：-e wheelhouse_refresh=true

        - name: 取 Airflow 的 constraints 文件
          when: _do_fetch | bool
          ansible.builtin.get_url:
            url: "{{ airflow_constraints_url }}"
            dest: "{{ constraints_file }}"
            mode: "0644"
          register: _constraints

        - name: 记录 constraints 的校验和
          ansible.builtin.stat:
            path: "{{ constraints_file }}"
            checksum_algorithm: sha256
          register: _constraints_stat

        - name: 报告 constraints 的校验和
          when: _do_fetch | bool
          ansible.builtin.debug:
            msg: >-
              constraints-airflow-{{ airflow_version }}-py312.txt
              sha256 = {{ _constraints_stat.stat.checksum }}
              —— 填回 artifacts/MANIFEST.md

        - name: 取 Airflow 及其全部传递依赖的轮子
          ansible.builtin.command:
            cmd: >-
              {{ python_bin }} -m pip wheel
              "apache-airflow[{{ airflow_extras }}]=={{ airflow_version }}"
              --constraint {{ constraints_file }}
              --wheel-dir {{ wheelhouse }}/airflow
          register: _dl_af
          changed_when: "'Saved' in _dl_af.stdout or 'Created wheel' in _dl_af.stdout"
          when: _do_fetch | bool

        # dbt 没有官方 constraints：先解析一次，冻结成 lock，此后按 lock 取料。

        - name: 检查是否已有 dbt 的 lock
          ansible.builtin.stat:
            path: "{{ dbt_lock }}"
          register: _dbtlock

        - name: 首次解析 dbt 依赖并冻结为 lock（需要网络）
          ansible.builtin.shell:
            cmd: |
              set -e
              rm -rf /tmp/dbt-resolve
              {{ python_bin }} -m venv /tmp/dbt-resolve
              /tmp/dbt-resolve/bin/pip install --quiet --upgrade pip
              /tmp/dbt-resolve/bin/pip install --quiet {{ dbt_requirements | join(' ') }}
              /tmp/dbt-resolve/bin/pip freeze > {{ dbt_lock }}
              rm -rf /tmp/dbt-resolve
          when:
            - not _dbtlock.stat.exists
            - _do_fetch | bool

        - name: 取 dbt 的轮子（按 lock）
          ansible.builtin.command:
            cmd: >-
              {{ python_bin }} -m pip wheel
              --requirement {{ dbt_lock }}
              --wheel-dir {{ wheelhouse }}/dbt
          register: _dl_dbt
          changed_when: "'Saved' in _dl_dbt.stdout or 'Created wheel' in _dl_dbt.stdout"
          when: _do_fetch | bool

        # 这一条是「构建能力不进墙内」这条原则的执行者。
        # 2026-10-08 实测：pip download 取下来的 190 个包里混着一个源码包
        # （dbt_core_experimental_parser-2.0.5.tar.gz）——上游没发轮子。
        # 改用 pip wheel 之后不应再有源码包；这条断言保证以后也不会悄悄混进来。
        - name: 断言 wheelhouse 中没有源码包
          ansible.builtin.find:
            paths:
              - "{{ wheelhouse }}/airflow"
              - "{{ wheelhouse }}/dbt"
            patterns: "*.tar.gz,*.zip"
          register: _sdist

        - name: 断言 wheelhouse 中没有源码包（判定）
          ansible.builtin.assert:
            that:
              - "(_sdist.matched | int) == 0"
            fail_msg: >-
              wheelhouse 里有 {{ _sdist.matched }} 个源码包：
              {{ _sdist.files | map(attribute='path') | map('basename') | join('、') }}。
              源码包要在装机时现场编译，等于把编译器与一次可能失败的构建带进生产网。
              处置：在有网的机器上 -e wheelhouse_refresh=true 重新取料
              （pip wheel 会把它们构建成轮子），构建失败的包要单独查上游。
            success_msg: "wheelhouse 中只有轮子，装机侧不需要编译器"

        # 这里要重新数一遍，不能用取料前那次 _wh 的结果：
        # 前一次的数字只说明「要不要取料」，这一次才说明「现在装得了吗」。
        # 取料开着却一个包都没取到（源地址不通、constraints 解析失败），
        # 以及离网时介质没放对位置，都只有在这一次计数里才看得见。
        - name: 复数 wheelhouse 中的轮子
          ansible.builtin.find:
            paths:
              - "{{ wheelhouse }}/airflow"
              - "{{ wheelhouse }}/dbt"
            patterns: "*.whl"
          register: _wh_final

        - name: 断言离线安装的前提已具备
          ansible.builtin.assert:
            that:
              - "(_wh_final.matched | int) > 0"
            fail_msg: >-
              wheelhouse（{{ wheelhouse }}）里没有轮子，无法离线安装。
              有网时用 -e wheelhouse_refresh=true 取一次；
              离网时把介质上的 wheelhouse 目录与 {{ constraints_file | basename }}、
              {{ dbt_lock | basename }} 一并放到该路径下再跑。
              本次{{ '执行了取料但未取到任何轮子——先看上面取料那两步的输出' if _do_fetch else '未取料' }}。
            success_msg: "离线安装的前提具备：wheelhouse 中有 {{ _wh_final.matched }} 个轮子"

        # ========== 安装：不走网络 ==========
        # --no-index 是这一段的关键：它让 pip 完全不去问 PyPI。
        # 若 wheelhouse 里缺东西，这里会当场失败——而不是默默上网取来，
        # 把一个离网环境里必然出现的问题藏到交付之后。

        - name: 建立 Airflow 的 venv
          ansible.builtin.command:
            cmd: "{{ python_bin }} -m venv {{ af_venv }}"
            creates: "{{ af_venv }}/bin/python"

        - name: 离线安装 Airflow
          ansible.builtin.command:
            cmd: >-
              {{ af_venv }}/bin/pip install
              --no-index --find-links {{ wheelhouse }}/airflow
              --constraint {{ constraints_file }}
              "apache-airflow[{{ airflow_extras }}]=={{ airflow_version }}"
          register: _inst_af
          changed_when: "'Successfully installed' in _inst_af.stdout"

        - name: 建立 dbt 的 venv
          ansible.builtin.command:
            cmd: "{{ python_bin }} -m venv {{ dbt_venv }}"
            creates: "{{ dbt_venv }}/bin/python"

        - name: 离线安装 dbt
          ansible.builtin.command:
            cmd: >-
              {{ dbt_venv }}/bin/pip install
              --no-index --find-links {{ wheelhouse }}/dbt
              --requirement {{ dbt_lock }}
          register: _inst_dbt
          changed_when: "'Successfully installed' in _inst_dbt.stdout"

        # 以真正要用它的身份验一次——不是以 root。
        # 上一版的版本检查是 root 跑的，而 root 进得去任何目录，
        # 于是「airflow 用户能不能执行这个二进制」从来没被验过，
        # 直到 db migrate 报 Permission denied 才显形。
        # 与 auth_query 那次同一条教训：用于验证的身份不能是实际使用身份的例外。
        - name: 以服务账号验证两个 venv 可执行
          ansible.builtin.command:
            cmd: "{{ item }}"
          become_user: airflow
          register: _asuser
          changed_when: false
          failed_when: false
          loop:
            - "{{ af_venv }}/bin/airflow version"
            - "{{ dbt_venv }}/bin/dbt --version"

        - name: 断言服务账号能执行两个 venv 里的程序
          ansible.builtin.assert:
            that:
              - "item.rc == 0"
            fail_msg: >-
              airflow 用户执行「{{ item.item }}」失败：{{ item.stderr | default(item.stdout) | truncate(200) }}。
              最常见的原因是 {{ venv_root }} 的权限不允许该用户进入目录——
              venv 里没有秘密，应为 0755；口令在 /etc/oss911 下另行保护。
              核对：namei -l {{ af_venv }}/bin/airflow
            success_msg: "服务账号可执行：{{ item.item }}"
          loop: "{{ _asuser.results }}"
          loop_control:
            label: "{{ item.item }}"

        # ========== 元数据库 ==========
        - name: 查询 Airflow 的库用户是否存在
          ansible.builtin.command:
            cmd: psql -tAc "SELECT 1 FROM pg_roles WHERE rolname = '{{ airflow_db }}'"
          become_user: postgres
          register: _afrole
          changed_when: false
          check_mode: false

        - name: 生成 Airflow 的库口令
          ansible.builtin.set_fact:
            _af_db_password: "{{ lookup('ansible.builtin.password', '/dev/null', length=32, chars=['ascii_letters','digits']) }}"
          when: _afrole.stdout | trim != '1'
          no_log: true

        - name: 建立 Airflow 的库用户与数据库
          ansible.builtin.shell:
            cmd: |
              set -e
              psql -tAc "CREATE ROLE {{ airflow_db }} LOGIN PASSWORD '{{ _af_db_password }}'"
              createdb --owner={{ airflow_db }} --template=template0 --locale=C --encoding=UTF8 {{ airflow_db }}
          become_user: postgres
          when: _afrole.stdout | trim != '1'
          no_log: true

        - name: 读回已有的 Airflow 环境文件
          ansible.builtin.slurp:
            src: "{{ oss911_etc }}/airflow.env"
          register: _afenv
          failed_when: false
          no_log: true

        - name: 取回 Airflow 的库口令
          ansible.builtin.set_fact:
            _af_db_password: "{{ (_afenv.content | b64decode) | regex_search('SQL_ALCHEMY_CONN=postgresql\\+psycopg2://[^:]+:([^@]+)@', '\\1') | first }}"
          when:
            - _af_db_password is not defined
            - _afenv.content is defined
          no_log: true

        - name: 下发 Airflow 环境文件
          ansible.builtin.template:
            src: ../files/airflow.env.j2
            dest: "{{ oss911_etc }}/airflow.env"
            owner: airflow
            group: airflow
            mode: "0600"
          no_log: true

        # 口令不进命令行也不进 Ansible 的环境变量——从 0600 的环境文件里现读。
        # 这样就不需要 no_log，失败时能看到真实错误；输出再对连接串做一次掩码。
        #
        # ★ 上一版在这里加了 no_log: true，结果把失败原因一起藏掉了。
        #   no_log 挡的是「本不该出现在日志里的东西」，不是「失败时必须读到的东西」；
        #   加在前者上是对的，加在后者上等于把排障通道关掉。
        - name: 初始化元数据库
          ansible.builtin.shell:
            cmd: |
              set -a; . {{ oss911_etc }}/airflow.env; set +a
              {{ af_venv }}/bin/airflow db migrate 2>&1 |
                sed -E 's#(postgresql[^ ]*://[^:]+:)[^@]+@#\1***@#g'
          args:
            executable: /bin/bash
          become_user: airflow
          register: _afmigrate
          changed_when: "'Running upgrade' in _afmigrate.stdout"
          failed_when: false

        - name: 断言元数据库初始化成功
          ansible.builtin.assert:
            that:
              - "_afmigrate.stdout is not search('(?i)error|traceback|fatal')"
            fail_msg: |-
              airflow db migrate 失败（口令已掩码）：

              {{ _afmigrate.stdout | default('（无输出）') }}

              排查顺序：
                一、pgBouncer 里有没有 {{ airflow_db }} 这个池：
                    sudo grep '^{{ airflow_db }}' /etc/pgbouncer/pgbouncer.ini
                二、该用户能否经池连上：
                    sudo -u postgres psql -h 127.0.0.1 -p {{ pgb_listen_port }} -U {{ airflow_db }} -d {{ airflow_db }} -c 'select 1'
                三、venv 里有没有 PostgreSQL 驱动：
                    {{ af_venv }}/bin/python -c 'import psycopg2; print(psycopg2.__version__)'
            success_msg: "元数据库已初始化"

        # ========== dbt 的 profiles ==========
        - name: 下发 dbt profiles
          ansible.builtin.template:
            src: ../files/dbt_profiles.yml.j2
            dest: "{{ airflow_home }}/profiles.yml"
            owner: airflow
            group: airflow
            mode: "0640"

        # ========== systemd ==========
        - name: 下发 Airflow 的 systemd 单元
          ansible.builtin.template:
            src: "../files/systemd/airflow-{{ item }}.service.j2"
            dest: "/etc/systemd/system/airflow-{{ item }}.service"
            owner: root
            group: root
            mode: "0644"
          loop: [api-server, scheduler, dag-processor, triggerer]
          register: _afunits

        - name: 重载 systemd
          ansible.builtin.systemd_service:
            daemon_reload: true
          when: _afunits.changed

        - name: 启用并启动 Airflow 的四个组件
          ansible.builtin.systemd_service:
            name: "airflow-{{ item }}.service"
            enabled: true
            state: "{{ 'restarted' if _afunits.changed else 'started' }}"
          loop: [api-server, scheduler, dag-processor, triggerer]

        # ========== 验证：验行为 ==========
        # 「装上了」太容易满足。这三条分别验：装的是不是离线装的、
        # 两个 venv 是不是真的分开、以及两者能不能连上各自要连的库。
        - name: 查询两个 venv 的版本
          ansible.builtin.shell:
            cmd: |
              echo "airflow=$({{ af_venv }}/bin/airflow version 2>/dev/null)"
              echo "dbt=$({{ dbt_venv }}/bin/dbt --version 2>/dev/null | head -1)"
          register: _vers
          changed_when: false

        - name: 断言两个 venv 各自装对了
          ansible.builtin.assert:
            that:
              - "_vers.stdout is search('airflow=' ~ airflow_version)"
              - "_vers.stdout is search('dbt=')"
            fail_msg: "版本不符或命令不存在：{{ _vers.stdout }}"
            success_msg: "{{ _vers.stdout | replace('\n', ' · ') }}"

        # 两个 venv 必须互不可见。混在一起时最常见的症状不是报错，
        # 而是某一方被静默降级，到运行期才显形。
        - name: 断言两个 venv 确实是分开的
          ansible.builtin.shell:
            cmd: |
              test ! -x {{ af_venv }}/bin/dbt && test ! -x {{ dbt_venv }}/bin/airflow && echo separated
          register: _sep
          changed_when: false
          failed_when: "'separated' not in _sep.stdout"

        - name: Airflow 能连上元数据库
          ansible.builtin.shell:
            cmd: |
              set -a; . {{ oss911_etc }}/airflow.env; set +a
              {{ af_venv }}/bin/airflow db check 2>&1 |
                sed -E 's#(postgresql[^ ]*://[^:]+:)[^@]+@#\1***@#g'
          args:
            executable: /bin/bash
          become_user: airflow
          register: _afcheck
          changed_when: false
          failed_when: false

        - name: 断言 Airflow 的元数据库可达
          ansible.builtin.assert:
            that: ["_afcheck.rc == 0"]
            fail_msg: |-
              airflow db check 失败（口令已掩码）：

              {{ _afcheck.stdout | default('（无输出）') }}

              元数据库经 pgBouncer 的 {{ airflow_db }} 库（会话级池）；
              先确认 pgbouncer.ini 里有这一条且 auth_query 可用（21-connection 有对应断言）。
            success_msg: "Airflow 元数据库可达（经 pgBouncer 会话池）"
