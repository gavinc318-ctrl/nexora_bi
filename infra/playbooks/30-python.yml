# 30-python -- the Python side: Airflow, dbt and the ingestion program
#
# Separate venvs, not one. Airflow's and dbt's dependencies have conflicted for a long time; put together
# they either fail to install, or install with one side silently downgraded -- the latter is worse,
# because it only shows at run time. Airflow calls the dbt executable with BashOperator; the two share
# only the project directory. The ingestion program gets a third venv for the same reason (DD-84).
#
# * Always install the offline way, even though the development machine has internet access right now.
#   Two stages: fetch (needs network) and install (no network). The install stage always uses
#   --no-index --find-links and installs from the local wheelhouse.
#   Why: a development machine with internet access postpones every offline problem to the worst possible
#   moment. One extra fetch step buys a path that is real from day one.
#
# * Fetch with pip wheel, not pip download. They differ in one place, and that place is the point:
#   a few packages (e.g. dbt-core-experimental-parser) are published upstream as source only. pip download
#   stores the .tar.gz as is, to be compiled at install time -- which carries a compiler, headers and a
#   build that may fail into the production network. pip wheel builds the source into a .whl ON THE
#   NETWORKED FETCH MACHINE, so the install side only ever meets wheels. An assert after the fetch guards this.
#
# * Airflow's constraints are a hard requirement, not a suggestion. A dependency set resolved without them
#   will very likely not produce a working environment. The URL depends on the Airflow version and the
#   Python minor version. dbt and the ingestion program have no official constraints, so we freeze our own
#   lock (DD-69 · DD-83).

- name: Python side -- Airflow, dbt and the ingestion program
  hosts: all
  # This playbook uses no facts (checked one by one on 2026-10-13: no ansible_* references in the
  # playbook, tasks/ or templates, and no fact-dependent package / service modules). Gathering facts
  # as root scans LVM and every block device, which on this machine sometimes takes minutes -- so we
  # do not gather what we do not need. To use a fact, delete this line and say here which fact is used.
  gather_facts: false
  become: true

  vars:
    oss911_etc: /etc/oss911
    af_venv: "{{ venv_root }}/venv-airflow"
    dbt_venv: "{{ venv_root }}/venv-dbt"
    constraints_file: "{{ wheelhouse }}/constraints-airflow-{{ airflow_version }}-py312.txt"
    # The dbt lock in the repository is the single authority and installation reads it directly; the
    # wheelhouse no longer keeps a copy (DD-83). On the development machine the control node is the target,
    # so the playbook_dir path is valid on the target too; offline, infra/ ships with the media (DD-70) and
    # the path still holds. If this is ever driven remotely, copy it to the target first.
    dbt_lock: "{{ playbook_dir | dirname }}/dbt-requirements.lock"
    # Leftover of the old approach: before DD-83 the lock lived in the wheelhouse. See "Remove the old lock from the wheelhouse" below
    dbt_lock_legacy: "{{ wheelhouse }}/dbt-requirements.lock"
    # The ingestion program (DD-84): the third venv. Its lock is likewise the repository copy (DD-83)
    ingest_venv: "{{ venv_root }}/venv-ingest"
    ingest_lock: "{{ playbook_dir | dirname }}/ingest-requirements.lock"
    ingest_src_repo: "{{ playbook_dir | dirname | dirname }}/src/ingest"   # our own code lives under src/ (2026-10-21)
    # Building our package makes pip write build/ and *.egg-info into the source directory -- written into the
    # repository as root, the next git operation runs into root-owned files. So copy it here and build here.
    ingest_src_dir: "{{ venv_root }}/ingest-src"

  tasks:

    - name: Assert dbt concurrency does not exceed the session pool
      ansible.builtin.assert:
        that:
          - pgb_pool_size_session >= 1
        fail_msg: "The session pool size is the upper limit for dbt threads and cannot be zero"
        success_msg: "dbt threads limit = session pool size {{ pgb_pool_size_session }}"

    - name: Install build dependencies
      ansible.builtin.apt:
        name:
          - python3-venv
          - python3-pip
          # The next two serve the FETCH only: pip wheel has to build the few source-only dependencies into wheels.
          # The install side does not need them (the wheelhouse holds wheels only, see the assert after the fetch).
          # If production machines come from a platform baseline without a compiler, these two can be left out --
          # the fetch must then be done on another networked machine of the same version.
          - build-essential
          - libpq-dev
        state: present
        update_cache: true
        cache_valid_time: 3600

    - name: Create the service account and its directories
      ansible.builtin.user:
        name: airflow
        system: true
        shell: /usr/sbin/nologin
        home: "{{ airflow_home }}"
        create_home: true

    # Permissions follow "who needs to use it", not "the tighter the better".
    #   venv_root  0755: the airflow service account must be able to enter it and run the binaries.
    #              There are no secrets in a venv -- passwords live under /etc/oss911 at 0600.
    #              With 0750 root:root airflow cannot even enter the directory, and the symptom is
    #              "Permission denied" when running a binary, which looks like a broken program.
    #   wheelhouse 0750: only root installs packages; the service account does not need it
    - name: Create directories
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: directory
        owner: "{{ item.owner }}"
        group: "{{ item.owner }}"
        mode: "{{ item.mode }}"
      loop:
        - { path: "{{ venv_root }}",            owner: root,    mode: "0755" }
        - { path: "{{ wheelhouse }}",           owner: root,    mode: "0750" }
        - { path: "{{ wheelhouse }}/airflow",   owner: root,    mode: "0750" }
        - { path: "{{ wheelhouse }}/dbt",       owner: root,    mode: "0750" }
        - { path: "{{ wheelhouse }}/ingest",    owner: root,    mode: "0750" }
        - { path: "{{ airflow_home }}",         owner: airflow, mode: "0750" }
        - { path: "{{ airflow_home }}/dags",    owner: airflow, mode: "0750" }
        - { path: "{{ airflow_home }}/logs",    owner: airflow, mode: "0750" }

    - name: Configuration and installation
      when: not ansible_check_mode
      block:

        # ========== Fetch: the only stage that needs the network; off by default ==========
        # Why a switch: even when no bytes are transferred again, pip still contacts PyPI to resolve the
        # dependency tree. Without a switch this playbook, "written for offline", fails at step one on a
        # really offline machine.
        # Rule: skip when the wheelhouse is ready; fetch once automatically when it is empty; to refresh,
        # pass -e wheelhouse_refresh=true explicitly.
        # Check each subdirectory, not the total: when a subdirectory is added (such as ingest), the others
        # already hold wheels, a total would conclude "ready, no fetch", and the new directory would stay
        # empty until the offline install fails.
        - name: Check whether each wheelhouse subdirectory is ready
          ansible.builtin.find:
            paths: "{{ wheelhouse }}/{{ item }}"
            patterns: "*.whl,*.tar.gz"
          loop: [airflow, dbt, ingest]
          register: _wh_each

        - name: Summarise the wheelhouse state
          ansible.builtin.set_fact:
            _wh:
              matched: "{{ _wh_each.results | map(attribute='matched') | sum }}"
            _wh_empty: "{{ _wh_each.results | selectattr('matched', 'equalto', 0) | map(attribute='item') | list }}"

        # Re-resolving the dbt or ingestion dependencies means versions change, so the wheels must be fetched again too
        - name: Decide whether to fetch in this run
          ansible.builtin.set_fact:
            _do_fetch: >-
              {{ (wheelhouse_refresh | bool) or (dbt_relock | bool) or (ingest_relock | bool)
                 or (_wh_empty | length) > 0 }}

        - name: Report the fetch decision
          ansible.builtin.debug:
            msg: >-
              The wheelhouse holds {{ _wh.matched }} packages{{ ' (empty subdirectories: ' ~ (_wh_empty | join(', ')) ~ ')' if _wh_empty else '' }}; this run will {{ 'fetch (network needed)' if _do_fetch | bool else 'not fetch and install offline directly' }}.
              To refresh the wheelhouse: -e wheelhouse_refresh=true

        - name: Fetch Airflow's constraints file
          when: _do_fetch | bool
          ansible.builtin.get_url:
            url: "{{ airflow_constraints_url }}"
            dest: "{{ constraints_file }}"
            mode: "0644"
          register: _constraints

        - name: Record the checksum of the constraints file
          ansible.builtin.stat:
            path: "{{ constraints_file }}"
            checksum_algorithm: sha256
          register: _constraints_stat

        # * The previous version only printed the checksum for someone to "fill into MANIFEST" and never compared
        #   it -- a downloaded or media-supplied file different from the registered one was installed anyway.
        #   Pinned on paper only (DD-83).
        - name: Assert the constraints file matches the pinned checksum
          ansible.builtin.assert:
            that:
              - _constraints_stat.stat.exists
              - _constraints_stat.stat.checksum == airflow_constraints_sha256
            fail_msg: |-
              {{ constraints_file }} does not match the pinned SHA-256 (or does not exist):
                pinned (inventory, MANIFEST): {{ airflow_constraints_sha256 }}
                actual file:                  {{ _constraints_stat.stat.checksum | default('(file does not exist)') }}
              Do not edit inventory to match the file. First find out which one is right:
                online:  curl -sSfL {{ airflow_constraints_url }} | sha256sum
                offline: check against the checksum list shipped with the media
              Only when the file changed because Airflow is being upgraded, change both
              airflow_constraints_sha256 in inventory and MANIFEST.
            success_msg: "constraints file matches the pinned checksum: {{ airflow_constraints_sha256[:16] }}..."

        - name: Fetch wheels for Airflow and all its transitive dependencies
          ansible.builtin.command:
            cmd: >-
              {{ python_bin }} -m pip wheel
              "apache-airflow[{{ airflow_extras }}]=={{ airflow_version }}"
              --constraint {{ constraints_file }}
              --wheel-dir {{ wheelhouse }}/airflow
          register: _dl_af
          changed_when: "'Saved' in _dl_af.stdout or 'Created wheel' in _dl_af.stdout"
          when: _do_fetch | bool

        # dbt has no official constraints: we resolve once, freeze the result into a lock in the repository, and
        # fetch and install by that lock. The lock is re-resolved only with an explicit -e dbt_relock=true; the
        # result is written back to the repository path and reviewed as a diff before committing (DD-83). It is
        # written as the caller (become: false) so the file stays owned by the repository owner -- written as root,
        # the next git operation runs into root-owned files.
        - name: Re-resolve dbt dependencies and write the repository lock (network needed, only with -e dbt_relock=true)
          ansible.builtin.shell:
            cmd: |
              set -e
              d=$(mktemp -d)
              {{ python_bin }} -m venv "$d"
              "$d"/bin/pip install --quiet --upgrade pip
              "$d"/bin/pip install --quiet {{ dbt_requirements | join(' ') }}
              "$d"/bin/pip freeze > {{ dbt_lock }}
              rm -rf "$d"
          become: false
          when: dbt_relock | bool

        - name: Ask for a review of the new dbt lock
          ansible.builtin.debug:
            msg: >-
              Re-resolved and wrote {{ dbt_lock }}. It is only a candidate: review the version changes with
              git diff infra/dbt-requirements.lock in the repository, commit once confirmed, and update the dbt
              row of artifacts/MANIFEST.md accordingly. Do not install production from it before it is committed.
          when: dbt_relock | bool

        - name: Check the dbt lock in the repository
          ansible.builtin.stat:
            path: "{{ dbt_lock }}"
          register: _dbtlock

        - name: Assert the dbt lock exists in the repository
          ansible.builtin.assert:
            that:
              - _dbtlock.stat.exists
            fail_msg: >-
              {{ dbt_lock }} does not exist. It is the single authority for dbt dependencies (DD-83) and belongs in
              the repository; missing most likely means an incomplete checkout. If it really must be regenerated:
              -e dbt_relock=true (network needed), then review and commit.
            success_msg: "dbt lock: {{ dbt_lock }}"

        # When the approach changes, the old approach's leftovers do not disappear by themselves (CLAUDE.md
        # section 5, item four): before DD-83 the lock lived in the wheelhouse. Left there, someone will think it is what gets installed.
        - name: Remove the old lock from the wheelhouse
          ansible.builtin.file:
            path: "{{ dbt_lock_legacy }}"
            state: absent

        - name: Fetch dbt wheels (by the lock)
          ansible.builtin.command:
            cmd: >-
              {{ python_bin }} -m pip wheel
              --requirement {{ dbt_lock }}
              --wheel-dir {{ wheelhouse }}/dbt
          register: _dl_dbt
          changed_when: "'Saved' in _dl_dbt.stdout or 'Created wheel' in _dl_dbt.stdout"
          when: _do_fetch | bool

        # Ingestion program dependencies: exactly the same approach as dbt (DD-83 · DD-84).
        # pip freeze leaves out setuptools by default, but building our package offline needs it, hence --all minus pip itself
        - name: Re-resolve ingestion dependencies and write the repository lock (network needed, only with -e ingest_relock=true)
          ansible.builtin.shell:
            cmd: |
              set -e
              d=$(mktemp -d)
              {{ python_bin }} -m venv "$d"
              "$d"/bin/pip install --quiet --upgrade pip
              "$d"/bin/pip install --quiet {{ ingest_requirements | map('quote') | join(' ') }}
              "$d"/bin/pip freeze --all | grep -v '^pip==' > {{ ingest_lock }}
              rm -rf "$d"
          become: false
          when: ingest_relock | bool

        - name: Ask for a review of the new ingestion lock
          ansible.builtin.debug:
            msg: >-
              Re-resolved and wrote {{ ingest_lock }}. It is only a candidate: review it with
              git diff infra/ingest-requirements.lock; any new package must have its licence confirmed first (LD-09 4.2),
              then update MANIFEST and compliance/components.csv and commit.
          when: ingest_relock | bool

        - name: Check the ingestion lock in the repository
          ansible.builtin.stat:
            path: "{{ ingest_lock }}"
          register: _inglock

        - name: Assert the ingestion lock exists in the repository
          ansible.builtin.assert:
            that:
              - _inglock.stat.exists
            fail_msg: >-
              {{ ingest_lock }} does not exist. It is the single authority for the ingestion program's dependencies
              (DD-83 · DD-84) and belongs in the repository. If it really must be regenerated: -e ingest_relock=true
              (network needed), then review and commit.
            success_msg: "Ingestion lock: {{ ingest_lock }}"

        - name: Fetch ingestion wheels (by the lock)
          ansible.builtin.command:
            cmd: >-
              {{ python_bin }} -m pip wheel
              --requirement {{ ingest_lock }}
              --wheel-dir {{ wheelhouse }}/ingest
          register: _dl_ing
          changed_when: "'Saved' in _dl_ing.stdout or 'Created wheel' in _dl_ing.stdout"
          when: _do_fetch | bool

        # Fetching is INCREMENTAL: pip wheel adds to the same directory and never cleans history.
        # So after switching the fetch method, source packages left by the last pip download are still lying there
        # (observed 2026-10-08: dbt_core_experimental_parser-2.0.5.tar.gz).
        # Clean up only when fetching: when installing offline from media not a single file should be deleted --
        # in that case the assert should fail, because the problem is in the media, not on this machine.
        - name: Find source packages left over by fetching
          ansible.builtin.find:
            paths:
              - "{{ wheelhouse }}/airflow"
              - "{{ wheelhouse }}/dbt"
              - "{{ wheelhouse }}/ingest"
            patterns: "*.tar.gz,*.zip"
          register: _sdist_stale
          when: _do_fetch | bool

        - name: Remove source packages left over by fetching
          ansible.builtin.file:
            path: "{{ item }}"
            state: absent
          loop: "{{ _sdist_stale.files | default([]) | map(attribute='path') | list }}"
          loop_control:
            label: "{{ item | basename }}"
          when: _do_fetch | bool

        # Once the source packages are deleted, the corresponding wheels must be present. Package names are not
        # checked one by one here -- the real safety net is the install stage: pip with --no-index fails on the
        # spot instead of quietly going online. That failure is more reliable and easier to read than name matching here.

        # The next one enforces the principle "no build capability inside the wall".
        # Observed 2026-10-08: among the 190 packages fetched by pip download was one source package
        # (dbt_core_experimental_parser-2.0.5.tar.gz) -- upstream publishes no wheel.
        # With pip wheel there should be no source packages any more; this assert keeps it that way.
        - name: Assert the wheelhouse contains no source packages
          ansible.builtin.find:
            paths:
              - "{{ wheelhouse }}/airflow"
              - "{{ wheelhouse }}/dbt"
              - "{{ wheelhouse }}/ingest"
            patterns: "*.tar.gz,*.zip"
          register: _sdist

        - name: Assert the wheelhouse contains no source packages (verdict)
          ansible.builtin.assert:
            that:
              - "(_sdist.matched | int) == 0"
            fail_msg: >-
              The wheelhouse contains {{ _sdist.matched }} source package(s):
              {{ _sdist.files | map(attribute='path') | map('basename') | join(', ') }}.
              Source packages are compiled at install time, which brings a compiler and a build that may fail into the
              production network. Remedy: on a networked machine refetch with -e wheelhouse_refresh=true
              (pip wheel builds them into wheels); packages that fail to build must be looked into upstream.
            success_msg: "The wheelhouse holds wheels only; the install side needs no compiler"

        # Count again here; the _wh result from before the fetch will not do: that number only said "fetch or not",
        # this one says "can we install now". Fetching enabled but nothing fetched (source unreachable, constraints
        # resolution failed), and offline media placed in the wrong location, only show up in this count.
        - name: Count the wheels in the wheelhouse again
          ansible.builtin.find:
            paths:
              - "{{ wheelhouse }}/airflow"
              - "{{ wheelhouse }}/dbt"
              - "{{ wheelhouse }}/ingest"
            patterns: "*.whl"
          register: _wh_final

        - name: Assert the prerequisites for offline installation are met
          ansible.builtin.assert:
            that:
              - "(_wh_final.matched | int) > 0"
            fail_msg: >-
              The wheelhouse ({{ wheelhouse }}) contains no wheels; offline installation is impossible.
              Online: fetch once with -e wheelhouse_refresh=true;
              offline: put the wheelhouse directory from the media together with {{ constraints_file | basename }}
              into that path and run again (the dbt and ingestion locks are in infra/ and ship with the media, not in the wheelhouse).
              This run {{ 'fetched but got no wheels at all -- look at the output of the fetch steps above first' if _do_fetch | bool else 'did not fetch' }}.
            success_msg: "Prerequisites for offline installation met: {{ _wh_final.matched }} wheels in the wheelhouse"

        # ========== Install: no network ==========
        # --no-index is the point of this stage: pip does not ask PyPI at all.
        # If something is missing from the wheelhouse this fails on the spot -- instead of quietly fetching it online
        # and hiding a problem that is certain to appear offline until after delivery.

        - name: Create the Airflow venv
          ansible.builtin.command:
            cmd: "{{ python_bin }} -m venv {{ af_venv }}"
            creates: "{{ af_venv }}/bin/python"

        - name: Install Airflow offline
          ansible.builtin.command:
            cmd: >-
              {{ af_venv }}/bin/pip install
              --no-index --find-links {{ wheelhouse }}/airflow
              --constraint {{ constraints_file }}
              "apache-airflow[{{ airflow_extras }}]=={{ airflow_version }}"
          register: _inst_af
          changed_when: "'Successfully installed' in _inst_af.stdout"

        - name: Create the dbt venv
          ansible.builtin.command:
            cmd: "{{ python_bin }} -m venv {{ dbt_venv }}"
            creates: "{{ dbt_venv }}/bin/python"

        - name: Install dbt offline
          ansible.builtin.command:
            cmd: >-
              {{ dbt_venv }}/bin/pip install
              --no-index --find-links {{ wheelhouse }}/dbt
              --requirement {{ dbt_lock }}
          register: _inst_dbt
          changed_when: "'Successfully installed' in _inst_dbt.stdout"

        # ---------- Ingestion program (DD-84) ----------
        - name: Create the ingestion venv
          ansible.builtin.command:
            cmd: "{{ python_bin }} -m venv {{ ingest_venv }}"
            creates: "{{ ingest_venv }}/bin/python"

        - name: Install the ingestion dependencies offline
          ansible.builtin.command:
            cmd: >-
              {{ ingest_venv }}/bin/pip install
              --no-index --find-links {{ wheelhouse }}/ingest
              --requirement {{ ingest_lock }}
          register: _inst_ingdeps
          changed_when: "'Successfully installed' in _inst_ingdeps.stdout"

        - name: Copy the ingestion source to the build directory
          ansible.builtin.copy:
            src: "{{ ingest_src_repo }}/"
            dest: "{{ ingest_src_dir }}/"
            owner: root
            group: root
            mode: "0644"
            directory_mode: "0755"
          register: _ingsrc

        - name: Query whether the ingestion program is installed
          ansible.builtin.command:
            cmd: "{{ ingest_venv }}/bin/pip show oss911-ingest"
          register: _ingshow
          changed_when: false
          failed_when: false
          check_mode: false

        # pip install of a local directory rebuilds and reinstalls every time, so changed would always be true.
        # Hence install only when the source changed or it is not installed yet. --no-build-isolation: build
        # isolation would fetch setuptools from PyPI, which does not exist offline, so use the copy already
        # installed into the venv from the lock. --no-deps: dependencies are installed by the lock; do not let it resolve again.
        - name: Install the ingestion program offline
          ansible.builtin.command:
            cmd: >-
              {{ ingest_venv }}/bin/pip install
              --no-index --no-build-isolation --no-deps --force-reinstall
              {{ ingest_src_dir }}
          when: _ingsrc.changed or _ingshow.rc != 0

        # Verify once as the identity that really uses it -- not as root.
        # The previous version check ran as root, and root can enter any directory, so "can the airflow user run
        # this binary" was never verified until db migrate reported Permission denied.
        # The same lesson as auth_query: the identity used for verification must not be an exception to the real user's identity.
        - name: Verify the service account can run the three venvs
          ansible.builtin.command:
            cmd: "{{ item }}"
          become_user: airflow
          register: _asuser
          changed_when: false
          failed_when: false
          loop:
            - "{{ af_venv }}/bin/airflow version"
            - "{{ dbt_venv }}/bin/dbt --version"
            - "{{ ingest_venv }}/bin/oss911-ingest --version"

        - name: Assert the service account can run the programs in the three venvs
          ansible.builtin.assert:
            that:
              - "item.rc == 0"
            fail_msg: >-
              The airflow user failed to run "{{ item.item }}": {{ item.stderr | default(item.stdout) | truncate(200) }}.
              The most common cause is that the permissions of {{ venv_root }} do not let that user enter the directory --
              a venv holds no secrets and should be 0755; passwords are protected separately under /etc/oss911.
              Check: namei -l {{ af_venv }}/bin/airflow
            success_msg: "The service account can run: {{ item.item }}"
          loop: "{{ _asuser.results }}"
          loop_control:
            label: "{{ item.item }}"

        # ========== Ingestion runtime configuration (LD-01 2.5) ==========
        # The program reads its configuration itself (oss911_ingest/config.py); nothing passes through the DAG:
        #   ingest.conf  0644  where the database is (non-secret)                       this playbook
        #   ingest.env   0600  database login user and password                         40-schema.yml
        #   icp.env      0600  ICP gateway address and service account                  see below
        # Contract references map to variable names: host_ref X -> OSS911_HOST_<X>, credential_ref Y ->
        # OSS911_CRED_<Y>_USER / _PASSWORD. The names in inventory (icp_env) must follow the released contracts.
        - name: Deploy the ingestion settings file
          ansible.builtin.copy:
            dest: "{{ oss911_etc }}/ingest.conf"
            owner: root
            group: root
            mode: "0644"
            content: |
              # Managed by infra/playbooks/30-python.yml, do not edit by hand
              # Non-secret settings of the ingestion program (LD-01 2.5). Credentials: ingest.env, icp.env
              OSS911_DB_HOST={{ ingest_db_host }}
              OSS911_DB_PORT={{ pgb_listen_port }}
              # pgBouncer's session pool: the per-source advisory lock lives in the session (DD-85)
              OSS911_DB_NAME={{ ingest_db_name }}

        # icp.env holds the ICP service account. In production its password is issued by ICP operations, so the
        # playbook cannot make one up: operations write the file by hand and the playbook only checks it
        # (icp_env.generate false). On the development machine the account belongs to the fake ICP interface
        # (AS-32): the playbook generates a random password once and keeps it; the fake interface is started with the
        # same account (runbook/09). Deleting the file and rerunning gives a new password (= a rotation).
        - name: Read back the existing ICP env file
          ansible.builtin.slurp:
            src: "{{ oss911_etc }}/icp.env"
          register: _icpenv
          failed_when: false
          no_log: true

        # Only the names of missing variables come out of this step, never a value
        - name: Find which ICP settings are missing or empty
          ansible.builtin.set_fact:
            _icp_missing: >-
              {{ [icp_env.host_var, icp_env.cred_prefix ~ '_USER', icp_env.cred_prefix ~ '_PASSWORD']
                 | reject('in', (_icpenv.content | default('') | b64decode)
                                | regex_findall('(?m)^([A-Z0-9_]+)=\S')) | list }}
          no_log: true

        - name: Assert the ICP env file is complete (written by operations in production)
          ansible.builtin.assert:
            that:
              - _icpenv.content is defined
              - _icp_missing | length == 0
            fail_msg: >-
              {{ oss911_etc }}/icp.env {{ 'does not exist' if _icpenv.content is not defined else 'lacks: ' ~ (_icp_missing | join(', ')) }}.
              In production it is written by operations with the service account issued by ICP operations (LD-01 4.7),
              owner airflow, mode 0600, lines {{ icp_env.host_var }}=..., {{ icp_env.cred_prefix }}_USER=..., {{ icp_env.cred_prefix }}_PASSWORD=...
            success_msg: "{{ oss911_etc }}/icp.env is complete"
          when: not (icp_env.generate | bool)

        - name: Keep or generate the fake ICP service account (development only)
          ansible.builtin.set_fact:
            _icp_user: >-
              {{ ((_icpenv.content | b64decode) | regex_search('(?m)^' ~ icp_env.cred_prefix ~ '_USER=(.+)$', '\1') | first)
                 if _icpenv.content is defined and (icp_env.cred_prefix ~ '_USER') not in _icp_missing
                 else icp_env.dev_user }}
            _icp_pw: >-
              {{ ((_icpenv.content | b64decode) | regex_search('(?m)^' ~ icp_env.cred_prefix ~ '_PASSWORD=(.+)$', '\1') | first)
                 if _icpenv.content is defined and (icp_env.cred_prefix ~ '_PASSWORD') not in _icp_missing
                 else lookup('ansible.builtin.password', '/dev/null', length=24, chars=['ascii_letters', 'digits']) }}
          when: icp_env.generate | bool
          no_log: true

        - name: Write the ICP env file (development only)
          ansible.builtin.copy:
            dest: "{{ oss911_etc }}/icp.env"
            owner: airflow
            group: airflow
            mode: "0600"
            content: |
              # Managed by infra/playbooks/30-python.yml on the development machine, do not edit by hand.
              # The account belongs to the fake ICP interface (AS-32); production writes this file by hand.
              {{ icp_env.host_var }}={{ icp_env.host_value }}
              {{ icp_env.cred_prefix }}_USER={{ _icp_user }}
              {{ icp_env.cred_prefix }}_PASSWORD={{ _icp_pw }}
          when: icp_env.generate | bool
          no_log: true

        # ========== Metadata database ==========
        - name: Query whether the Airflow database user exists
          ansible.builtin.command:
            cmd: psql -tAc "SELECT 1 FROM pg_roles WHERE rolname = '{{ airflow_db }}'"
          become_user: postgres
          register: _afrole
          changed_when: false
          check_mode: false

        # The only place the database password is stored is airflow.env (inside the connection string). The four
        # states are the same as in 40-schema's db_login; rotation means deleting airflow.env and rerunning this
        # playbook (runbook/91). Everything else in that file is generated from the template; deleting it loses nothing.
        - name: Read back the existing Airflow env file
          ansible.builtin.slurp:
            src: "{{ oss911_etc }}/airflow.env"
          register: _afenv
          failed_when: false
          no_log: true

        - name: Get the Airflow database password back
          ansible.builtin.set_fact:
            _af_db_password: "{{ (_afenv.content | b64decode) | regex_search('SQL_ALCHEMY_CONN=postgresql\\+psycopg2://[^:]+:([^@]+)@', '\\1') | first }}"
          when: _afenv.content is defined
          no_log: true

        - name: Generate the Airflow database password (when the env file does not exist)
          ansible.builtin.set_fact:
            _af_db_password: "{{ lookup('ansible.builtin.password', '/dev/null', length=32, chars=['ascii_letters','digits']) }}"
          when: _afenv.content is not defined
          no_log: true

        # Airflow's two keys are shared configuration, not node state (DD-85 note · LD-08 3.3):
        #   jwt_secret  -- the scheduler signs task tokens, the API server checks them
        #   fernet_key  -- encrypts connection passwords and variables in the metadata database
        # Left alone, Airflow generates both at first start into the node's own airflow.cfg: with two ETL nodes each
        # has its own, tasks reporting to the other node are refused and passwords cannot be decrypted there --
        # intermittently, and never on a single development machine. So they are managed like the other secrets:
        # kept in airflow.env (0600, the same file on every node), and existing keys are adopted before anything is
        # generated -- the env file first, then airflow.cfg (a new fernet_key would make existing ciphertext unreadable).
        # Environment variables take precedence over airflow.cfg, so the values left there no longer matter.
        # Rotation: runbook/91 (the fernet_key has a multi-key re-encryption procedure).
        - name: Read back Airflow's own configuration file (for keys it generated itself)
          ansible.builtin.slurp:
            src: "{{ airflow_home }}/airflow.cfg"
          register: _afcfg
          failed_when: false
          no_log: true

        - name: Adopt the existing Airflow keys
          ansible.builtin.set_fact:
            _af_jwt_secret: >-
              {{ ((_afenv.content | b64decode) | regex_search('(?m)^AIRFLOW__API_AUTH__JWT_SECRET=(.+)$', '\1') | default([''], true) | first)
                 if _afenv.content is defined else '' }}
            _af_fernet_key: >-
              {{ ((_afenv.content | b64decode) | regex_search('(?m)^AIRFLOW__CORE__FERNET_KEY=(.+)$', '\1') | default([''], true) | first)
                 if _afenv.content is defined else '' }}
            _af_cfg_text: "{{ (_afcfg.content | b64decode) if _afcfg.content is defined else '' }}"
          no_log: true

        - name: Take the keys from airflow.cfg where the env file has none
          ansible.builtin.set_fact:
            _af_jwt_secret: >-
              {{ _af_jwt_secret or (_af_cfg_text | regex_search('(?m)^jwt_secret = (\S+)\s*$', '\1') | default([''], true) | first) }}
            _af_fernet_key: >-
              {{ _af_fernet_key or (_af_cfg_text | regex_search('(?m)^fernet_key = (\S+)\s*$', '\1') | default([''], true) | first) }}
          no_log: true

        - name: Generate the JWT secret (only when neither file has one)
          ansible.builtin.set_fact:
            _af_jwt_secret: "{{ lookup('ansible.builtin.password', '/dev/null', length=64, chars=['ascii_letters', 'digits']) }}"
          when: not _af_jwt_secret
          no_log: true

        # A Fernet key has a fixed format (url-safe base64 of 32 bytes); let the library Airflow uses make it
        - name: Generate the Fernet key (only when neither file has one)
          ansible.builtin.command:
            cmd: "{{ af_venv }}/bin/python -c 'from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())'"
          register: _af_fernet_new
          when: not _af_fernet_key
          changed_when: false
          no_log: true

        - name: Use the generated Fernet key
          ansible.builtin.set_fact:
            _af_fernet_key: "{{ _af_fernet_new.stdout | trim }}"
          when: _af_fernet_new is not skipped
          no_log: true

        # The keys above are only what each node would have on its own. The AUTHORITY is one file on the control node
        # (DD-85 note, Mac review round 8): if it exists, every node takes the keys from it; if not, it is created once,
        # from the first node's keys (adopted, so existing ciphertext stays readable) -- never per node. Adopting node
        # by node would leave two ETL nodes with two keys. The file is outside the repository, root 0600.
        - name: Create the control node's secrets directory
          ansible.builtin.file:
            path: "{{ control_secrets_dir }}"
            state: directory
            owner: root
            group: root
            mode: "0700"
          delegate_to: localhost
          run_once: true

        - name: Read the authoritative Airflow keys (control node)
          ansible.builtin.slurp:
            src: "{{ control_secrets_dir }}/airflow_keys.env"
          delegate_to: localhost
          run_once: true
          register: _af_keys_ctl
          failed_when: false
          no_log: true

        - name: Create the authoritative Airflow keys from the first node (only when the control node has none)
          ansible.builtin.copy:
            dest: "{{ control_secrets_dir }}/airflow_keys.env"
            owner: root
            group: root
            mode: "0600"
            content: |
              # The one authoritative copy of Airflow's shared keys (DD-85 note). Distributed by 30-python.yml to every
              # node's /etc/oss911/airflow.env; never edited on a node. Rotation: runbook/91, section four -- edit here.
              AIRFLOW__API_AUTH__JWT_SECRET={{ hostvars[ansible_play_hosts_all[0]]._af_jwt_secret }}
              AIRFLOW__CORE__FERNET_KEY={{ hostvars[ansible_play_hosts_all[0]]._af_fernet_key }}
          delegate_to: localhost
          run_once: true
          when: _af_keys_ctl.content is not defined
          no_log: true

        - name: Read the authoritative Airflow keys again (control node)
          ansible.builtin.slurp:
            src: "{{ control_secrets_dir }}/airflow_keys.env"
          delegate_to: localhost
          run_once: true
          register: _af_keys_ctl
          no_log: true

        # run_once with set_fact applies the facts to every host of the play: all nodes get the same two values
        - name: Take the keys from the authoritative copy, on every node
          ansible.builtin.set_fact:
            _af_jwt_secret: "{{ (_af_keys_ctl.content | b64decode) | regex_search('(?m)^AIRFLOW__API_AUTH__JWT_SECRET=(\\S+)$', '\\1') | first }}"
            _af_fernet_key: "{{ (_af_keys_ctl.content | b64decode) | regex_search('(?m)^AIRFLOW__CORE__FERNET_KEY=(\\S+)$', '\\1') | first }}"
            _af_keys_sha: "{{ (_af_keys_ctl.content | b64decode) | regex_findall('(?m)^AIRFLOW__(?:API_AUTH__JWT_SECRET|CORE__FERNET_KEY)=\\S+$') | join('\n') | hash('sha256') }}"
          run_once: true
          no_log: true

        - name: Create the Airflow database user, or set a new password for it
          ansible.builtin.include_tasks: "{{ playbook_dir }}/tasks/role_password.yml"
          vars:
            rp_role: "{{ airflow_db }}"
            rp_password: "{{ _af_db_password }}"
            rp_create: "{{ _afrole.stdout | trim != '1' }}"
          when: _afrole.stdout | trim != '1' or _afenv.content is not defined

        - name: Create the Airflow database
          ansible.builtin.command:
            cmd: createdb --owner={{ airflow_db }} --template=template0 --locale=C --encoding=UTF8 {{ airflow_db }}
          become_user: postgres
          when: _afrole.stdout | trim != '1'

        # Only its owner (airflow) connects; not every login of the cluster (tasks/db_connect.yml)
        - name: Restrict CONNECT on {{ airflow_db }}
          ansible.builtin.include_tasks: "{{ playbook_dir }}/tasks/db_connect.yml"
          vars:
            dbc_database: "{{ airflow_db }}"
            dbc_grantees: []

        - name: Deploy the Airflow env file
          ansible.builtin.template:
            src: ../files/airflow.env.j2
            dest: "{{ oss911_etc }}/airflow.env"
            owner: airflow
            group: airflow
            mode: "0600"
          register: _afenv_w
          no_log: true

        # Before Airflow starts: every node's env file must carry exactly the control node's two keys. Compared as a
        # hash, so nothing secret reaches the output. (On one machine this cannot fail; it is the two-node check.)
        - name: Read back the two keys from the node's env file
          ansible.builtin.slurp:
            src: "{{ oss911_etc }}/airflow.env"
          register: _afenv_back
          no_log: true

        - name: Assert the node's Airflow keys equal the authoritative copy
          ansible.builtin.assert:
            that:
              - >-
                ((_afenv_back.content | b64decode)
                 | regex_findall('(?m)^AIRFLOW__(?:API_AUTH__JWT_SECRET|CORE__FERNET_KEY)=\\S+$') | join('\n') | hash('sha256'))
                == _af_keys_sha
            fail_msg: >-
              {{ oss911_etc }}/airflow.env on {{ inventory_hostname }} does not carry the authoritative Airflow keys
              ({{ control_secrets_dir }}/airflow_keys.env on the control node). Airflow is not (re)started with them.
            success_msg: "Airflow keys on {{ inventory_hostname }} equal the authoritative copy"

        # The password goes neither on the command line nor into Ansible's environment -- it is read on the spot
        # from the 0600 env file. Then no_log is not needed and a failure shows the real error; the output also
        # masks the connection string.
        #
        # * The previous version had no_log: true here, which hid the failure reason as well.
        #   no_log is for "what must not appear in the log", not for "what you must be able to read when it fails";
        #   on the former it is right, on the latter it shuts the troubleshooting channel.
        - name: Initialise the metadata database
          ansible.builtin.shell:
            cmd: |
              set -a; . {{ oss911_etc }}/airflow.env; set +a
              {{ af_venv }}/bin/airflow db migrate 2>&1 |
                sed -E 's#(postgresql[^ ]*://[^:]+:)[^@]+@#\1***@#g'
          args:
            executable: /bin/bash
          become_user: airflow
          register: _afmigrate
          changed_when: "'Running upgrade' in _afmigrate.stdout"
          failed_when: false

        - name: Assert the metadata database was initialised
          ansible.builtin.assert:
            that:
              - "_afmigrate.stdout is not search('(?i)error|traceback|fatal')"
            fail_msg: |-
              airflow db migrate failed (password masked):

              {{ _afmigrate.stdout | default('(no output)') }}

              Check in this order:
                1. Does pgBouncer have the {{ airflow_db }} pool:
                    sudo grep '^{{ airflow_db }}' /etc/pgbouncer/pgbouncer.ini
                2. Can that user connect through the pool:
                    sudo -u postgres psql -h 127.0.0.1 -p {{ pgb_listen_port }} -U {{ airflow_db }} -d {{ airflow_db }} -c 'select 1'
                3. Does the venv have a PostgreSQL driver:
                    {{ af_venv }}/bin/python -c 'import psycopg2; print(psycopg2.__version__)'
            success_msg: "Metadata database initialised"

        # ========== dbt profiles ==========
        - name: Deploy the dbt profiles
          ansible.builtin.template:
            src: ../files/dbt_profiles.yml.j2
            dest: "{{ airflow_home }}/profiles.yml"
            owner: airflow
            group: airflow
            mode: "0640"

        # ========== systemd ==========
        - name: Deploy the Airflow systemd units
          ansible.builtin.template:
            src: "../files/systemd/airflow-{{ item }}.service.j2"
            dest: "/etc/systemd/system/airflow-{{ item }}.service"
            owner: root
            group: root
            mode: "0644"
          loop: [api-server, scheduler, dag-processor, triggerer]
          register: _afunits

        - name: Reload systemd
          ansible.builtin.systemd_service:
            daemon_reload: true
          when: _afunits.changed

        - name: Enable and start the four Airflow components
          ansible.builtin.systemd_service:
            name: "airflow-{{ item }}.service"
            enabled: true
            # A changed env file (e.g. a rotated database password) also needs a restart, or the four components keep the old password
            state: "{{ 'restarted' if (_afunits.changed or _afenv_w.changed) else 'started' }}"
          loop: [api-server, scheduler, dag-processor, triggerer]

        # ========== Verification: check behaviour ==========
        # "Installed" is too easy to satisfy. These checks verify, in turn: that the versions are the pinned ones,
        # that the venvs really are separate, and that each can reach the database it needs.
        # dbt versions are compared package by package against the lock.
        # * The previous version took `dbt --version | head -1`, and that line is "Core:", while the assert only checked
        #   that the output contained "dbt=" -- which echo prints by itself, so a wrong dbt version or no dbt at all
        #   passed anyway. An assert that always passes is worse than none: it makes people think it was verified
        #   (found 2026-10-13).
        - name: Query the versions in the three venvs
          ansible.builtin.shell:
            cmd: |
              lock_core=$(sed -n 's/^dbt-core==//p' {{ dbt_lock }})
              lock_pg=$(sed -n 's/^dbt-postgres==//p' {{ dbt_lock }})
              have_core=$({{ dbt_venv }}/bin/python -c 'import importlib.metadata as m; print(m.version("dbt-core"))' 2>/dev/null)
              have_pg=$({{ dbt_venv }}/bin/python -c 'import importlib.metadata as m; print(m.version("dbt-postgres"))' 2>/dev/null)
              echo "airflow=$({{ af_venv }}/bin/airflow version 2>/dev/null)"
              echo "dbt-core=${have_core:-not installed} (lock ${lock_core:-missing})"
              echo "dbt-postgres=${have_pg:-not installed} (lock ${lock_pg:-missing})"
              [ -n "$lock_core" ] && [ "$have_core" = "$lock_core" ] &&
                [ -n "$lock_pg" ] && [ "$have_pg" = "$lock_pg" ] && echo "dbt-match"
              # Ingestion program: every package in the lock matches what is installed in the venv, line by line (not just one or two main packages)
              if diff <(grep -vE '^\s*(#|$)' {{ ingest_lock }} | sort) \
                      <({{ ingest_venv }}/bin/pip freeze --all 2>/dev/null | grep -vE '^(pip|oss911-ingest)( |==|@)' | sort) >/dev/null; then
                echo "ingest-deps=matches the lock ($(grep -cvE '^\s*(#|$)' {{ ingest_lock }}) packages)"
                echo "ingest-match"
              else
                echo "ingest-deps=does not match the lock"
              fi
              true
          args:
            executable: /bin/bash          # diff <(...) is bash process substitution; /bin/sh does not know it
          register: _vers
          changed_when: false

        - name: Assert each of the three venvs is installed correctly
          ansible.builtin.assert:
            that:
              - "_vers.stdout is search('airflow=' ~ airflow_version)"
              - "'dbt-match' in _vers.stdout_lines"
              - "'ingest-match' in _vers.stdout_lines"
            fail_msg: |-
              Versions differ from the pinned ones, or a command does not exist:
              {{ _vers.stdout }}
              airflow should be {{ airflow_version }}; dbt-core and dbt-postgres should match {{ dbt_lock }};
              the ingestion dependencies should match {{ ingest_lock }} line by line.
            success_msg: "{{ _vers.stdout_lines | reject('in', ['dbt-match', 'ingest-match']) | join(' | ') }}"

        # The venvs must not see each other. When they are mixed, the most common symptom is not an error but
        # a silent downgrade on one side that only shows at run time.
        - name: Assert the three venvs really are separate
          ansible.builtin.shell:
            cmd: |
              test ! -x {{ af_venv }}/bin/dbt && test ! -x {{ dbt_venv }}/bin/airflow &&
                test ! -x {{ ingest_venv }}/bin/airflow && test ! -x {{ ingest_venv }}/bin/dbt &&
                test ! -x {{ af_venv }}/bin/oss911-ingest && test ! -x {{ dbt_venv }}/bin/oss911-ingest &&
                echo separated
          register: _sep
          changed_when: false
          failed_when: "'separated' not in _sep.stdout"

        - name: Airflow can reach the metadata database
          ansible.builtin.shell:
            cmd: |
              set -a; . {{ oss911_etc }}/airflow.env; set +a
              {{ af_venv }}/bin/airflow db check 2>&1 |
                sed -E 's#(postgresql[^ ]*://[^:]+:)[^@]+@#\1***@#g'
          args:
            executable: /bin/bash
          become_user: airflow
          register: _afcheck
          changed_when: false
          failed_when: false

        - name: Assert the Airflow metadata database is reachable
          ansible.builtin.assert:
            that: ["_afcheck.rc == 0"]
            fail_msg: |-
              airflow db check failed (password masked):

              {{ _afcheck.stdout | default('(no output)') }}

              The metadata database is reached through pgBouncer's {{ airflow_db }} database (session pool);
              first make sure pgbouncer.ini has that entry and auth_query works (21-connection asserts both).
            success_msg: "Airflow metadata database reachable (through the pgBouncer session pool)"

        # Tasks report to this URL while they run. Check it answers as Airflow's execution API, not merely that
        # something answers: with the default URL the reports went to Keycloak on 8080, which also answers -- with
        # an error that killed every task at its first report (troubleshooting entry 31). The components were
        # possibly just restarted, so allow the API server some time to come up.
        - name: Check the task execution API answers at the configured URL
          ansible.builtin.uri:
            url: "http://127.0.0.1:{{ airflow_api_port }}/execution/health"
            return_content: true
          register: _exec_api
          until: _exec_api.status == 200 and (_exec_api.json | default({})).status | default('') == 'healthy'
          retries: 12
          delay: 5
          check_mode: false

        # ========== Global pools (DD-85 · LD-08 3.3) ==========
        # Output one "name|slots|description" per line and compare before setting: pools set writes every time,
        # so setting unconditionally would always report changed
        - name: Query the existing Airflow pools
          ansible.builtin.shell:
            cmd: |
              set -a; . {{ oss911_etc }}/airflow.env; set +a
              out=$({{ af_venv }}/bin/airflow pools list -o json 2>&1)
              printf '%s\n' "$out" | {{ python_bin }} -c {{ lookup('ansible.builtin.file', playbook_dir ~ '/../files/airflow_pools_list.py') | quote }} \
                || { printf '%s\n' "$out" >&2; exit 1; }
          args:
            executable: /bin/bash
          become_user: airflow
          register: _pools_have
          changed_when: false
          check_mode: false

        - name: Create or correct the pools
          ansible.builtin.shell:
            cmd: |
              set -a; . {{ oss911_etc }}/airflow.env; set +a
              {{ af_venv }}/bin/airflow pools set {{ item.name | quote }} {{ item.slots }} {{ item.description | quote }}
          args:
            executable: /bin/bash
          become_user: airflow
          loop: "{{ airflow_pools }}"
          loop_control:
            label: "{{ item.name }} = {{ item.slots }}"
          when: (item.name ~ '|' ~ item.slots ~ '|' ~ item.description) not in _pools_have.stdout_lines

        - name: Query the pools again
          ansible.builtin.shell:
            cmd: |
              set -a; . {{ oss911_etc }}/airflow.env; set +a
              out=$({{ af_venv }}/bin/airflow pools list -o json 2>&1)
              printf '%s\n' "$out" | {{ python_bin }} -c {{ lookup('ansible.builtin.file', playbook_dir ~ '/../files/airflow_pools_list.py') | quote }} \
                || { printf '%s\n' "$out" >&2; exit 1; }
          args:
            executable: /bin/bash
          become_user: airflow
          register: _pools_after
          changed_when: false
          check_mode: false

        - name: Assert the pools match inventory
          ansible.builtin.assert:
            that:
              - (item.name ~ '|' ~ item.slots ~ '|' ~ item.description) in _pools_after.stdout_lines
            fail_msg: |-
              Pool {{ item.name }} does not match inventory. Expected: {{ item.name }}|{{ item.slots }}|{{ item.description }}
              Present:
              {{ _pools_after.stdout }}
            success_msg: "Pool {{ item.name }}: {{ item.slots }} slot(s)"
          loop: "{{ airflow_pools }}"
          loop_control:
            label: "{{ item.name }}"
