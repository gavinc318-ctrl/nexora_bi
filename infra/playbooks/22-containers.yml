# 22-containers -- containerised components: Keycloak, SeaweedFS, Prometheus
#
# Three supporting components, all managed as Quadlet (systemd units) -- not podman run, and not the
# deprecated podman generate systemd. Start at boot, dependency order and restart policy are left to
# systemd, so an offline rebuild has one less home-made script to maintain.
#
# * Images are pinned by digest, not by tag. Tags get re-published, digests do not.
#   On the first run the digests in inventory are empty; the playbook pulls by tag and prints the resolved
#   digests -- fill them back into inventory and artifacts/MANIFEST.md on the spot. From then on every run
#   pulls by digest, and a swapped image shows up immediately.
#   After changing a digest in inventory, rerun this playbook and expect a change (troubleshooting entry 28).
#
# * Verification always checks behaviour: Keycloak -- whether its database really has tables (proving it
#   is not the embedded H2); SeaweedFS -- a write/read round trip; Prometheus -- its own "up" metric.
#   "The container is running" is too easy to satisfy and proves nothing.

- name: Containerised components
  hosts: all
  # This playbook uses no facts (checked one by one on 2026-10-13: no ansible_* references in the
  # playbook, tasks/ or templates, and no fact-dependent package / service modules). Gathering facts
  # as root scans LVM and every block device, which on this machine sometimes takes minutes -- so we
  # do not gather what we do not need. To use a fact, delete this line and say here which fact is used.
  gather_facts: false
  become: true

  vars:
    quadlet_dir: /etc/containers/systemd
    oss911_etc: /etc/oss911

  tasks:

    - name: Create the configuration directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: root
        group: root
        mode: "0755"
      loop:
        - "{{ quadlet_dir }}"
        - "{{ oss911_etc }}"

    - name: Container component configuration
      when: not ansible_check_mode
      block:

        # ---------- Images: pinned by digest ----------
        - name: Pull the images
          ansible.builtin.command:
            cmd: >-
              podman pull
              {{ container_images[item].ref.split(':')[0] ~ '@' ~ container_images[item].digest
                 if container_images[item].digest | length > 0
                 else container_images[item].ref }}
          register: _pull
          changed_when: "'Writing manifest' in _pull.stdout or 'Copying blob' in _pull.stdout"
          loop: "{{ container_images.keys() | list }}"

        - name: Resolve the digest of every image
          ansible.builtin.command:
            cmd: >-
              podman image inspect
              {{ container_images[item].ref.split(':')[0] ~ '@' ~ container_images[item].digest
                 if container_images[item].digest | length > 0
                 else container_images[item].ref }}
              --format '{{ '{{' }} .Digest {{ '}}' }}'
          register: _digests
          changed_when: false
          loop: "{{ container_images.keys() | list }}"

        - name: Report images not yet pinned
          ansible.builtin.debug:
            msg: >-
              The following images are not pinned by digest yet; fill the resolved values into
              container_images in inventory/dev.yml and into artifacts/MANIFEST.md:
              {% for r in _digests.results %}
              {{ r.item }} = {{ r.stdout | trim }}{% endfor %}
          when: container_images.values() | map(attribute='digest') | select('equalto','') | list | length > 0

        - name: Record the image references used in this run
          ansible.builtin.set_fact:
            _kc_image: "{{ 'quay.io/keycloak/keycloak@' ~ container_images.keycloak.digest if container_images.keycloak.digest | length > 0 else container_images.keycloak.ref }}"
            _sw_image: "{{ 'docker.io/chrislusf/seaweedfs@' ~ container_images.seaweedfs.digest if container_images.seaweedfs.digest | length > 0 else container_images.seaweedfs.ref }}"
            _pr_image: "{{ 'docker.io/prom/prometheus@' ~ container_images.prometheus.digest if container_images.prometheus.digest | length > 0 else container_images.prometheus.ref }}"

        # ---------- Keycloak database and account ----------
        - name: Query whether the Keycloak database user exists
          ansible.builtin.command:
            cmd: psql -tAc "SELECT 1 FROM pg_roles WHERE rolname = 'keycloak'"
          become_user: postgres
          register: _kcrole
          changed_when: false
          check_mode: false

        # The only place the database user's password is stored is keycloak.env. The four states are the
        # same as in 40-schema's db_login; rotation means deleting keycloak.env and rerunning this playbook (runbook/91).
        #
        # The bootstrap admin (KC_BOOTSTRAP_ADMIN_*, and the old names KEYCLOAK_ADMIN*) is TEMPORARY in
        # Keycloak 26: it only takes effect on first start, while the master realm has no admin yet. Hence:
        #   first install (database user does not exist yet) -> generate a bootstrap admin password and write it
        #   afterwards -> keep the lines if the env file still has them, never write them back if it does not
        # Once a permanent admin exists and the bootstrap admin is deleted, remove those lines from the env file;
        # the playbook will not add them back (runbook/91, "replace the bootstrap admin").
        # Before rotating the database password, replace the bootstrap admin first -- otherwise deleting the env
        # file loses the bootstrap admin password along with it.
        - name: Read back the existing Keycloak env file
          ansible.builtin.slurp:
            src: "{{ oss911_etc }}/keycloak.env"
          register: _kcenv
          failed_when: false
          no_log: true

        - name: Get the database and bootstrap admin passwords (keep the ones in the env file, or generate)
          ansible.builtin.set_fact:
            _kcenv_text: "{{ (_kcenv.content | b64decode) if _kcenv.content is defined else '' }}"
          no_log: true

        - name: Settle the Keycloak passwords
          ansible.builtin.set_fact:
            _kc_db_password: >-
              {{ (_kcenv_text | regex_search('(?m)^KC_DB_PASSWORD=(.+)$', '\1') | first)
                 if _kcenv_text is search('(?m)^KC_DB_PASSWORD=')
                 else lookup('ansible.builtin.password', '/dev/null', length=32, chars=['ascii_letters', 'digits']) }}
            _kc_db_password_is_new: "{{ _kcenv_text is not search('(?m)^KC_DB_PASSWORD=') }}"
            _kc_admin_password: >-
              {{ (_kcenv_text | regex_search('(?m)^KC_BOOTSTRAP_ADMIN_PASSWORD=(.+)$', '\1') | first)
                 if _kcenv_text is search('(?m)^KC_BOOTSTRAP_ADMIN_PASSWORD=')
                 else (lookup('ansible.builtin.password', '/dev/null', length=24, chars=['ascii_letters', 'digits'])
                       if _kcrole.stdout | trim != '1' else '') }}
          no_log: true

        - name: Create the Keycloak database user, or set a new password for it
          ansible.builtin.include_tasks: "{{ playbook_dir }}/tasks/role_password.yml"
          vars:
            rp_role: keycloak
            rp_password: "{{ _kc_db_password }}"
            rp_create: "{{ _kcrole.stdout | trim != '1' }}"
          when: _kcrole.stdout | trim != '1' or (_kc_db_password_is_new | bool)

        # The database must exist before 21-connection's pool can point at it. pgBouncer does not check
        # whether a database exists and only fails at connect time -- so the order "create here, configure
        # the pool there" only shows up during verification.
        - name: Create the Keycloak database
          ansible.builtin.command:
            cmd: createdb --owner=keycloak --template=template0 --locale=C --encoding=UTF8 {{ keycloak_db }}
          become_user: postgres
          when: _kcrole.stdout | trim != '1'

        # Only its owner (keycloak) connects; not every login of the cluster (tasks/db_connect.yml)
        - name: Restrict CONNECT on {{ keycloak_db }}
          ansible.builtin.include_tasks: "{{ playbook_dir }}/tasks/db_connect.yml"
          vars:
            dbc_database: "{{ keycloak_db }}"
            dbc_grantees: []

        - name: Deploy the Keycloak env file
          ansible.builtin.copy:
            dest: "{{ oss911_etc }}/keycloak.env"
            owner: root
            group: root
            mode: "0600"
            content: |
              KC_DB_PASSWORD={{ _kc_db_password }}
              KC_DB_USERNAME=keycloak
              {% if _kc_admin_password %}
              KC_BOOTSTRAP_ADMIN_USERNAME=admin
              KC_BOOTSTRAP_ADMIN_PASSWORD={{ _kc_admin_password }}
              KEYCLOAK_ADMIN=admin
              KEYCLOAK_ADMIN_PASSWORD={{ _kc_admin_password }}
              {% endif %}
          register: _kcenv_w
          no_log: true

        # ---------- Prometheus configuration ----------
        - name: Deploy the Prometheus configuration
          ansible.builtin.template:
            src: ../files/prometheus.yml.j2
            dest: "{{ oss911_etc }}/prometheus.yml"
            owner: root
            group: root
            mode: "0644"
          register: _promcfg

        # ---------- Quadlet units ----------
        - name: Deploy the Quadlet units
          ansible.builtin.template:
            src: "../files/quadlet/{{ item }}.container.j2"
            dest: "{{ quadlet_dir }}/{{ item }}.container"
            owner: root
            group: root
            mode: "0644"
          loop: [keycloak, seaweedfs, prometheus]
          register: _quadlets

        - name: Reload systemd
          ansible.builtin.systemd_service:
            daemon_reload: true
          when: _quadlets.changed

        - name: Start the three components
          ansible.builtin.systemd_service:
            name: "{{ item }}.service"
            # A changed env file (e.g. a rotated database password) restarts Keycloak only
            state: >-
              {{ 'restarted' if (_quadlets.changed or _promcfg.changed
                                 or (item == 'keycloak' and _kcenv_w.changed)) else 'started' }}
          loop: [keycloak, seaweedfs, prometheus]

        # ---------- Verification: check behaviour, not "is running" ----------
        - name: Wait for Keycloak to be ready
          ansible.builtin.uri:
            url: "http://127.0.0.1:{{ keycloak_mgmt_port }}/health/ready"
            status_code: 200
          register: _kchealth
          retries: 30
          delay: 5
          until: _kchealth.status | default(0) == 200
          failed_when: false

        # When the assert fails, bring the real evidence along instead of making someone go and look again --
        # the same lesson as with HAProxy.
        - name: Collect container status and logs when not ready
          ansible.builtin.shell:
            cmd: |
              echo "--- podman ps -a ---"
              podman ps -a --format '{% raw %}{{.Names}}\t{{.Status}}\t{{.Image}}{% endraw %}' | grep -i keycloak || true
              echo "--- is pgBouncer listening on the gateway address ---"
              ss -lntp 2>/dev/null | grep -E ':{{ pgb_listen_port }}' || echo "nothing listening on {{ pgb_listen_port }}"
              echo "--- does pgBouncer have a keycloak pool ---"
              grep -c '^{{ keycloak_db }}' /etc/pgbouncer/pgbouncer.ini 2>/dev/null || true
              echo "--- journalctl -u keycloak (last 40 lines) ---"
              journalctl -u keycloak -n 40 --no-pager 2>&1 | tail -40 || true
          register: _kcdiag
          changed_when: false
          when: _kchealth.status | default(0) != 200

        - name: Assert Keycloak is ready
          ansible.builtin.assert:
            that: ["_kchealth.status | default(0) == 200"]
            fail_msg: >-
              {{ _kcdiag.stdout | default('') }}
              ----------------------------------------
              Keycloak's /health/ready did not return 200 (got {{ _kchealth.status | default('no response') }};
              -1 means no connection was established at all, i.e. nothing listens on the port, and the container
              most likely did not start or is crash-looping).
              The most common cause is that it cannot reach the database -- once KC_DB=postgres is set, failing to
              connect means failing to start, with no fallback to the embedded H2. It connects to the host's
              pgBouncer session pool {{ podman_internal_gateway }}:{{ pgb_listen_port }}, not to PostgreSQL itself.
              If pgbouncer.ini has no {{ keycloak_db }} pool, rerun 21-connection first.
              "Connection refused" in the log means the packet arrived but nobody listens; a timeout points to network isolation.
            success_msg: "Keycloak is ready"

        # "Up" does not mean "using PostgreSQL" -- the embedded H2 starts just as well, and H2 data disappears
        # when the container is recreated. So check whether its database really has tables.
        - name: Count the tables Keycloak created in its database
          ansible.builtin.command:
            cmd: psql -d {{ keycloak_db }} -tAc "SELECT count(*) FROM information_schema.tables WHERE table_schema = 'public'"
          become_user: postgres
          register: _kctables
          changed_when: false

        - name: Assert Keycloak really uses PostgreSQL
          ansible.builtin.assert:
            that: ["_kctables.stdout | trim | int > 20"]
            fail_msg: >-
              The {{ keycloak_db }} database has only {{ _kctables.stdout | trim }} tables;
              Keycloak has most likely fallen back to the embedded H2. H2 passes the health check just as well,
              but its data disappears when the container is recreated -- such "looks fine" setups must be caught here.
              Check that KC_DB_PASSWORD in keycloak.env matches the database user.
            success_msg: "Keycloak uses PostgreSQL: {{ _kctables.stdout | trim }} tables in the {{ keycloak_db }} database"

        - name: Write an object to SeaweedFS
          ansible.builtin.uri:
            url: "http://127.0.0.1:{{ seaweedfs_filer_port }}/oss911-selftest/probe.txt"
            method: PUT
            body: "oss911-roundtrip"
            status_code: [200, 201, 204]
          register: _swput
          retries: 20
          delay: 3
          until: _swput.status | default(0) in [200, 201, 204]
          failed_when: false

        - name: Read the object back from SeaweedFS
          ansible.builtin.uri:
            url: "http://127.0.0.1:{{ seaweedfs_filer_port }}/oss911-selftest/probe.txt"
            return_content: true
          register: _swget
          failed_when: false

        - name: Assert the SeaweedFS write and read-back match
          ansible.builtin.assert:
            that: ["(_swget.content | default('')) is search('oss911-roundtrip')"]
            fail_msg: >-
              SeaweedFS round trip failed. The write returned {{ _swput.status | default('no response') }},
              the read-back content is "{{ _swget.content | default('') | truncate(60) }}".
              Check journalctl -u seaweedfs -n 80, and that the {{ seaweedfs_dir }} mount exists and is writable.
            success_msg: "SeaweedFS round trip OK: content read back matches what was written"

        - name: Query Prometheus's up metric
          ansible.builtin.uri:
            url: "http://127.0.0.1:{{ prometheus_port }}/api/v1/query?query=up%7Bjob%3D%22prometheus%22%7D"
            return_content: true
          register: _promup
          retries: 20
          delay: 3
          until: (_promup.json.data.result | default([]) | length) > 0
          failed_when: false

        # Prometheus being up does not mean it is scraping. A monitoring system that collects nothing is worse
        # than none, because the dashboards look perfectly calm.
        - name: Assert Prometheus really collects data
          ansible.builtin.assert:
            that:
              - "(_promup.json.data.result | default([]) | length) > 0"
              - "_promup.json.data.result[0].value[1] == '1'"
            fail_msg: >-
              Prometheus cannot find its own up metric: it is running but scraping fails.
              See http://127.0.0.1:{{ prometheus_port }}/targets for target status and errors.
            success_msg: "Prometheus scraping OK: up{job=prometheus} = 1"
