# Create a database user, or set a new password for an existing one. Shared by the four playbooks 21 / 22 / 30 / 40.
#
# Variables:
#   rp_role      database user name
#   rp_password  password (generated by the caller or read back from an env file)
#   rp_create    true = CREATE ROLE ... LOGIN; false = ALTER ROLE (= rotation)
#   rp_changed   whether to report changed, default true; temporary users for verification pass false
#
# Three ways a password can leak, each one closed:
#   1. Command line: psql -c "... PASSWORD '...'" is visible to every user on the machine via ps while it runs.
#      -> The password goes over stdin only.
#   2. Server log: a failing statement (log_min_error_statement) and a statement slower than 200ms
#      (log_min_duration_statement) are written to the log verbatim; if log_statement is ever switched on,
#      every DDL statement is logged as well.
#      -> Inside the same transaction, SET LOCAL switches all three off first, for this transaction only.
#   3. Ansible output: the module arguments contain stdin, which is printed on failure.
#      -> This step is no_log; but the failure reason must not be hidden with it (CLAUDE.md section 7), so stderr
#         is shown separately -- psql errors do not echo the statement, and should one ever do so, PASSWORD '...' is masked first.

- name: "{{ rp_role }}: {{ 'create the database user' if rp_create | bool else 'set a new password for the database user' }}"
  ansible.builtin.command:
    cmd: psql -X -q -v ON_ERROR_STOP=1 -d postgres
    stdin: |
      BEGIN;
      SET LOCAL log_min_error_statement = panic;
      SET LOCAL log_min_duration_statement = -1;
      SET LOCAL log_statement = 'none';
      {{ 'CREATE ROLE ' ~ rp_role ~ ' LOGIN' if rp_create | bool else 'ALTER ROLE ' ~ rp_role }} PASSWORD '{{ rp_password }}';
      COMMIT;
  become_user: postgres
  register: _rp
  changed_when: rp_changed | default(true) | bool
  failed_when: false
  no_log: true

- name: "{{ rp_role }}: assert the password has been set"
  ansible.builtin.assert:
    that:
      - _rp.rc == 0
    fail_msg: |-
      {{ 'Creating the user' if rp_create | bool else 'Setting the password' }} failed (rc={{ _rp.rc }}):
      {{ _rp.stderr | default('') | regex_replace("(?i)PASSWORD\s+'[^']*'", "PASSWORD '***'") }}
    success_msg: "{{ rp_role }}: {{ 'created' if rp_create | bool else 'password updated' }}"
