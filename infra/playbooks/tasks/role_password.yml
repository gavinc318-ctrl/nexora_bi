# 建立库用户，或为已有库用户设新口令。21 / 22 / 30 / 40 四个剧本共用。
#
# 变量：
#   rp_role      库用户名
#   rp_password  口令（调用方生成或从环境文件取回）
#   rp_create    true = CREATE ROLE … LOGIN；false = ALTER ROLE（即轮换）
#   rp_changed   是否计为 changed，默认 true；验证用的临时用户传 false
#
# 口令的三条泄露路径，逐条堵住：
#   一、命令行：psql -c "… PASSWORD '…'" 在执行期间对本机任何用户的 ps 可见。
#       → 口令只走标准输入。
#   二、服务端日志：出错的语句（log_min_error_statement）与超过 200ms 的语句
#       （log_min_duration_statement）会连原文写进日志；若哪天打开了 log_statement，
#       DDL 也会被逐条记下。
#       → 同一事务内先 SET LOCAL 关掉这三项，只作用于这一个事务。
#   三、Ansible 输出：模块参数里有 stdin，失败时会被打印。
#       → 这一步 no_log；但失败原因不能跟着藏掉（CLAUDE.md 第 7 节），故 stderr
#         另行输出——psql 的报错不回显语句，万一回显，也先把 PASSWORD '…' 掩掉。

- name: "{{ rp_role }}：{{ '建立库用户' if rp_create | bool else '为库用户设新口令' }}"
  ansible.builtin.command:
    cmd: psql -X -q -v ON_ERROR_STOP=1 -d postgres
    stdin: |
      BEGIN;
      SET LOCAL log_min_error_statement = panic;
      SET LOCAL log_min_duration_statement = -1;
      SET LOCAL log_statement = 'none';
      {{ 'CREATE ROLE ' ~ rp_role ~ ' LOGIN' if rp_create | bool else 'ALTER ROLE ' ~ rp_role }} PASSWORD '{{ rp_password }}';
      COMMIT;
  become_user: postgres
  register: _rp
  changed_when: rp_changed | default(true) | bool
  failed_when: false
  no_log: true

- name: "{{ rp_role }}：断言口令已设置"
  ansible.builtin.assert:
    that:
      - _rp.rc == 0
    fail_msg: |-
      {{ '建立' if rp_create | bool else '设置口令' }}失败（rc={{ _rp.rc }}）：
      {{ _rp.stderr | default('') | regex_replace("(?i)PASSWORD\s+'[^']*'", "PASSWORD '***'") }}
    success_msg: "{{ rp_role }}：{{ '已建立' if rp_create | bool else '口令已更新' }}"
