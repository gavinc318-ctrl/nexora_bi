# Included by 40-schema.yml once per entry of db_logins; the variable "login" is that entry.
#
# The full life cycle of one database login user: password -> user -> env file -> membership in the
# privilege role -> verification as the real consumer.
#
# The only place the password is stored is /etc/oss911/<env_file> (0600, owned by the consumer). Four states:
#   env file present, user present -> keep it; whether the passwords match is verified by the real login at the end
#   env file present, user missing -> create the user with the file's password (the database was rebuilt)
#   env file missing, user missing -> generate a password, create the user, write the file
#   env file missing, user present -> the password can no longer be found; generate a new one and ALTER ROLE (= a rotation)

- name: "{{ login.name }}: read back the existing env file"
  ansible.builtin.slurp:
    src: "{{ oss911_etc }}/{{ login.env_file }}"
  register: _envf
  failed_when: false
  no_log: true

- name: "{{ login.name }}: get the password (keep the one in the file, or generate one)"
  ansible.builtin.set_fact:
    _pw: >-
      {{ ((_envf.content | b64decode) | regex_search('(?m)^' ~ login.env_prefix ~ '_PASSWORD=(.+)$', '\1') | first)
         if _envf.content is defined
         else lookup('ansible.builtin.password', '/dev/null', length=32, chars=['ascii_letters', 'digits']) }}
    _pw_is_new: "{{ _envf.content is not defined }}"
  no_log: true

- name: "{{ login.name }}: query the current state of the database user"
  ansible.builtin.command:
    cmd: >-
      psql -X -tA -d {{ pg_database }} -c
      "SELECT rolcanlogin::text || '|' || (rolsuper OR rolcreaterole OR rolcreatedb
              OR rolreplication OR rolbypassrls)::text
       FROM pg_roles WHERE rolname = '{{ login.name }}'"
  become_user: postgres
  register: _role
  changed_when: false
  check_mode: false

# A user of that name that exists but cannot log in or holds privileges was not created by this playbook --
# stop and let a human look, rather than changing its password and carrying on.
- name: "{{ login.name }}: assert the attributes of an existing user"
  ansible.builtin.assert:
    that:
      - _role.stdout | trim in ['', 'true|false']
    fail_msg: >-
      Database user {{ login.name }} exists but its attributes do not match (can login|has privileges = {{ _role.stdout | trim }});
      expected true|false. It may not have been created by this playbook. Check:
      sudo -u postgres psql -c '\du {{ login.name }}'
    success_msg: "{{ login.name }}: {{ 'does not exist yet, will be created' if _role.stdout | trim == '' else 'exists, attributes correct' }}"

# The password goes over stdin only, and the settings that would write the statement text into the server log
# are switched off inside the same transaction -- the details are in the shared role_password.yml, which 21 / 22 / 30 use too.
- name: "{{ login.name }}: create the database user, or set a new password for it"
  ansible.builtin.include_tasks: "{{ playbook_dir }}/tasks/role_password.yml"
  vars:
    rp_role: "{{ login.name }}"
    rp_password: "{{ _pw }}"
    rp_create: "{{ _role.stdout | trim == '' }}"
  when: _role.stdout | trim == '' or (_pw_is_new | bool)

- name: "{{ login.name }}: write the env file"
  ansible.builtin.copy:
    dest: "{{ oss911_etc }}/{{ login.env_file }}"
    owner: "{{ login.file_owner }}"
    group: "{{ login.file_owner }}"
    mode: "0600"
    content: |
      # Managed by infra/playbooks/40-schema.yml, do not edit by hand
      # Database login user {{ login.name }}; all of its privileges come from the privilege role {{ login.role }}
      {{ login.env_prefix }}_USER={{ login.name }}
      {{ login.env_prefix }}_PASSWORD={{ _pw }}
  no_log: true

- name: "{{ login.name }}: query whether it is a member of the privilege role {{ login.role }}"
  ansible.builtin.command:
    cmd: >-
      psql -X -tA -d {{ pg_database }} -c
      "SELECT count(*) FROM pg_auth_members
       WHERE roleid = '{{ login.role }}'::regrole AND member = '{{ login.name }}'::regrole"
  become_user: postgres
  register: _member
  changed_when: false
  check_mode: false

- name: "{{ login.name }}: add it to the privilege role {{ login.role }}"
  ansible.builtin.command:
    cmd: psql -X -q -v ON_ERROR_STOP=1 -d {{ pg_database }} -c "GRANT {{ login.role }} TO {{ login.name }}"
  become_user: postgres
  when: _member.stdout | trim == '0'

# The real consumer (the airflow account) reads its own env file and logs in through pgBouncer.
# Do not verify as postgres instead: postgres uses peer authentication on the local socket, which verifies
# neither the password nor auth_query (CLAUDE.md section 5, item two).
# Three result columns: current user | inherits the privilege role's rights | can SET ROLE to it (needed by dbt's role:)
# A boolean concatenated into text with || becomes true / false, not the t / f psql shows for a bare boolean column --
# the expected value is written as the concatenated text (this tripped the first real run).
- name: "{{ login.name }}: verify the login through pgBouncer as the consumer"
  ansible.builtin.shell:
    cmd: |
      set -a; . {{ oss911_etc }}/{{ login.env_file }}; set +a
      PGPASSWORD="${{ login.env_prefix }}_PASSWORD" psql -X -tA \
        -h 127.0.0.1 -p {{ pgb_listen_port }} -U "${{ login.env_prefix }}_USER" -d {{ pg_database }}_etl \
        -c "SELECT current_user || '|' || pg_has_role(current_user, '{{ login.role }}', 'USAGE')
                                || '|' || pg_has_role(current_user, '{{ login.role }}', 'SET')" 2>&1
  args:
    executable: /bin/bash
  become_user: "{{ login.file_owner }}"
  register: _login_check
  changed_when: false
  failed_when: false
  check_mode: false

- name: "{{ login.name }}: assert the login and the privilege role both work"
  ansible.builtin.assert:
    that:
      - _login_check.stdout | trim == login.name ~ '|true|true'
    fail_msg: |-
      {{ login.file_owner }} logging in as {{ login.name }} through pgBouncer gave the wrong result:
        expected: {{ login.name }}|true|true
        actual:   {{ _login_check.stdout | trim }}

      Check in this order:
        1. Password mismatch (password authentication failed): the env file and the database disagree.
           Delete {{ oss911_etc }}/{{ login.env_file }} and rerun this playbook; that generates a new password and rotates it
        2. pgBouncer authentication failed: is auth_query working (runbook/05)
        3. Second or third column is false: not a member of {{ login.role }}, or granted with INHERIT FALSE / SET FALSE
           sudo -u postgres psql -d {{ pg_database }} -c '\drg {{ login.name }}'
    success_msg: "{{ login.name }}: logged in through pgBouncer, inherits {{ login.role }}, can SET ROLE"
