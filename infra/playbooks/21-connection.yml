# 21-connection -- connection layer: pgBouncer + HAProxy
#
# The order is application -> pgBouncer -> HAProxy -> current primary, and it must not be reversed (DD-67).
# pgBouncer cannot elect a primary; its [databases] section can only hold one fixed address.
# Putting HAProxy behind it hands primary selection to HAProxy, which reads the Patroni health check.
# The other way round (HAProxy in front), each pgBouncer would be pinned to one database and the pool
# would follow the database.
#
# * Development differs from production in exactly two places, both in inventory:
#     haproxy_backends      one backend on the development machine, three in production
#     haproxy_health_check  pgsql-check on the development machine, Patroni REST /primary in production
#   Playbook and templates are identical on both sides. Leader election and failover drills cannot be
#   verified on the development machine (that is LD-08's territory); what can be verified is the topology,
#   the behaviour of the two pools and the connection limits.
#
# * About --check: as in 20-database, tasks after the install depend on users and directories the
#   packages create, so they are skipped in check mode as a block.

- name: Connection layer pgBouncer and HAProxy
  hosts: all
  # This playbook uses no facts (checked one by one on 2026-10-13: no ansible_* references in the
  # playbook, tasks/ or templates, and no fact-dependent package / service modules). Gathering facts
  # as root scans LVM and every block device, which on this machine sometimes takes minutes -- so we
  # do not gather what we do not need. To use a fact, delete this line and say here which fact is used.
  gather_facts: false
  become: true

  vars:
    pgb_conf_dir: /etc/pgbouncer

  tasks:

    # ================= Before the install: verifiable in check mode =================

    - name: Assert the connection budget does not exceed the PostgreSQL limit
      ansible.builtin.assert:
        that:
          - (pgb_pool_size_txn + pgb_pool_size_session + pgb_pool_size_keycloak
             + pgb_pool_size_airflow + pgb_reserve_pool) <= pgb_max_db_connections
          - (pgb_max_db_connections + 10) <= 100
        fail_msg: >-
          Connection budget exceeded. Transaction pool {{ pgb_pool_size_txn }} + session pool {{ pgb_pool_size_session }}
          + reserve pool {{ pgb_reserve_pool }} must not exceed the global cap {{ pgb_max_db_connections }};
          adding 10 reserved slots (superuser 3, monitoring 2, manual maintenance 5) must not exceed max_connections here.
          Both production LBs run active/passive, so normally there is still one set of pools, but during a switchover
          they briefly overlap -- production max_connections is therefore 200 (LD-08 chapter 8).
        success_msg: >-
          Connection budget: transaction {{ pgb_pool_size_txn }} + session {{ pgb_pool_size_session }}
          + Keycloak {{ pgb_pool_size_keycloak }} + Airflow {{ pgb_pool_size_airflow }}
          + reserve {{ pgb_reserve_pool }}
          <= cap {{ pgb_max_db_connections }}, plus 10 reserved slots

    - name: Install pgBouncer and HAProxy
      ansible.builtin.apt:
        name: "{{ connection_packages }}"
        state: present
        update_cache: true
        cache_valid_time: 3600

    # ================= After the install =================

    - name: Connection layer configuration
      when: not ansible_check_mode
      block:

        # ---------- Pool user on the database side ----------
        - name: Query whether the pool user exists
          ansible.builtin.command:
            cmd: psql -tAc "SELECT 1 FROM pg_roles WHERE rolname = 'pgbouncer'"
          become_user: postgres
          register: _pgbrole
          changed_when: false
          check_mode: false

        # The only place the pool user's password is stored is userlist.txt. The four states are the same
        # as in 40-schema's db_login:
        #   userlist present, user present -> keep it        userlist present, user missing -> create the user with the file's password
        #   userlist missing, user missing -> generate, create  userlist missing, user present -> new password + ALTER (= rotation)
        # So rotation means: delete userlist.txt and rerun this playbook (runbook/91).
        - name: Read the existing userlist
          ansible.builtin.slurp:
            src: "{{ pgb_conf_dir }}/userlist.txt"
          register: _userlist
          failed_when: false
          no_log: true

        - name: Get the pool user password (keep the one in userlist, or generate one)
          ansible.builtin.set_fact:
            _pgb_password: >-
              {{ (_userlist.content | b64decode).split('"')[3]
                 if _userlist.content is defined
                 else lookup('ansible.builtin.password', '/dev/null', length=32, chars=['ascii_letters', 'digits']) }}
            _pgb_password_is_new: "{{ _userlist.content is not defined }}"
          no_log: true

        - name: Create the pool user, or set a new password for it
          ansible.builtin.include_tasks: "{{ playbook_dir }}/tasks/role_password.yml"
          vars:
            rp_role: pgbouncer
            rp_password: "{{ _pgb_password }}"
            rp_create: "{{ _pgbrole.stdout | trim != '1' }}"
          when: _pgbrole.stdout | trim != '1' or (_pgb_password_is_new | bool)

        # pgBouncer must be able to read pg_shadow to pass SCRAM through; give it a read-only function, not superuser
        - name: Query whether the auth_query function exists
          ansible.builtin.command:
            cmd: >-
              psql -d {{ pg_database }} -tAc
              "SELECT 1 FROM pg_proc p JOIN pg_namespace n ON n.oid = p.pronamespace
               WHERE n.nspname = 'public' AND p.proname = 'pgbouncer_get_auth'"
          become_user: postgres
          register: _authfn_have
          changed_when: false
          check_mode: false

        - name: Create the auth_query function
          ansible.builtin.command:
            cmd: >-
              psql -d {{ pg_database }} -v ON_ERROR_STOP=1 -c
              "CREATE OR REPLACE FUNCTION public.pgbouncer_get_auth(p_usename text)
                 RETURNS TABLE(usename name, passwd text)
                 LANGUAGE sql SECURITY DEFINER SET search_path = pg_catalog AS
               $$ SELECT usename, passwd FROM pg_shadow WHERE usename = p_usename $$;
               REVOKE ALL ON FUNCTION public.pgbouncer_get_auth(text) FROM PUBLIC;
               GRANT EXECUTE ON FUNCTION public.pgbouncer_get_auth(text) TO pgbouncer;"
          become_user: postgres
          when: _authfn_have.stdout | trim != '1'

        # ---------- HAProxy ----------
        - name: Deploy the HAProxy configuration
          ansible.builtin.template:
            src: ../files/haproxy.cfg.j2
            dest: /etc/haproxy/haproxy.cfg
            owner: root
            group: root
            mode: "0644"
            validate: haproxy -c -f %s        # refuse to write a broken config instead of finding out at restart
          notify: restart haproxy

        - name: Enable and start HAProxy
          ansible.builtin.systemd_service:
            name: haproxy
            enabled: true
            state: started

        # ---------- pgBouncer ----------
        - name: Deploy the pgBouncer configuration
          ansible.builtin.template:
            src: ../files/pgbouncer.ini.j2
            dest: "{{ pgb_conf_dir }}/pgbouncer.ini"
            owner: postgres
            group: postgres
            mode: "0640"
          notify: restart pgbouncer

        - name: Write the userlist
          ansible.builtin.copy:
            dest: "{{ pgb_conf_dir }}/userlist.txt"
            owner: postgres
            group: postgres
            mode: "0600"
            content: |
              "pgbouncer" "{{ _pgb_password }}"
          no_log: true
          notify: reload pgbouncer          # after password rotation re-read auth_file -- reload is enough, do not restart

        # Which login may use which pool (DD-93). Rewritten when db_logins change; pgBouncer re-reads it on reload
        - name: Deploy pgBouncer's HBA (rejects pool / login mismatches)
          ansible.builtin.template:
            src: ../files/pgbouncer_hba.conf.j2
            dest: "{{ pgb_conf_dir }}/pgbouncer_hba.conf"
            owner: postgres
            group: postgres
            mode: "0640"
          notify: reload pgbouncer

        - name: Enable and start pgBouncer
          ansible.builtin.systemd_service:
            name: pgbouncer
            enabled: true
            state: started

        - name: Apply configuration changes now
          ansible.builtin.meta: flush_handlers

        # ---------- Verification: the path really works, and it is this path ----------
        # pg_isready rather than psql: this step verifies that "the HAProxy hop delivers TCP to the database",
        # while psql would also have to pass pg_hba authentication -- an authentication failure would be
        # misread as a broken path, which this project actually hit once. A check that can fail for reasons
        # other than the thing it claims to test costs more time than no check.
        - name: Probe through HAProxy
          ansible.builtin.command:
            cmd: pg_isready -h 127.0.0.1 -p {{ haproxy_listen_port }} -t 5
          register: _viahap
          changed_when: false
          failed_when: false
          check_mode: false

        - name: Assert the HAProxy hop works
          ansible.builtin.assert:
            that: ["_viahap.rc == 0"]
            fail_msg: >-
              Probe through HAProxy (127.0.0.1:{{ haproxy_listen_port }}) failed.
              Output: {{ _viahap.stdout | default('') }} {{ _viahap.stderr | default('') }} (rc={{ _viahap.rc }}).
              Check in this order: systemctl status haproxy -> journalctl -u haproxy -n 50
              (HAProxy logs to the journal on this machine, not to /var/log/haproxy.log) ->
              curl -s 127.0.0.1:{{ haproxy_stats_port }}/\;csv and check the backend status column is UP.
            success_msg: "HAProxy -> PostgreSQL path works: {{ _viahap.stdout | trim }}"

        # ---------- Pool modes of the two pools ----------
        # The pool user password was read from userlist or generated at the start of this playbook.
        - name: Query pgBouncer's pool list
          ansible.builtin.command:
            cmd: >-
              psql -h 127.0.0.1 -p {{ pgb_listen_port }} -U pgbouncer -d pgbouncer
              -tAc "SHOW DATABASES"
          environment:
            PGPASSWORD: "{{ _pgb_password }}"
          become_user: postgres
          register: _pools
          changed_when: false
          failed_when: false
          no_log: true

        # "Both pools exist" is easy to assert; "the pool modes really differ" is the point --
        # same nature as network isolation: configuration present is not configuration in effect.
        - name: Assert the two pools really have different pool modes
          ansible.builtin.assert:
            that:
              - "'transaction' in _pools.stdout"
              - "'session' in _pools.stdout"
            fail_msg: >-
              pgBouncer's SHOW DATABASES does not show both pool modes, transaction and session.
              First make sure this step did not itself fail for lack of a password:
              psql -h 127.0.0.1 -p {{ pgb_listen_port }} -U pgbouncer -d pgbouncer -c "SHOW DATABASES"
              (the password is in {{ pgb_conf_dir }}/userlist.txt).
              If it connects and both modes are the same, the template or configuration is wrong: with both
              pools in transaction mode, SET, temporary tables and advisory locks of dbt and Airflow fail at
              random at run time, and the failures do not look pool related -- which is exactly why it must be caught here.
            success_msg: "The two pools have different modes: transaction and session side by side"

        # ---------- Does auth_query really work ----------
        # The SHOW DATABASES above uses pgbouncer itself, the only user in userlist, which takes the path that
        # bypasses auth_query -- it cannot tell whether other users can connect.
        # So connect once with a user that exists only in the database and not in userlist.
        #
        # * The probe user's password is generated independently at random every time and the user is dropped
        #   after use. The previous version used "probe_ + the first 12 characters of the pool user's password",
        #   on the command line -- visible to every user on the machine via ps while running, which exposed most
        #   of the pool user's password (NOTES.md 2026-10-12, Mac-side handover item 1).
        #   A password used for verification must never be derived from the password being verified.
        - name: Generate a one-time password for the probe user
          ansible.builtin.set_fact:
            _probe_password: "{{ lookup('ansible.builtin.password', '/dev/null', length=32, chars=['ascii_letters', 'digits']) }}"
          no_log: true

        # The probe connects to {{ pg_database }}, where CONNECT is no longer public (40-schema, tasks/db_connect.yml):
        # it gets an explicit grant, and a role holding a grant must give it up before it can be dropped
        - name: Drop a probe user possibly left over from a previous run
          ansible.builtin.command:
            cmd: psql -X -q -v ON_ERROR_STOP=1 -d postgres
            stdin: |
              DO $$
              BEGIN
                  IF EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'pgb_probe') THEN
                      REVOKE ALL ON DATABASE {{ pg_database }} FROM pgb_probe;
                      DROP ROLE pgb_probe;
                  END IF;
              END $$;
          become_user: postgres
          changed_when: false

        - name: Create the auth_query probe user
          ansible.builtin.include_tasks: "{{ playbook_dir }}/tasks/role_password.yml"
          vars:
            rp_role: pgb_probe
            rp_password: "{{ _probe_password }}"
            rp_create: true
            rp_changed: false

        - name: Let the probe user connect to {{ pg_database }}
          ansible.builtin.command:
            cmd: psql -X -q -v ON_ERROR_STOP=1 -d postgres -c "GRANT CONNECT ON DATABASE {{ pg_database }} TO pgb_probe"
          become_user: postgres
          changed_when: false

        - name: Connect once through pgBouncer as that user
          ansible.builtin.command:
            cmd: >-
              psql -h 127.0.0.1 -p {{ pgb_listen_port }} -U pgb_probe -d {{ pg_database }}
              -tAc "SELECT 'auth-query-ok'"
          environment:
            PGPASSWORD: "{{ _probe_password }}"
          become_user: postgres
          register: _probe
          changed_when: false
          failed_when: false
          no_log: true

        - name: Drop the probe user
          ansible.builtin.command:
            cmd: psql -X -q -v ON_ERROR_STOP=1 -d postgres
            stdin: |
              REVOKE ALL ON DATABASE {{ pg_database }} FROM pgb_probe;
              DROP ROLE pgb_probe;
          become_user: postgres
          changed_when: false

        - name: Assert auth_query works
          ansible.builtin.assert:
            that: ["(_probe.stdout | default('')) is search('auth-query-ok')"]
            fail_msg: >-
              A user not in userlist cannot authenticate through pgBouncer, so auth_query is not working.
              userlist holds only pgbouncer itself; every other user is looked up via auth_query.
              Without it no user other than pgbouncer can connect, and verifying with pgbouncer itself
              bypasses exactly that path -- it would never find the problem.
              Check in order: auth_user / auth_query / auth_dbname in pgbouncer.ini;
              whether public.pgbouncer_get_auth exists in the {{ pg_database }} database and is granted to pgbouncer.
            success_msg: "auth_query works: users outside userlist can authenticate through the pool"

  handlers:
    - name: restart haproxy
      ansible.builtin.systemd_service:
        name: haproxy
        state: restarted
    # * restart waits 90 seconds: the distribution unit's KillSignal=SIGINT is pgBouncer's "safe shutdown",
    #   which waits for every client to disconnect; Airflow and Keycloak use session pools whose connections
    #   never disconnect on their own, so it waits until TimeoutStopSec (90 s) and gets SIGKILLed (observed
    #   2026-10-13 while rotating passwords). Use restart only when a pgbouncer.ini setting that needs a restart
    #   (such as listen) changes; a change of auth_file (userlist) uses reload (SIGHUP), which keeps every
    #   established connection.
    - name: restart pgbouncer
      ansible.builtin.systemd_service:
        name: pgbouncer
        state: restarted
    - name: reload pgbouncer
      ansible.builtin.systemd_service:
        name: pgbouncer
        state: reloaded
