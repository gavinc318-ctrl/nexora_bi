---
# 10-runtime -- container runtime and networks
#
# This step starts no business containers. It only lays the foundation of the foundation:
# the runtime, two network segments and the registry configuration. Business containers are
# added layer by layer from 20-database.yml onwards.
#
# Why a separate playbook: runtime problems and container problems are two kinds of failure;
# mixed into one playbook, troubleshooting cannot tell which layer is at fault.

- name: Container runtime
  hosts: all
  # This playbook uses no facts (checked one by one on 2026-10-13: no ansible_* references in the
  # playbook, tasks/ or templates, and no fact-dependent package / service modules). Gathering facts
  # as root scans LVM and every block device, which on this machine sometimes takes minutes -- so we
  # do not gather what we do not need. To use a fact, delete this line and say here which fact is used.
  gather_facts: false
  become: true

  tasks:

    # ---------- 1. Runtime packages ----------
    # netavark and aardvark-dns must be installed explicitly.
    # On Ubuntu they are Recommends, not Depends: as soon as someone installs podman with
    # --no-install-recommends, containers can no longer resolve each other by name --
    # and the error reported is "connection refused", which does not look like DNS at all.
    - name: Install the container runtime
      ansible.builtin.apt:
        name: "{{ container_packages }}"
        state: present
        update_cache: true
        cache_valid_time: 3600

    # Read-only queries always get check_mode: false -- command tasks are skipped under --check by
    # default, the registered variable is then empty, and the following assert compares an empty
    # string and reports a false failure. failed_when: false as well: in check mode apt has not
    # really installed anything, so the command itself fails.
    - name: Record the podman version
      ansible.builtin.command:
        cmd: podman --version
      register: _podman_ver
      changed_when: false
      check_mode: false
      failed_when: false

    - name: Show the podman version
      ansible.builtin.debug:
        msg: "{{ _podman_ver.stdout | default('(check mode, podman not installed yet)') }} (record it in artifacts/MANIFEST.md)"

    # ---------- 2. Confirm the storage location ----------
    # podman's default graphroot is /var/lib/containers/storage, which is exactly the dedicated
    # volume (asserted in 00-base). Confirm it once rather than assume it.
    - name: Query the podman storage path
      ansible.builtin.command:
        cmd: podman info --format '{{ '{{' }} .Store.GraphRoot {{ '}}' }}'
      register: _graphroot
      changed_when: false
      check_mode: false
      failed_when: false

    # In check mode podman may not be installed yet; skip the assert instead of reporting a false failure.
    - name: Assert image storage is on the dedicated volume
      ansible.builtin.assert:
        that:
          - _graphroot.stdout | trim is match('^/var/lib/containers')
        fail_msg: >-
          podman storage is at "{{ _graphroot.stdout | trim }}", not on the /var/lib/containers volume.
          Images would be written to the root volume, and a full root volume breaks the whole machine.
        success_msg: "Image storage: {{ _graphroot.stdout | trim }}"
      when: not ansible_check_mode and _graphroot.rc == 0

    # ---------- 3. Two network segments ----------
    # Simulates the production network boundary on one machine: the service layer lives only in
    # internal, the reverse proxy in dmz. Mobile requests (IF-40) must really pass through the proxy,
    # so the mobile constraints of LD-04 chapter 9 and LD-07 are actually in force in development --
    # not "written in the code but the path never exercised".
    - name: Query existing networks
      ansible.builtin.command:
        cmd: podman network ls --format '{{ '{{' }} .Name {{ '}}' }}'
      register: _networks
      changed_when: false
      check_mode: false
      failed_when: false

    # --opt isolate=true is the point of this step, not an optional optimisation.
    # podman bridge networks are NOT isolated by default: both bridges live on the same host, the
    # host routes between them, and a container in dmz can ping internal IPs directly. This project
    # has confirmed it in practice.
    #
    # The trap: cross-segment access by NAME fails (aardvark-dns scopes resolution per network),
    # which looks like isolation is working, when in fact only the name lookup fails. Verify by IP.
    - name: Create the network segments
      ansible.builtin.command:
        cmd: >-
          podman network create
          --subnet {{ item.subnet }}
          --opt isolate=true
          {{ item.name }}
      when:
        - not ansible_check_mode
        - item.name not in (_networks.stdout_lines | default([]))
      loop: "{{ podman_networks }}"
      loop_control:
        label: "{{ item.name }} {{ item.subnet }}"

    # For existing segments, verify isolate is true.
    # Never rebuild automatically -- rebuilding disconnects the containers attached to it, and that
    # is a decision for a human.
    - name: Query the isolate setting of existing segments
      ansible.builtin.command:
        cmd: podman network inspect {{ item.name }} --format '{{ '{{' }} .Options.isolate {{ '}}' }}'
      register: _isolate
      changed_when: false
      check_mode: false
      failed_when: false
      loop: "{{ podman_networks }}"
      loop_control:
        label: "{{ item.name }}"
      when: not ansible_check_mode

    - name: Assert network isolation is enabled
      ansible.builtin.assert:
        that:
          - item.stdout | trim == 'true'
        fail_msg: >-
          isolate is not true for segment {{ item.item.name }} (found "{{ item.stdout | trim }}").
          Without isolation, containers in dmz can reach internal by IP and the DMZ boundary is meaningless.
          Rebuild the segment by hand (this disconnects the containers attached to it, so the playbook does not do it):
            sudo podman network rm -f {{ item.item.name }}
            then rerun this playbook
        success_msg: "{{ item.item.name }} isolation enabled"
      loop: "{{ _isolate.results | default([]) }}"
      loop_control:
        label: "{{ item.item.name | default('') }}"
      when:
        - not ansible_check_mode
        - _isolate.results is defined

    # ---------- 4. Registries: external today, internal mirror only later ----------
    # The default registries are not changed now, but the file is created with instructions on how
    # to switch, so nobody has to start studying registries.conf on the day the network goes offline.
    - name: Deploy the registry configuration
      ansible.builtin.copy:
        dest: /etc/containers/registries.conf.d/10-oss911.conf
        owner: root
        group: root
        mode: "0644"
        content: |
          # OSS911 -- managed by infra/playbooks/10-runtime.yml, do not edit by hand
          #
          # Current stage (the development machine has internet access): upstream default registries,
          # only the search scope is restricted, so podman does not guess between registries and pull
          # an unexpected image.
          unqualified-search-registries = ["docker.io", "quay.io"]

          # For offline deployment switch to the internal registry: uncomment the lines below and fill
          # in the real address; every image pull is then redirected to the internal network. Image
          # references of the business containers do not change.
          #
          # [[registry]]
          # prefix = "docker.io"
          # location = "registry.internal.oss911/docker-hub"
          #
          # [[registry]]
          # prefix = "quay.io"
          # location = "registry.internal.oss911/quay"

    # ---------- 5. No automatic updates ----------
    # Same reason as disabling unattended-upgrades in 00-base: image versions must be reproducible,
    # and background updates silently drift the running images away from MANIFEST.
    - name: Disable podman auto-update
      ansible.builtin.systemd_service:
        name: podman-auto-update.timer
        enabled: false
        state: stopped
      failed_when: false
