# =====================================================================
# Structural change manifest of the database cad_mirror (DD-90 · LD-08 chapter 8)
#
# cad_mirror is a separate database on the same cluster: the CAD views that DS writes into, in their original
# structure. It has its own change sequence and its own registry (ddl.ddl_change in cad_mirror); it is not part
# of ddl/changes.yml, which is executed in the database oss911.
#
# Executor: infra/playbooks/41-cad-mirror.yml, with the same rules as ddl/changes.yml (tasks/ddl_changes.yml):
#   1. executed in id order; changes already registered are not executed again
#   2. all files of a change, with its registry row, in ONE transaction
#   3. content_sha256 = SHA-256 of the files concatenated in the order of "files"
#   4. run_as: owner, always -- SET LOCAL ROLE cad_mirror_owner; the owner role owns the database, so it can
#      create schemas in it. There is no superuser change in this sequence
#   5. paths in "files" are relative to this directory
#
# Development phase (Gavin, 2026-10-26): the DDL is generated by us and countersigned by DS (IR-51), and may still
# change before the formal software release. Until then executed files MAY be rewritten; the development
# database is then rebuilt (41-cad-mirror.yml with -e cad_mirror_rebuild=true). From the formal release on,
# inventory sets cad_mirror_ddl_frozen: true and rule 3 applies as in ddl/changes.yml: an executed change is
# never modified, corrections go into a new change.
#
# 0001 is generated: python3 tools/cad_mirror_ddl.py > ddl/cad_mirror/changes/0001_mirror_tables.sql
# =====================================================================

- id: "0000"
  run_as: owner
  summary: The structural change registry of cad_mirror (schema ddl, not reachable by the DS writer)
  files:
    - changes/0000_ddl_change.sql

- id: "0001"
  run_as: owner
  summary: The CAD views mirrored by DS (74 tables, generated), mirror timestamp trigger, heartbeat and daily counts, privileges
  files:
    - changes/0001_mirror_tables.sql
