# =====================================================================
# Structural change manifest (DDL change)
#
# Not called "migration": in this project "migration" means only the migration of Hexagon archive data
# (CN-15 · REQ-MIG-* · DD-37); giving both the same name would get them confused at handover.
#
# Rules (the executor, infra/playbooks/40-schema.yml, implements exactly these):
#   1. Execute in id order; changes already registered in meta.ddl_change are not executed again
#   2. All files of a change, together with the INSERT of its registry row at the end, run in ONE transaction
#   3. content_sha256 = SHA-256 of the files' bytes concatenated in the order listed in "files".
#      If the checksum of an executed change changes, the executor must fail -- the structure can only be
#      changed by a new change, never by editing executed files. Idempotence comes from "has the change been
#      executed", not from IF NOT EXISTS (which skips silently when a definition has changed)
#   4. run_as: superuser -- the executor itself (postgres). Only for 0000 to 0002:
#                 0001 creates extensions, 0002 creates roles
#              owner     -- SET LOCAL ROLE oss911_owner at the start of the transaction, so new objects belong to the owner role
#      From 0003 on, always owner
#   5. Paths in "files" are relative to the directory of this file
#
# Files of executed changes keep their original (Chinese) comments: editing them would change the checksum
# (rule 3). tools/check_no_cjk.py lists them as exceptions; all new changes are written in English.
# =====================================================================

- id: "0000"
  run_as: superuser
  summary: The structural change registry itself
  files:
    - changes/0000_ddl_change.sql

- id: "0001"
  run_as: superuser
  summary: Initial structure (LD-02) -- seven schemas, 50 tables, partition function and indexes
  files:
    - 01_schemas_and_helpers.sql
    - 02_core_dimensions.sql
    - 03_core_facts.sql
    - 04_meta_and_audit.sql
    - 05_partitions_and_indexes.sql

- id: "0002"
  run_as: superuser
  summary: Five privilege roles, single owner, grants and default privileges, partition function made SECURITY DEFINER
  files:
    - changes/0002_roles_and_grants.sql

- id: "0003"
  run_as: owner
  summary: Quarantine registry meta.quarantine_batch (DD-76) and runtime parameter change log audit.runtime_param_change_log (DD-75)
  files:
    - changes/0003_quarantine_and_param_log.sql
