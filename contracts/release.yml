# =====================================================================
# 契约发布清单：本次发布同步进 meta.source_contract 的契约文件（DD-88 · LD-01 2.5）
#
# 由 infra/playbooks/45-contracts.yml 读取。只同步这里列出的文件；清单中任何一份的 target_raw
# 在库里不存在，部署即失败——每一份契约的 target_raw 都对应一个结构变更（LD-02 第 9 章），
# 契约先于它的 raw 表发布是发布错误，不是可以跳过的情况。
#
# 清单在仓库里而不在 inventory 里：发布内容在各环境必须一致，环境差异只在部署参数（LD-08 7.3）。
#
# 加一份契约进清单之前：它的 raw 表已由结构变更建好并执行过。
# 从清单里拿掉一份契约，不会删库里的副本（水位、运行日志、批次登记都以外键指着它）；
# 部署时会列出「库里有、清单里没有」的契约。要停一个源，用 M-01 的启停（enabled），不是改清单。
#
# 契约文件里的 enabled 只在首次进库时生效；之后启停只认库里的 enabled，同步永不触碰它（DD-88）。
# =====================================================================
release:
  - if03a_icp_cdr.yaml        # raw.icp_cdr_voice，结构变更 0004
  # if03b_icp_agent_session.yaml   待 raw 表的结构变更
  # if03c_icp_agent_day.yaml       待 raw 表的结构变更
  # if03d_icp_reference.yaml       待 raw 表的结构变更
