quality:
  batch_checks:
    - "同一 CALLID 至多一行 CALLIDNUM = -1；缺失即该通呼叫尚未结束，不报错。其收尾：短于回看的由下一次增量的回看取到，更长的靠每日回扫（LD-01 4.4）"
    - "同一 CALLID 内 CALLIDNUM 不得重复"
    - "WAITBEGIN 不得为空；为空即整批隔离：照常写入 raw 并登记 meta.quarantine_batch（LD-01 7.1 · DD-82）"
    - "WAITEND < WAITBEGIN、CALLEND < CALLBEGIN 等时序倒置：整批照常写入 raw，登记隔离（DD-76 · DD-82）"
    - "CALLTYPE 不在 enums.call_type 值表内的，进待澄清队列并计入 unknown 列数"
  recon: "按 LD-01 8.3 的滚动窗口校验；对账基准见 metrics/icp_source_map.yaml"

# 联调核实项（AS-32）：假接口照文档猜的行为，与真实平台不同时多半不报错、只是少数据或错位。
# 联调时逐条主动核实，结果回写本段的 status 与 note，并在 NOTES 记一节。编号对应 NOTES「假设登记草稿」第三节与 ICP 问题单。
integration_checks:
  - id: request_timezone
    question: "startTime / endTime 按什么时区解释？（猜 1，问题单 Q07）"
    why: "若实为本地时间（+03），每个窗口整体错位 3 小时，水位与回看全部错位，不报错。最先核实"
    status: open
  - id: response_timezone
    question: "返回的时间字段是什么时区？（猜 2，Q08）window.source_timezone 现按 UTC"
    why: "错则 core 的时间整体偏 3 小时，全部按日归属的指标错日；source_tz_offset 来自本契约而非源端（DD-91 第 12 条）"
    status: open
  - id: window_boundaries
    question: "窗口是 [startTime, endTime) 半开区间吗？（猜 6）"
    why: "若两端都开，边界上的腿永远取不到；WAITBEGIN 只到秒，同一秒内常有多条"
    status: open
  - id: silent_truncation
    question: "单次返回行数有没有上限？超出时是否静默截断且 retcode 仍为 0？（猜 7）"
    why: "高峰窗口会漏行而不报错，只有对账（LD-01 8.3）能发现"
    status: open
  - id: failure_response
    question: "失败时的响应形态：HTTP 状态码、retcode 在头里还是正文里？空结果是只有表头吗？（猜 8、9）"
    why: "接入程序据此区分「失败」「空」「成功」；判断错了，空与失败会被混淆"
    status: open
  - id: csv_format
    question: "列数与列序、引号、空值写法、换行、BOM（猜 10，Q16）"
    why: "列错位会把一列的值整列写进另一列，raw 原样落地，到 staging 才暴露；staging 把空串当空值"
    status: open
  - id: token_and_account
    question: "token 有效期、失效错误码、重复鉴权是否踢掉旧会话；下载话单要什么账号（猜 11、12，IR-45）"
    why: "多个源共用一个服务工号时可能互相挤掉；账号权限不对则哪种都拿不到话单"
    status: open
  - id: leg_appearance
    question: "腿在什么时刻出现在接口里：进入设备时，还是离开设备时？最长延迟多少？（猜 15，Q18、Q19）"
    why: "决定同一张话单会变几次、回看与回扫要多长"
    status: open
  - id: callidnum_numbering
    question: "CALLIDNUM 是否稳定、-1 是否只出现一次且最后出现（猜 16，AS-33，Q21）"
    why: "「通话是否结束」的判断与幂等键的稳定都靠它"
    status: open
  - id: release_cause_on_legs
    question: "非末腿的 RELEASECAUSE 取什么值（猜 17，Q23）"
    why: "M-C11 挂断方；若非末腿是随机值，任何对它的统计都要先过滤末腿"
    status: open
  - id: callid_scope
    question: "CALLID 的唯一范围：跨天、平台重启后会不会重复？（猜 19，IR-45 第五项，Q20）"
    why: "若会重复，(CALLID, CALLIDNUM) 作为幂等键不够、须加日期——全部主键随之改变。dbt 的 24 小时防线只是兜底"
    status: open
  - id: release_cause_classes
    question: "enums.release_cause.classes 的归类与真实话单是否相符"
    why: "归类来自文档中跨页合并的单元格；M-C03、M-C11 压在它上面"
    status: open
