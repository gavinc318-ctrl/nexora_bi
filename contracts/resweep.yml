# =====================================================================
# 每日回扫从哪一天开始（LD-01 4.4 · DD-89 注，Gavin 2026-10-26 定：由人在首次上线时显式填写）
#
# 由 `oss911-ingest dag-manifest` 读进 DAG 发布清单。回扫 DAG 开着补跑（catchup）：开启时，从这里写的那一天起、
# 到昨天为止，每一天都会排一次回扫；停机漏掉的日子也按逻辑日期自动补上。所以这个日期是一个明确的决定——
# 写得太早，一开启就排出一长串回扫；不写，这个源就**没有**回扫 DAG（还没上线的源本来就不该有）。
#
# 只对按时间窗口增量、带回看的源有意义（契约 window 里有 max_span_hours 与 lookback_minutes）；其他源写了也不用。
# 日期是源端时区的日期（契约 window.source_timezone）。
#
# 改这里 = 改发布内容：随 45-contracts 进清单，50-dags 部署后生效。
# =====================================================================
resweep_from:
  icp_cdr_voice: "2026-10-25"    # 开发机：首次增量在 10-21；回扫从 10-25 起，开启时只补一天
