# =====================================================================
# IF-03d  话务参照数据（配置同步接口）
#
# 技能队列、坐席、坐席组等的权威在 ICP，本方只读。
# 关键在版本号：先取版本号，变了才拉全量，再逐字段比对后写变更留痕——
# 直接全量比对会把排序与空白差异报成变更，假变更会把真变更淹掉（LD-01 4.6）。
# =====================================================================
source_id: icp_reference
connector: rest_api
target_raw: raw.icp_reference
contract_version: 1
enabled: true

endpoint:
  version_probe:
    method: GET
    path: /cmsgateway/resource/synwas/versions
  datasets:
    - name: vdn
      path: /cmsgateway/resource/synwas/vdns
      target: core.dim_site
      note: "单一 VDN（AS-30）。本集用于核对该假设是否仍成立——多出一个 VDN 是必须立刻知道的事"
    - name: agent
      path: "/cmsgateway/resource/synwas/agents/{ccId}/{vdnId}"
      target: core.dim_agent
      note: "坐席工号与姓名。SCD2 的自然键即工号（AS-31）"
    - name: agent_group
      path: "/cmsgateway/resource/synwas/groups/{ccId}/{vdnId}"
      target: core.dim_agent
      note: "坐席组是管理分组，与技能队列是两套东西，不可混用"
    - name: skill
      path: "/cmsgateway/resource/synwas/skills/{ccId}/{vdnId}"
      target: core.dim_queue
      note: "技能队列。与 CAD 的警种不是一回事，禁止一对一映射"
    - name: skill_group
      path: "/cmsgateway/resource/synwas/skillgroups/{ccId}/{vdnId}"
      target: core.dim_queue
    - name: called_config
      path: "/cmsgateway/resource/synwas/calledconfigs/{ccId}/{vdnId}"
      target: core.dim_channel
      note: "被叫配置，即接入码"
    - name: rest_reason
      path: "/cmsgateway/resource/synwas/restreasons/{ccId}/{vdnId}"
      target: meta.reference_value
      note: "休息原因码。M-R03 的休息时长按此分类"
    - name: service_type
      path: "/cmsgateway/resource/synwas/servertypes/{ccId}/{vdnId}"
      target: meta.reference_value
      note: "业务类型，IVR 指标按此分组"

auth: {inherits: icp_cdr_voice}

window:
  schedule: "*/30 * * * *"
  strategy: version_gated
  note: "每半小时取一次版本号；版本号未变即本次运行无操作，run_log 记 success 且 row_count = 0"

watermark: {type: sequence, column: config_version}
idempotent_key: [dataset, src_natural_key]

# 写入语义（DD-82 · DD-76 · DD-02）：raw 只追加，不覆盖
raw_write:
  mode: append_if_changed          # 写入前查同一（幂等键, content_hash）是否已存在，已存在不写
  content_hash: all_source_columns # 全部源列；接入元数据（run_id · batch_seq · 落地时间）不计入
  dedup_ignores_batches: [pending, discarded]   # 被扣下或丢弃批次中的行不挡后续观测
  bad_data: raw_then_quarantine    # 未通过校验的批次照常写入 raw，并登记 meta.quarantine_batch
core_version:
  from: config_version             # 源端给的数据集级版本号，按快照处理（DD-82 第四条）
  rules:
    greater: "应用该快照；快照中不再出现的实体置为非当前（SCD2，见 quality）"
    equal:   "不动"
    less:    "不应用、不静默丢弃：进待澄清队列并告警——可能是平台回滚，也可能读到滞后节点，须由人判断"

quality:
  batch_checks:
    - "版本号变化但全量比对无差异的，记入运行日志并告警——说明版本号的含义与预期不符"
    - "坐席或技能队列消失时不删行，置为非当前（SCD2）。源端删除不等于历史不存在"
  change_log: "逐字段差异写 audit.reference_data_change_log，并在 M-10 可查（LD-01 9.3）"

# 联调时必须用真实环境核实、不能按文档推断的事项。核实结论回写到本节并递增 contract_version
integration_checks:
  - id: config_version_monotonic
    question: "config_version 是否单调递增？平台重启、升级或主备切换后是否归零或回退？"
    why: >-
      core 以它判断快照新旧（DD-82 第四条）。若重启后归零，此后每个快照都会被判为
      「更小」而停在待澄清队列，参照数据就此冻结——且看上去像是平台在频繁回滚。
      届时须改为以（平台启动标识, config_version）或观测时间作版本
    status: open

