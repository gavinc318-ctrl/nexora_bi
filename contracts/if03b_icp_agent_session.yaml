# =====================================================================
# IF-03b  坐席签入签出区间（平台历史指标接口 hindex/agent，接口文档 p.935–936、p.1035 表 2–3）
#
# 这一条给的是区间数组而非累计值，因此是明细：在岗时长可自算，
# 也可按 DD-53 与班次时间窗口求交。与 if03c 的日累计性质不同，故分开。
#
# 接口没有日期参数（DD-98 第一条）：请求体只有 ccId、vdnId、objectIds、indexIds，返回的区间是哪一天的待 Q36 / Q38。
# 答复前按「当日至今」实现：每次观测取回当时平台给的全部区间，区间按 inTime 归日，不受观测时刻影响。
# 回补不可能，原设计的 restate_days 作废。
# =====================================================================
source_id: icp_agent_session
connector: rest_api
target_raw: raw.icp_agent_session
contract_version: 2                  # 2026-11-22 v2：id 指回 agent_no；请求未返回的工号登记不隔离（DD-98 评审注）。v1 为 2026-11-19 按 DD-98 重写
enabled: true

endpoint:
  method: POST
  path: /cmsgateway/resource/hindex/agent
  host_ref: icp_cms_gateway            # 与话单同一网关（契约 if03a）
  response: json                       # {message, retcode, result: [{id, idxs: [{id, val}]}]}；retcode "0" 为成功
  site_vdn:                            # 请求体的 ccId / vdnId，也是取工号的那份坐席快照的范围（与 if03d 一致，Q31 待确认）
    cc_id: "1"
    vdn_id: "1"
  index_ids: [IDX_04_03_001]           # 坐席签入签出情况（表 2），val 为区间数组（表 3）
  objects:                             # objectIds 从哪来（DD-98 第三条）
    from: icp_reference                # 接入角色读不到 core（DD-74），只能读 raw：raw.icp_reference 的 agents 快照
    dataset: agents
    batch_size: 2000                   # 文档上限 20000；按 2000 分批，一批一个请求、一个接入批次
    note: >-
      site_vdn 最近一份可信的 agents 快照（未隔离，或隔离后放行并已被 dbt 应用，DD-94 十九的口径）里的全部工号，
      并上「当日」（window.day_timezone）开始时有效的那份与当日之后取到的每份可信快照里的工号——当天中途被删的坐席，
      这一天的数据照样要取。一份可信快照都没有即运行失败（先跑 icp_reference）
  prerequisite: >-
    平台的报表脚本已执行、话单已导入其数据库。历史指标接口都有这个前置条件，
    故本条的新鲜度由 ICP 侧的报表批决定，不由本方控制（LD-01 4.1）。
    报表批的时间表须问清，否则「昨天的数据几点能取」无法承诺。

auth: {inherits: icp_cdr_voice}

window:
  grain: observation                   # 每次运行是一次「当日至今」的观测，没有时间窗口可切
  schedule: "*/10 * * * *"             # 每 10 分钟（DAG 按 UTC 读）。日终最后一次观测在 23:50 左右，见 if03c
  source_timezone: UTC                 # inTime / outTime 的写法所在时区，与话单一致（if03a，Q08 待核实）
  day_timezone: Asia/Riyadh            # 「当日」按哪个时区切：取工号时用（见 endpoint.objects）。区间本身按 inTime 归日
  note: >-
    不写 watermark_state：每次运行取的都是「当前」，没有位置可推进。同一区间在签出前每次观测都可能变（duration 增长、
    outTime 回填），raw 只追加与该区间上一次观测不同的内容（raw_write）

watermark:
  type: timestamptz
  column: observed_at
  note: "观测时刻（请求发出前取 now()），即 core_version。不推进 watermark_state"

idempotent_key: [id, inTime]
idempotent_note: "一名坐席一天可有多段区间。以工号加签入时刻定位一段。"

# 写入语义（DD-82 · DD-76 · DD-02）：raw 只追加，不覆盖
raw_write:
  mode: append_if_changed          # 与该键上一次（未在待处理或已丢弃批次中的）观测比 content_hash，不同才写
  content_hash: all_source_fields  # 区间的全部字段加工号；接入元数据（run_id · batch_seq · 观测与落地时间）不计入
  dedup_ignores_batches: [pending, discarded]   # 被扣下或丢弃批次中的行不挡后续观测
  bad_data: raw_then_quarantine    # 未通过校验的批次照常写入 raw，并登记 meta.quarantine_batch
core_version:
  from: observed_at                # 源端无行级变更时间（签出时回填 outTime），取观测时刻

columns:
  - {src: id,       type: text,        target: fact_agent_session.agent_no,          state: verified,          note: "坐席工号（文档类型 int、样例为字符串，原样存文本），经 dim_agent 解析为 agent_sk（AS-31），另原样写进 agent_no（结构变更 0015）；缺维度时 agent_sk 为空（DD-98 第五条）"}
  - {src: inTime,   type: timestamptz, target: fact_agent_session.signin_at,         state: verified,          note: "签入时刻，格式 YYYY-MM-DD HH:MM:SS，按 window.source_timezone 解释"}
  - {src: outTime,  type: timestamptz, target: fact_agent_session.signout_at,        state: mapped_unverified, note: "签出时刻。为空即仍在线或当日未签出；未签出时报表算到观测时刻（DD-98 第八条，Q37）"}
  - {src: duration, type: integer,     target: fact_agent_session.duration_seconds,  state: mapped_unverified, note: "源端给出的时长，文本；「n.0」视为整数。不由本方用签出减签入重算——两者不一致时以源端为准并记入对账差异。未签出时含义待 Q37"}

quality:
  batch_checks:
    - "响应不是 {id, idxs} 记录的数组、idxs 里没有 IDX_04_03_001、val 既不是区间数组也不是 null：整批隔离（raw 照写能写的部分）"
    - "返回了请求里没有的工号：整批隔离——说明 objectIds 与响应对不上"
    - "请求了而未返回的工号：登记在 raw.icp_agent_coverage（每批一行：请求的、返回的工号与观测时刻），不隔离，该批照常接入已返回的记录；空数组即全部缺失（DD-98 评审注，Q40）"
    - "inTime 缺失或不是 YYYY-MM-DD HH:MM:SS：整批隔离（键不完整）"
    - "outTime 非空时必须是同一格式且不早于 inTime；倒置的批次照常写入 raw，登记隔离（DD-76 · DD-82）"
    - "duration 不是整数（「n.0」算整数）：整批隔离"
    - "duration 与 outTime − inTime 的差超过阈值的，入对账差异但不拒绝——这是平台内部口径差，不由本方抹平（core 测试，WARN）"
    - "跨日区间按 inTime 归日，与班次求交时跨分区取数"
  recon: "区间时长合计 vs IDX_04_02_002 签入时长（见 if03c）。两者同源不同接口，差异即平台内部口径差"

# 联调时必须用真实环境核实、不能按文档推断的事项。核实结论回写到本节并递增 contract_version
integration_checks:
  - id: day_semantics
    question: "hindex/agent 返回的是哪一天的数据（当日至今？最近一个报表批完成的那天？），按网关哪个时区切日，能否查指定日期？（Q36）"
    why: "整个接入按「当日至今」实现（DD-98 第一条）。若能按日期查，回补成为可能，契约与 if03c 的归日规则都要改"
    status: open
  - id: open_interval_duration
    question: "未签出的区间 outTime 是空串还是 null？duration 是到观测时刻为止，还是空、还是 0？（Q37）"
    why: "未签出的区间在报表里算到观测时刻；duration 的含义决定在岗时长的对账口径"
    status: open
  - id: interval_scope
    question: "返回的是「当日签入的区间」还是「与当日有交集的区间」？前一天签入、今天仍在线的区间今天还返回吗？（Q38）"
    why: "决定跨日区间会不会在两天的观测里各出现一次（键相同，按 inTime 只算一段），以及昨天签入未签出的区间何时定稿"
    status: open
  - id: response_types
    question: "id、inTime、outTime、duration 的实际类型（文档 id 为 int、样例为字符串；duration 为字符串）"
    why: "接入程序两种都能读、raw 原样存；核实后收紧"
    status: open
  - id: missing_agents
    question: "请求里的工号在响应里没有对应记录，意味着什么——当日已删除、当日没有数据，还是异常？（Q40）"
    why: "答复前缺失的工号登记在 raw.icp_agent_coverage、不隔离（DD-98 评审注）；连续多次未返回由监控报出"
    status: open
