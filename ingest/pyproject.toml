# Ingestion program (DD-84 · LD-01 2.5)
#
# Installed into its own /opt/oss911/venv-ingest, offline, by infra/playbooks/30-python.yml:
# dependencies follow infra/ingest-requirements.lock in the repository; the build uses the setuptools from that
# lock (--no-build-isolation -- offline there is no PyPI for build isolation to fetch setuptools from).
#
# Licensing (DD-86 · LD-09 4.2): import only permissively licensed or LGPL libraries; LGPL libraries (psycopg)
# are not modified, not statically linked, and the program must never be frozen into a single-file executable
# with PyInstaller / Nuitka or the like. A new dependency needs its licence confirmed first, plus updates to
# infra/artifacts/MANIFEST.md and compliance/components.csv.

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "oss911-ingest"
version = "0.1.0"
description = "OSS911 BI ingestion: fetch by source contract, validate, write raw, advance the watermark"
requires-python = ">=3.12"
dependencies = [
    "psycopg[binary]",   # PostgreSQL driver, LGPL-3 (DD-86)
    "PyYAML",            # reads the contracts, MIT
]

[project.scripts]
oss911-ingest = "oss911_ingest.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
